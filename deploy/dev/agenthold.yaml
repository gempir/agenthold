# Server config for `make dev` (mounted via AGENTHOLD_CONFIG).
data_dir: /data
public_url: http://localhost:8080
dev_proxy: http://web:5173
test_harness: true
auth:
  # Local admin for development: username admin, password admin
  # (hash from `agenthold hash-password`). Works without Keycloak.
  local:
    username: admin
    password_hash: $argon2id$v=19$m=65536,t=3,p=4$n+qTSj1iaT9J18JcHD66TA$krvYz+qGs3qgHCmCGqfow/9RituEvdbFMufWxGqBacQ
  providers:
    - id: keycloak
      type: oidc
      name: Keycloak (dev)
      # Issuer and browser redirects use the host-visible name; the server
      # fetches discovery, tokens and keys over the compose network.
      issuer: http://localhost:8081/realms/agenthold
      discovery_url: http://keycloak:8081/realms/agenthold
      client_id: agenthold
      client_secret: agenthold-dev-secret

    # GitHub login: create an OAuth app (see https://agenthold.dev/auth-github/) and export
    # GITHUB_CLIENT_ID / GITHUB_CLIENT_SECRET before `make dev`, then uncomment.
    # - id: github
    #   type: github
    #   name: GitHub
    #   client_id: ${GITHUB_CLIENT_ID}
    #   client_secret: ${GITHUB_CLIENT_SECRET}

sandbox:
  driver: docker
  # Build it with: make base-image
  default_image: agenthold/base:dev
  idle_check_interval: 10s
  sandboxd_path: /src/tmp/sandboxd
  docker:
    name_prefix: agenthold-dev
    sandboxd_volume: agenthold-dev-bin
    sandboxd_volume_dir: /var/lib/agenthold/bin
