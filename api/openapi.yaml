      description: |
        Inbound webhook (no session or token: the URL is the secret). The
        request body (up to 256 KiB) becomes part of the prompt, clearly marked
        as untrusted. If the webhook has a signing secret, the signature
        header must hold the HMAC-SHA256 of the body ("sha256=<hex>" or hex).
      requestBody:
        content:
          "*/*":
            schema: { type: string, format: binary }
      responses:
        "202": { description: The turn started. }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }

  /me/git:
    get:
      operationId: getGitSettings
      tags: [git]
      description: Your git author identity and connected HTTPS credentials.
      responses:
        "200":
          description: Current git settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GitSettings" }
    put:
      operationId: updateGitSettings
      tags: [git]
      description: Update your git author name and email (empty values fall back to your account profile).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [authorName, authorEmail]
              properties:
                authorName: { type: string, maxLength: 200 }
                authorEmail: { type: string, maxLength: 320 }
      responses:
        "200":
          description: Updated git settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GitSettings" }
        "400": { $ref: "#/components/responses/Error" }

  /me/git/credentials:
    post:
      operationId: upsertGitCredential
      tags: [git]
      description: Store or replace an HTTPS git credential for a host. Tokens are encrypted at rest and injected by the egress proxy.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GitCredentialInput" }
      responses:
        "200":
          description: Stored credential metadata.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GitCredential" }
        "400": { $ref: "#/components/responses/Error" }

  /me/git/credentials/{credentialId}:
    parameters:
      - name: credentialId
        in: path
        required: true
        schema: { type: string }
    delete:
      operationId: deleteGitCredential
      tags: [git]
      responses:
        "204": { description: Deleted. }
        "404": { $ref: "#/components/responses/Error" }

  /me/git/github/device:
    post:
      operationId: startGitHubConnect
      tags: [git]
      description: >-
        Start connecting your GitHub account with GitHub's device flow. Open verificationUri, enter userCode,
        then poll until the status is connected. The device code and the resulting token stay on the server.
      responses:
        "201":
          description: The code to enter at GitHub.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GitHubDeviceFlow" }
        "502": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /me/git/github/device/{flowId}:
    parameters:
      - name: flowId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: pollGitHubConnect
      tags: [git]
      description: >-
        Check whether you approved the connection at GitHub. agenthold asks GitHub at most once per interval;
        on approval the account is stored as your github.com credential (replacing a token stored for it).
      responses:
        "200":
          description: The state of the connection attempt.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GitHubDevicePoll" }
        "404": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    delete:
      operationId: cancelGitHubConnect
      tags: [git]
      responses:
        "204": { description: Cancelled. }

  /agents/{agentId}/git/repos:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    get:
      operationId: listAgentGitRepos
      tags: [git]
      description: Discover git repositories and worktrees inside a running agent's home directory.
      responses:
        "200":
          description: Discovered repositories.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GitRepoList" }
        "404": { $ref: "#/components/responses/Error" }

  /agents/{agentId}/git/status:
    parameters:
      - $ref: "#/components/parameters/AgentId"
      - name: path
        in: query
        schema: { type: string }
        description: Relative path inside the agent's home directory (empty for home).
    get:
      operationId: getAgentGitStatus
      tags: [git]
      description: Inspect git repository status and branches for a directory in a running agent.
      responses:
        "200":
          description: Repository status and branch list.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GitRepoStatus" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /agents/{agentId}/git/clone:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    post:
      operationId: cloneAgentGitRepo
      tags: [git]
      description: Clone a git repository into a running agent's home directory.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, minLength: 1, maxLength: 2048 }
                path: { type: string, maxLength: 4096, description: "Optional target directory relative to home." }
                branch: { type: string, maxLength: 255, description: "Optional branch to check out." }
      responses:
        "201":
          description: Cloned repository.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GitRepo" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /agents/{agentId}/git/checkout:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    post:
      operationId: checkoutAgentGitBranch
      tags: [git]
      description: Switch to or create a branch in a repository inside a running agent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path, branch]
              properties:
                path: { type: string, maxLength: 4096 }
                branch: { type: string, minLength: 1, maxLength: 255 }
                create: { type: boolean }
                fromRef: { type: string, maxLength: 255 }
      responses:
        "200":
          description: Updated repository state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GitRepo" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /agents/{agentId}/git/worktrees:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    post:
      operationId: createAgentGitWorktree
      tags: [git]
      description: Create a new git worktree for a repository inside a running agent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path, branch]
              properties:
                path: { type: string, maxLength: 4096, description: "Repository path relative to home." }
                branch: { type: string, minLength: 1, maxLength: 255 }
                create: { type: boolean, description: "Create a new branch for the worktree." }
                fromRef: { type: string, maxLength: 255, description: "Optional base ref when creating a new branch." }
                worktreePath: { type: string, maxLength: 4096, description: "Optional worktree path relative to home." }
      responses:
        "201":
          description: Created worktree.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GitRepo" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /agents/{agentId}/git/pull:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    post:
      operationId: pullAgentGitRepo
      tags: [git]
      description: Fetch or pull updates in a repository inside a running agent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path: { type: string, maxLength: 4096 }
                fetchOnly: { type: boolean }
      responses:
        "200":
          description: Updated repository state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GitRepo" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /agents/{agentId}/git/push:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    post:
      operationId: pushAgentGitRepo
      tags: [git]
      description: >-
        Push the branch a repository inside a running agent is on. A branch without an upstream is pushed to
        origin (or the only remote) and tracks it. force uses --force-with-lease.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path: { type: string, maxLength: 4096 }
                force: { type: boolean }
      responses:
        "200":
          description: Repository state after the push.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GitRepo" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /agents/{agentId}/git/worktrees/remove:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    post:
      operationId: removeAgentGitWorktree
      tags: [git]
      description: >-
        Remove a linked worktree inside a running agent (its branch stays). force removes it even with
        uncommitted changes. Returns the state of its main repository.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path: { type: string, maxLength: 4096, description: "Worktree path relative to home." }
                force: { type: boolean }
      responses:
        "200":
          description: The worktree's main repository.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GitRepo" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /agents/{agentId}/git/diff:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    get:
      operationId: getAgentGitDiff
      tags: [git]
      description: >-
        A structured diff of the repository a directory is in. uncommitted: staged, unstaged and untracked
        changes against HEAD. branch: the work tree (committed and uncommitted changes, untracked files) against
        the merge base with base (default origin/HEAD, origin/main, origin/master, main or master). commit: the
        commit ref against its first parent. Large and binary files come without a patch (truncated, binary).
      parameters:
        - { name: path, in: query, schema: { type: string, maxLength: 4096 }, description: "A directory of the repository, relative to the home." }
        - name: mode
          in: query
          schema: { type: string, enum: [uncommitted, branch, commit], default: uncommitted }
        - { name: ref, in: query, schema: { type: string, maxLength: 255 }, description: "The commit (mode commit)." }
        - { name: base, in: query, schema: { type: string, maxLength: 255 }, description: "The branch to compare with (mode branch)." }
        - { name: context, in: query, schema: { type: integer, minimum: 0, maximum: 1000, default: 3 }, description: "Context lines." }
      responses:
        "200":
          description: The diff.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GitDiff" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /agents/{agentId}/git/commits:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    get:
      operationId: listAgentGitCommits
      tags: [git]
      description: The latest commits of the branch a repository inside a running agent is on.
      parameters:
        - { name: path, in: query, schema: { type: string, maxLength: 4096 }, description: "A directory of the repository, relative to the home." }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 50 } }
      responses:
        "200":
          description: Commits, newest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GitCommitList" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /agents/{agentId}/git/commit:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    post:
      operationId: commitAgentGitRepo
      tags: [git]
      description: >-
        Commit in a repository or worktree inside a running agent: what is staged, or with all everything
        (git add -A first).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path, message]
              properties:
                path: { type: string, maxLength: 4096 }
                message: { type: string, minLength: 1, maxLength: 65536 }
                all: { type: boolean, description: "Stage all changes (git add -A) first." }
      responses:
        "201":
          description: The new commit and the repository after it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GitCommitResult" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /sessions/{sessionId}/git:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    patch:
      operationId: updateSessionGit
      tags: [sessions, git]
      description: Update a session's working directory or refresh its detected git project and branch.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                cwd: { type: string, maxLength: 4096, description: "Working directory relative to home (empty clears)." }
                refresh: { type: boolean, description: "Re-detect git project and branch from the running sandbox." }
      responses:
        "200":
          description: Updated session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /me/executor:
    get:
      operationId: getExecutorStatus
      tags: [executor]
      description: Status of the current user's managed Executor instance.
      responses:
        "200":
          description: Executor status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExecutorStatus" }

  /me/executor/start:
    post:
      operationId: startExecutor
      tags: [executor]
      description: Start the current user's managed Executor instance if it is not running yet.
      responses:
        "200":
          description: Executor status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExecutorStatus" }
        "502": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /me/executor/restart:
    post:
      operationId: restartExecutor
      tags: [executor]
      description: Restart the current user's managed Executor instance.
      responses:
        "200":
          description: Executor status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExecutorStatus" }
        "502": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /me/executor/overview:
    get:
      operationId: getExecutorOverview
      tags: [executor]
      description: Apps, connected accounts and account links in the current user's Executor instance.
      responses:
        "200":
          description: Executor overview.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExecutorOverview" }
        "502": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /me/executor/catalog:
    get:
      operationId: listExecutorCatalog
      tags: [executor]
      description: Official apps available to install from the Executor catalog.
      responses:
        "200":
          description: Catalog entries.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExecutorCatalog" }
        "502": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /me/executor/catalog/import:
    post:
      operationId: importExecutorCatalogApp
      tags: [executor]
      description: Install an app from the Executor catalog into the user's Executor instance.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entry, name]
              properties:
                entry: { type: string, minLength: 1, maxLength: 200 }
                name: { type: string, minLength: 1, maxLength: 120 }
      responses:
        "201":
          description: Installed app.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExecutorApp" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /me/executor/apps/import:
    post:
      operationId: importExecutorCustomApp
      tags: [executor]
      description: Import a remote MCP server as an Executor app.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, url]
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
                url: { type: string, minLength: 1, maxLength: 2048 }
      responses:
        "201":
          description: Installed app.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExecutorApp" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /me/executor/apps/{appId}:
    parameters:
      - name: appId
        in: path
        required: true
        schema: { type: string }
    delete:
      operationId: deleteExecutorApp
      tags: [executor]
      description: Remove an installed app from the user's Executor instance.
      responses:
        "204": { description: Deleted. }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /me/executor/apps/{appId}/accounts/{scope}/{requirement}/connect:
    parameters:
      - name: appId
        in: path
        required: true
        schema: { type: string }
      - name: scope
        in: path
        required: true
        schema: { type: string, enum: [user, app] }
      - name: requirement
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: startExecutorAccountConnect
      tags: [executor]
      description: Create an Executor account connection session for an app requirement, returning its auth methods, secret fields and browser URL.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                accountId: { type: string, description: "Optional existing account ID to reconnect or update credentials for." }
      responses:
        "201":
          description: Connection session ready.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExecutorConnectionSession" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /me/executor/connections/submit:
    post:
      operationId: submitExecutorAccountConnect
      tags: [executor]
      description: Submit secret credentials for a pending Executor connection session. Credentials are encrypted by Executor and never enter sandboxes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [connectionId, token, method, fields]
              properties:
                connectionId: { type: string, minLength: 1 }
                token: { type: string, minLength: 1 }
                method: { type: string, minLength: 1 }
                label: { type: string, maxLength: 120 }
                description: { type: string, maxLength: 500 }
                fields:
                  type: object
                  additionalProperties: { type: string }
      responses:
        "200":
          description: Connected account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExecutorAccount" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /me/executor/apps/{appId}/accounts/{scope}/{requirement}/{accountId}:
    parameters:
      - name: appId
        in: path
        required: true
        schema: { type: string }
      - name: scope
        in: path
        required: true
        schema: { type: string, enum: [user, app] }
      - name: requirement
        in: path
        required: true
        schema: { type: string }
      - name: accountId
        in: path
        required: true
        schema: { type: string }
    put:
      operationId: linkExecutorAccount
      tags: [executor]
      description: Link an existing saved Executor account to an app requirement.
      responses:
        "204": { description: Linked. }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    delete:
      operationId: unlinkExecutorAccount
      tags: [executor]
      description: Unlink an Executor account from an app requirement.
      responses:
        "204": { description: Unlinked. }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /me/executor/accounts/{accountId}:
    parameters:
      - name: accountId
        in: path
        required: true
        schema: { type: string }
    patch:
      operationId: updateExecutorAccount
      tags: [executor]
      description: Rename an Executor account or update its agent-facing description.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label: { type: string, minLength: 1, maxLength: 120 }
                description: { type: string, maxLength: 500, description: "Agent-facing description. Send an empty string to clear." }
      responses:
        "200":
          description: Updated account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExecutorAccount" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteExecutorAccount
      tags: [executor]
      description: Disconnect and remove a saved Executor account.
      responses:
        "204": { description: Deleted. }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /me/executor/accounts/{accountId}/health:
    parameters:
      - name: accountId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: checkExecutorAccountHealth
      tags: [executor]
      description: Check the credential health of a saved Executor account.
      responses:
        "200":
          description: Health check result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExecutorAccountHealth" }
        "404": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      description: The signed-in user's projects.
      responses:
        "200":
          description: Projects by name.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Project" }
    post:
      operationId: createProject
      tags: [projects]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /projects/{projectId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getProject
      tags: [projects]
      responses:
        "200":
          description: The project.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateProject
      tags: [projects]
      description: >-
        Replace the project's name, description, instructions and sources. Sources are matched by name; changing a
        source does not move existing checkouts on agents' disks. The slug (directory name) never changes.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteProject
      tags: [projects]
      description: Delete the project and its tasks. Threads and checkouts on agents' disks stay.
      responses:
        "204": { description: Deleted. }
        "404": { $ref: "#/components/responses/Error" }

  /projects/{projectId}/status:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getProjectStatus
      tags: [projects]
      description: >-
        The project's threads with the files each changed on its branch (for agents whose machines run), and the
        files more than one thread changed.
      parameters:
        - name: includeSettled
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: Status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectStatus" }
        "404": { $ref: "#/components/responses/Error" }

  /projects/{projectId}/threads:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      operationId: startProjectThread
      tags: [projects]
      description: >-
        Start a thread of the project on an agent. By default it gets a workspace of its own: a git worktree of every
        source on a new branch. direct works in the main checkouts instead.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agentId]
              properties:
                agentId: { type: string }
                title: { type: string, maxLength: 200 }
                direct: { type: boolean }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /sessions/{sessionId}/project/changes:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      operationId: getSessionProjectChanges
      tags: [projects]
      description: What the project thread changed on its branch, per source. The agent's machine must run.
      responses:
        "200":
          description: Changes.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProjectSourceChanges" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /sessions/{sessionId}/project/merge:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      operationId: mergeSessionProject
      tags: [projects]
      description: >-
        Merge the project thread's branch into the main checkout of every source it has commits in. Uncommitted
        changes, or a main checkout that is not clean or not on its default branch, refuse it before anything is
        merged; a conflict aborts that source's merge and stops. A full merge marks the thread's tasks done.
      responses:
        "200":
          description: What was merged.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProjectSourceResult" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /sessions/{sessionId}/project/push:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      operationId: pushSessionProject
      tags: [projects]
      description: Push the project thread's branch of every repository it has commits in.
      responses:
        "200":
          description: What was pushed.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProjectSourceResult" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /sessions/{sessionId}/project/close:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      operationId: closeSessionProject
      tags: [projects]
      description: >-
        Remove the project thread's workspace (its worktrees and branches) and settle the thread. Without force it
        refuses uncommitted changes and commits that are not merged; force discards them.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                force: { type: boolean }
      responses:
        "200":
          description: Closed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  # --- Phase 2A: Organization Tools, Skills, Provider Logins & In-Thread Secret Requests ---

  /org/tools:
    get:
      operationId: listOrgTools
      tags: [org]
      description: >-
        List organization-provided MCP servers and Executor apps visible to the
        signed-in user's role, including per-user enabled preference, hasSecret
        flag (never secret values), and Executor connection status when available.
      responses:
        "200":
          description: Organization tools.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OrgTool" }
    post:
      operationId: createOrgTool
      tags: [org]
      description: Create an organization-provided MCP server or Executor app (Admin only).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrgToolInput" }
      responses:
        "201":
          description: Created organization tool.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrgTool" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /org/tools/{toolId}:
    parameters:
      - name: toolId
        in: path
        required: true
        schema: { type: string }
    put:
      operationId: updateOrgTool
      tags: [org]
      description: Update an organization tool (Admin only). Omit secret to preserve the existing encrypted secret.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrgToolInput" }
      responses:
        "200":
          description: Updated organization tool.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrgTool" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteOrgTool
      tags: [org]
      description: Delete an organization tool (Admin only).
      responses:
        "204": { description: Deleted. }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /me/org-tools/{toolId}:
    parameters:
      - name: toolId
        in: path
        required: true
        schema: { type: string }
    put:
      operationId: setUserOrgToolPreference
      tags: [org]
      description: Enable or disable an organization tool for the signed-in user.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserOrgToolPreferenceInput" }
      responses:
        "200":
          description: Updated tool status for the signed-in user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrgTool" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /me/org-tools/{toolId}/connect:
    parameters:
      - name: toolId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: connectOrgTool
      tags: [org]
      description: >-
        One-step connect for an executor_app organization tool with user_oauth:
        transparently installs the catalog app into the user's Executor instance
        if not yet installed and starts/returns an account connection session.
      responses:
        "200":
          description: Installed app and connection session (or already connected status).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrgToolConnectResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /org/skills:
    get:
      operationId: listOrgSkills
      tags: [org]
      description: List organization-wide skills auto-delivered to agents.
      responses:
        "200":
          description: Organization skills.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OrgSkill" }
    post:
      operationId: createOrgSkill
      tags: [org]
      description: Create an organization skill (Admin only).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrgSkillInput" }
      responses:
        "201":
          description: Created organization skill.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrgSkill" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /org/skills/{skillId}:
    parameters:
      - name: skillId
        in: path
        required: true
        schema: { type: string }
    put:
      operationId: updateOrgSkill
      tags: [org]
      description: Update an organization skill (Admin only).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrgSkillInput" }
      responses:
        "200":
          description: Updated organization skill.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrgSkill" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteOrgSkill
      tags: [org]
      description: Delete an organization skill (Admin only).
      responses:
        "204": { description: Deleted. }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /org/providers:
    get:
      operationId: listOrgProviders
      tags: [org]
      description: List organization shared provider logins (never returns secrets).
      responses:
        "200":
          description: Organization provider logins.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OrgProviderLogin" }

  /org/providers/{provider}:
    parameters:
      - name: provider
        in: path
        required: true
        schema: { type: string }
    put:
      operationId: upsertOrgProvider
      tags: [org]
      description: Configure or update an organization shared provider login (Admin only).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrgProviderLoginInput" }
      responses:
        "200":
          description: Configured organization provider login.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrgProviderLogin" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteOrgProvider
      tags: [org]
      description: Remove an organization shared provider login (Admin only).
      responses:
        "204": { description: Deleted. }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /sessions/{sessionId}/secret-requests/{requestId}:
    parameters:
      - $ref: "#/components/parameters/SessionId"
      - name: requestId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: respondSecretRequest
      tags: [sessions]
      description: >-
        Submit or decline an in-thread secret request emitted by the request_secret
        platform MCP tool. Submitted values are encrypted directly into the user's
        secret store and egress proxy and never appear in chat history.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SecretRequestSubmitInput" }
      responses:
        "200":
          description: Resolution result (never contains the secret value).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecretRequestResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  # --- Phase 4A: the machine's headless browser (sandbox browser) ---

  /agents/{agentId}/browser/status:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    get:
      operationId: getBrowserStatus
      tags: [browser]
      description: |
        Whether the machine can run its headless browser (Chromium) and whether
        it runs, with the page it shows. Never starts the browser.
      responses:
        "200":
          description: Status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrowserState" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /agents/{agentId}/browser/navigate:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    post:
      operationId: browserNavigate
      tags: [browser]
      description: |
        Open a URL in the machine's headless browser (started on first use) and
        wait for it to load. `http://localhost:<port>` reaches servers inside
        the machine, exposed or not. Only http and https URLs open; a bare host
        gets `http://`. Answers with a screenshot and the page's interactive
        elements. Audited. 503 when the machine has no Chromium.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BrowserNavigateInput" }
      responses:
        "200":
          description: The page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrowserState" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /agents/{agentId}/browser/screenshot:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    get:
      operationId: browserScreenshot
      tags: [browser]
      description: |
        A PNG screenshot of the browser's viewport with the interactive
        elements' boxes. `width` and `height` resize the viewport first.
      parameters:
        - { name: width, in: query, schema: { type: integer, minimum: 200, maximum: 3840 } }
        - { name: height, in: query, schema: { type: integer, minimum: 200, maximum: 4320 } }
      responses:
        "200":
          description: The page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrowserState" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /agents/{agentId}/browser/interact:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    post:
      operationId: browserInteract
      tags: [browser]
      description: |
        One input action on the page: `click` (at `x`/`y` viewport pixels or
        the center of `selector`), `type` (`text`, into `selector` when set),
        `press` (`key`: Enter, Tab, Escape, ArrowDown, a, Control+a, ...),
        `scroll` (`dx`/`dy`), `back`, `forward`, `reload`, or `eval`: a
        read-only DOM query returning the elements matching the CSS
        `selector` (`matches`; it runs no caller script). Answers with a new
        screenshot (not for `eval`). Audited.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BrowserInteractInput" }
      responses:
        "200":
          description: The page after the action.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrowserState" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /agents/{agentId}/browser/snapshot:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    get:
      operationId: browserSnapshot
      tags: [browser]
      description: |
        The page's visible text and interactive elements (role, accessible
        name, CSS selector, box), without a screenshot.
      responses:
        "200":
          description: The page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrowserState" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /agents/{agentId}/browser/close:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    post:
      operationId: browserClose
      tags: [browser]
      description: Stop the machine's headless browser. Audited.
      responses:
        "200":
          description: Stopped.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrowserState" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  # --- Phase 3A: Multiplayer Thread Sharing, Guest Links & Collaborative Review Comments ---

  /me/shared-threads:
    get:
      operationId: listMySharedThreads
      tags: [sharing]
      description: List individual threads shared directly with the current user.
      responses:
        "200":
          description: Threads shared with the current user.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SharedThread" }

  /sessions/{sessionId}/shares:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      operationId: listSessionShares
      tags: [sharing]
      description: List users with thread-level access to this session.
      responses:
        "200":
          description: Thread access list.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionAccessList" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: shareSession
      tags: [sharing]
      description: Share this individual thread with an existing user by verified email (viewer or collaborator).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SessionShareInput" }
      responses:
        "200":
          description: Thread shared.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionShare" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /sessions/{sessionId}/shares/{userId}:
    parameters:
      - $ref: "#/components/parameters/SessionId"
      - { name: userId, in: path, required: true, schema: { type: string } }
    delete:
      operationId: unshareSession
      tags: [sharing]
      description: Revoke a user's thread-level access (or leave a thread shared with you).
      responses:
        "204": { description: Share removed. }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /sessions/{sessionId}/guest-links:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      operationId: listSessionGuestLinks
      tags: [sharing]
      description: List guest links created for this thread.
      responses:
        "200":
          description: Guest links.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/GuestLink" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: createSessionGuestLink
      tags: [sharing]
      description: Create a 24-hour single-thread guest link returning the one-time raw URL (/guest/<token>).
      responses:
        "201":
          description: Guest link created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuestLinkCreated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /sessions/{sessionId}/guest-links/{linkId}:
    parameters:
      - $ref: "#/components/parameters/SessionId"
      - { name: linkId, in: path, required: true, schema: { type: string } }
    delete:
      operationId: revokeSessionGuestLink
      tags: [sharing]
      description: Instantly revoke an active guest link for this thread.
      responses:
        "204": { description: Guest link revoked. }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /sessions/{sessionId}/guest-requests:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      operationId: listSessionGuestRequests
      tags: [sharing]
      description: List guest message requests for this thread.
      responses:
        "200":
          description: Guest requests.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/GuestRequest" }
        "404": { $ref: "#/components/responses/Error" }

  /sessions/{sessionId}/guest-requests/{requestId}/approve:
    parameters:
      - $ref: "#/components/parameters/SessionId"
      - { name: requestId, in: path, required: true, schema: { type: string } }
    post:
      operationId: approveSessionGuestRequest
      tags: [sharing]
      description: Approve a pending guest request and send it as a prompt in the thread.
      responses:
        "200":
          description: Approved and sent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuestRequest" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /sessions/{sessionId}/guest-requests/{requestId}/dismiss:
    parameters:
      - $ref: "#/components/parameters/SessionId"
      - { name: requestId, in: path, required: true, schema: { type: string } }
    post:
      operationId: dismissSessionGuestRequest
      tags: [sharing]
      description: Dismiss a pending guest request without sending it to the agent.
      responses:
        "200":
          description: Dismissed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuestRequest" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /sessions/{sessionId}/review-comments:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      operationId: listSessionReviewComments
      tags: [sharing]
      description: List collaborative diff review comments attached to this thread.
      responses:
        "200":
          description: Review comments.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SessionReviewComment" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: createSessionReviewComment
      tags: [sharing]
      description: Create a persistent diff review comment on this thread (allowed for viewers, collaborators, shared users, and owner).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SessionReviewCommentInput" }
      responses:
        "201":
          description: Comment created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionReviewComment" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /sessions/{sessionId}/review-comments/{commentId}/resolve:
    parameters:
      - $ref: "#/components/parameters/SessionId"
      - { name: commentId, in: path, required: true, schema: { type: string } }
    post:
      operationId: resolveSessionReviewComment
      tags: [sharing]
      description: Mark a diff review comment as resolved.
      responses:
        "200":
          description: Resolved comment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionReviewComment" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /sessions/{sessionId}/review-comments/{commentId}:
    parameters:
      - $ref: "#/components/parameters/SessionId"
      - { name: commentId, in: path, required: true, schema: { type: string } }
    delete:
      operationId: deleteSessionReviewComment
      tags: [sharing]
      description: Delete a diff review comment (author, collaborator, or owner).
      responses:
        "204": { description: Deleted. }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /sessions/{sessionId}/handoff:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      operationId: handoffSession
      tags: [sharing]
      description: Record a @teammate handoff notice in the thread event log.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SessionHandoffInput" }
      responses:
        "200":
          description: Handoff recorded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionHandoffResult" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /guest/{token}:
    parameters:
      - { name: token, in: path, required: true, schema: { type: string } }
    get:
      operationId: getGuestThread
      tags: [auth-flow]
      security: []
      description: Public unauthenticated guest view of a single shared thread (metadata, event history, and pending guest requests; no diffs, files, settings, or secrets).
      responses:
        "200":
          description: Guest thread view.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuestThreadView" }
        "404": { $ref: "#/components/responses/Error" }

  /guest/{token}/stream:
    parameters:
      - { name: token, in: path, required: true, schema: { type: string } }
      - { name: after, in: query, schema: { type: integer, format: int64 } }
    get:
      operationId: streamGuestThread
      tags: [streams]
      security: []
      description: Public WebSocket live stream of session events for a guest link token.
      responses:
        "101": { description: WebSocket upgrade. }
        "404": { $ref: "#/components/responses/Error" }

  /guest/{token}/requests:
    parameters:
      - { name: token, in: path, required: true, schema: { type: string } }
    post:
      operationId: createGuestRequest
      tags: [auth-flow]
      security: []
      description: Submit a guest message request queued for owner or collaborator approval.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GuestRequestInput" }
      responses:
        "201":
          description: Guest request queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuestRequest" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }


  # Phase 4B: Inline visual replies & MCP Apps
  /sessions/{sessionId}/visuals/{eventSeq}:
    parameters:
      - $ref: "#/components/parameters/SessionId"
      - name: eventSeq
        in: path
        required: true
        schema: { type: integer, format: int64, minimum: 1 }
    get:
      operationId: getSessionVisual
      tags: [sessions]
      description: >-
        Return the raw self-contained HTML for a stored visual or MCP App session event,
        served with strict sandbox Content-Security-Policy headers. Pass download=true to
        trigger an attachment download.
      parameters:
        - name: download
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: Sandboxed HTML document.
          content:
            text/html:
              schema: { type: string }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

security:
  - session: []
  - token: []

components:
  securitySchemes:
    token:
      type: http
      scheme: bearer
      description: A personal access token (POST /me/tokens).
    session:
      type: apiKey
      in: cookie
      name: agenthold_session

  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: string }
    TaskId:
      name: taskId
      in: path
      required: true
      schema: { type: string }
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string }
    AgentId:
      name: agentId
      in: path
      required: true
      description: The machine id (an agent's or, for machine sub-resources, an app's).
      schema: { type: string }
    AppId:
      name: appId
      in: path
      required: true
      schema: { type: string }
    ServiceName:
      name: serviceName
      in: path
      required: true
      schema: { type: string }
  responses:
    Error:
      description: Error.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    SlackSettings:
      type: object
      required: [configured, enabled, connected]
      properties:
        configured: { type: boolean, description: Tokens are stored. }
        enabled: { type: boolean }
        teamId: { type: string }
        teamName: { type: string }
        botUserId: { type: string }
        connected: { type: boolean, description: The Socket Mode connection is up. }
        lastError: { type: string, description: Why the connection last failed. }
        updatedAt: { type: string, format: date-time }
    SlackTokens:
      type: object
      required: [botToken, appToken]
      properties:
        botToken: { type: string, description: "Bot User OAuth Token (xoxb-…)." }
        appToken: { type: string, description: "App-level token with connections:write (xapp-…)." }
    SlackIdentity:
      type: object
      required: [teamId, teamName, slackUserId, slackUserName, createdAt]
      properties:
        teamId: { type: string }
        teamName: { type: string }
        slackUserId: { type: string }
        slackUserName: { type: string }
        createdAt: { type: string, format: date-time }
    SlackLinkPreview:
      type: object
      required: [teamId, teamName, slackUserId, slackUserName, expiresAt]
      properties:
        teamId: { type: string }
        teamName: { type: string }
        slackUserId: { type: string }
        slackUserName: { type: string }
        expiresAt: { type: string, format: date-time }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }

    Version:
      type: object
      required: [version, commit]
      properties:
        version: { type: string }
        commit: { type: string }

    AuthProvider:
      type: object
      required: [id, name, type]
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string, enum: [oidc, github, local], description: 'local: sign in with username and password (POST /auth/local).' }

    LocalLoginInput:
      type: object
      required: [username, password]
      properties:
        username: { type: string, maxLength: 256 }
        password: { type: string, maxLength: 1024 }

    User:
      type: object
      required: [id, email, name, avatarUrl]
      properties:
        id: { type: string }
        email: { type: string }
        name: { type: string }
        avatarUrl: { type: string }

    Me:
      type: object
      required: [user, admin, role, agents]
      properties:
        user: { $ref: "#/components/schemas/User" }
        role: { $ref: "#/components/schemas/Role" }
        admin: { type: boolean, description: "The Admin role: manages the installation." }
        agents: { $ref: "#/components/schemas/AgentQuota" }

    Role:
      type: string
      enum: [admin, user, disabled]
      description: >-
        What a user may do. admin: everything, including the installation-wide admin pages, with no agent limit.
        user: its own and shared agents, and creating agents up to its quota. disabled: nothing but signing out.

    AgentQuota:
      type: object
      required: [used]
      properties:
        used: { type: integer, description: Agents the user owns (templates and clones included). }
        max: { type: integer, description: The most the user may own (auth.user_max_agents); absent means no limit. }

    AdminUser:
      type: object
      required: [user, role, configRole, provider, username, agents, local, createdAt]
      properties:
        user: { $ref: "#/components/schemas/User" }
        role: { $ref: "#/components/schemas/Role" }
        configRole: { $ref: "#/components/schemas/Role" }
        override: { $ref: "#/components/schemas/Role" }
        provider: { type: string, description: The provider id the user signs in with (local for auth.local). }
        username: { type: string }
        agents: { type: integer }
        local: { type: boolean, description: The local admin; its role is always admin. }
        createdAt: { type: string, format: date-time }
        lastLoginAt: { type: string, format: date-time }

    SandboxState:
      type: string
      enum: [creating, starting, running, stopping, sleeping, rebuilding, destroying, error, unreachable]

    NodeInfo:
      type: object
      required: [id, name, online, local, agents]
      properties:
        id: { type: string }
        name: { type: string }
        online: { type: boolean }
        local: { type: boolean, description: The controller's built-in node. }
        arch: { type: string, description: "CPU architecture of the node (arm64 or amd64), when known." }
        agents: { type: integer, description: Agents placed on this node. }
        cpus: { type: integer, description: Logical CPUs reported by the node. }
        availableMemoryBytes: { type: integer, format: int64, description: Available memory at the last report. }
        freeDiskBytes: { type: integer, format: int64, description: Free data filesystem space at the last report. }
        lastSeen: { type: string, format: date-time, description: Last successful node contact. }

    OverviewAllocation:
      type: object
      required: [machines, cpus, memoryMb]
      description: Configured size (not usage) summed over a set of machines.
      properties:
        machines: { type: integer }
        cpus: { type: number, format: float, description: Sum of the machines' vCPUs. }
        memoryMb: { type: integer, format: int64, description: Sum of the machines' memory in MiB. }

    OverviewNode:
      type: object
      description: >-
        A node. `allocated` sums the configured size of every machine placed on it, whatever its state;
        `running` only of those running now.
      required: [id, name, online, local, allocated, running]
      properties:
        id: { type: string }
        name: { type: string }
        online: { type: boolean }
        local: { type: boolean, description: The controller's built-in node. }
        version: { type: string, description: "The agenthold release the node runs, if known." }
        lastSeen: { type: string, format: date-time }
        cpus: { type: integer, description: Logical CPUs (the last report if the node is offline). }
        memoryTotalBytes: { type: integer, format: int64, description: "Installed memory at the last report, if the node reports it." }
        availableMemoryBytes: { type: integer, format: int64, description: Available host memory at the last report. }
        freeDiskBytes: { type: integer, format: int64, description: Free data filesystem space at the last report. }
        diskAllocatedBytes: { type: integer, format: int64, description: "Space the machines' disk files occupy on the node (blocks actually allocated, not their sparse size), at the last report. Absent when the node does not report it." }
        allocated: { $ref: "#/components/schemas/OverviewAllocation" }
        running: { $ref: "#/components/schemas/OverviewAllocation" }

    OverviewUsage:
      type: object
      description: Usage measured inside a running machine.
      required: [sampledAt]
      properties:
        sampledAt: { type: string, format: date-time }
        cpuPercent:
          type: number
          format: float
          description: Share of the machine's vCPUs in use (0 to 100) between the two latest samples. Absent until there are two samples, and from guests that do not report it.
        memUsedBytes: { type: integer, format: int64 }
        memTotalBytes: { type: integer, format: int64 }
        homeUsedBytes: { type: integer, format: int64, description: Used space on the persistent home volume. }
        homeTotalBytes: { type: integer, format: int64, description: Size of the home volume. }
        rootUsedBytes: { type: integer, format: int64, description: Used space on the system volume (overlay). }
        rootTotalBytes: { type: integer, format: int64, description: Size of the system volume. }

    OverviewMachine:
      type: object
      required: [id, name, kind, isTemplate, owner, state, stateError, stateChangedAt, cpus, memoryMb, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        kind: { type: string, enum: [agent, app] }
        isTemplate: { type: boolean }
        owner: { $ref: "#/components/schemas/User" }
        nodeId: { type: string }
        nodeName: { type: string }
        state: { $ref: "#/components/schemas/SandboxState" }
        stateError: { type: string }
        stateChangedAt: { type: string, format: date-time }
        harness: { type: string, description: Agents only. }
        model: { type: string, description: Agents only; empty is the harness default. }
        cpus: { type: number, format: float, description: Configured vCPUs. }
        memoryMb: { type: integer, format: int64, description: Configured memory in MiB. }
        idleMinutes: { type: integer, description: Minutes without activity before it sleeps; 0 means never. }
        lastActivityAt: { type: string, format: date-time, description: Only while running. }
        sleepsAt: { type: string, format: date-time, description: Only while running and not busy. }
        createdAt: { type: string, format: date-time }
        usage: { $ref: "#/components/schemas/OverviewUsage" }
        usageReason:
          type: string
          enum: [node_offline, not_connected, timeout, unsupported, error]
          description: Why a running machine has no usage.

    OverviewTotals:
      type: object
      required: [machines, byState, allocated, running]
      properties:
        machines: { type: integer }
        byState:
          type: object
          description: Machines per sandbox state (offline nodes' machines count as unreachable).
          additionalProperties: { type: integer }
        allocated: { $ref: "#/components/schemas/OverviewAllocation" }
        running: { $ref: "#/components/schemas/OverviewAllocation" }

    AdminOverview:
      type: object
      required: [generatedAt, nodes, machines, totals]
      properties:
        generatedAt: { type: string, format: date-time }
        nodes: { type: array, items: { $ref: "#/components/schemas/OverviewNode" } }
        machines: { type: array, items: { $ref: "#/components/schemas/OverviewMachine" } }
        totals: { $ref: "#/components/schemas/OverviewTotals" }

    CreateNodeJoinToken:
      type: object
      properties:
        name: { type: string, description: Name for the node; by default the node proposes its hostname. }
        ttlMinutes: { type: integer, minimum: 1, maximum: 1440 }

    NodeJoinToken:
      type: object
      required: [token, expiresAt, command]
      properties:
        token: { type: string }
        expiresAt: { type: string, format: date-time }
        command: { type: string, description: The command to run on the new node. }

    AgentRole:
      type: string
      enum: [owner, shared]
      description: 'owner: full control. shared: use the agent (threads, terminal, files), not configure it.'

    Agent:
      type: object
      required: [id, name, owner, harness, model, modelOptions, permissionPolicy, executorEnabled, executorApprovalMode, credentialsInSandbox, login, cpus, memoryMb, idleMinutes, state, stateError, stateChangedAt, needsRebuild, isTemplate, role, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        owner: { $ref: "#/components/schemas/User" }
        nodeId: { type: string, description: Assigned node ID; absent before placement. }
        nodeName: { type: string, description: Assigned node name when known. }
        imageId: { type: string, description: "Custom image ID, or empty string for the built-in agenthold Base image." }
        imageName: { type: string, description: "Display name of the machine's image." }
        imageRevision: { type: integer, format: int64, description: "Pinned custom image revision (0 for built-in base)." }
        imageUpdateAvailable: { type: boolean, description: "True when the machine's custom image has a newer ready revision." }
        harness: { type: string }
        cpus: { type: number }
        memoryMb: { type: integer, format: int64 }
        idleMinutes: { type: integer }
        state: { $ref: "#/components/schemas/SandboxState" }
        stateError: { type: string }
        stateChangedAt: { type: string, format: date-time }
        needsRebuild:
          type: boolean
          description: Resources or environment changed since the sandbox was built.
        model: { type: string, description: The default model ('' is the harness's own default). }
        modelOptions:
          type: object
          additionalProperties: { type: string }
          description: Default model options, by harness config option id (see ModelCatalog).
        permissionPolicy: { type: string, enum: [auto-approve, ask] }
        executorEnabled:
          type: boolean
          description: Expose the owner's Executor accounts and apps to this agent through the built-in executor MCP server.
        executorApprovalMode:
          $ref: "#/components/schemas/ExecutorApprovalMode"
        credentialsInSandbox:
          type: boolean
          description: A harness login was completed inside the sandbox; the agent can read its own credentials.
        isTemplate:
          type: boolean
          description: The machine is a template. It cannot be started, chatted with or scheduled; clone it for a new machine.
        clonedFrom:
          type: string
          description: Id of the agent this one was cloned from, shown to the owner only. The source may no longer exist.
        login: { $ref: "#/components/schemas/AgentLogin" }
        lastActivityAt:
          type: string
          format: date-time
          description: Last activity while running (prompts, terminals, files, CPU use in the sandbox).
        sleepsAt:
          type: string
          format: date-time
          description: When the agent goes to sleep if nothing happens. Absent while busy or not running.
        role:
          $ref: "#/components/schemas/AgentRole"
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    AgentInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        cpus: { type: number }
        memoryMb: { type: integer, format: int64 }
        idleMinutes: { type: integer, minimum: 1, maximum: 10080 }
        harness: { type: string, description: Harness id (see /harnesses). Default claude-code. }
        model: { type: string }
        permissionPolicy: { type: string, enum: [auto-approve, ask] }
        executorEnabled: { type: boolean, description: "Expose the owner's Executor accounts and apps to this agent via MCP. Default false." }
        executorApprovalMode: { $ref: "#/components/schemas/ExecutorApprovalMode" }
        imageId:
          type: string
          description: >-
            Custom image ID to build the machine from, "base" for the built-in base image,
            or omit to use the installation's default image.
        nodeId:
          type: string
          description: >-
            Place the agent on this node (an `id` from `GET /nodes`). Omit it for automatic placement.
            Admins only (403 otherwise). 400 if the node does not exist; 409 if it is offline, cannot
            report its capacity or has less available memory than `memoryMb`. The agent stays on the
            node for its whole life.

    CloneInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        asTemplate: { type: boolean, description: Create the clone as a template instead of a machine. }

    AgentPatch:
      type: object
      properties:
        isTemplate:
          type: boolean
          description: |
            Convert the machine to a template or back to a normal machine. It is stopped first (409 while it
            works on a prompt). Converting to a template disables its schedules and webhooks; they stay
            disabled when it is converted back, and cannot be enabled while it is a template.
        name: { type: string, minLength: 1, maxLength: 100 }
        cpus: { type: number }
        memoryMb: { type: integer, format: int64 }
        idleMinutes: { type: integer, minimum: 1, maximum: 10080 }
        harness: { type: string, description: Harness id (see /harnesses). Default claude-code. }
        model: { type: string, description: The default model. Changing the harness without a model resets it. }
        modelOptions:
          type: object
          additionalProperties: { type: string }
          description: Default model options, by harness config option id. Changing the harness resets them.
        permissionPolicy: { type: string, enum: [auto-approve, ask] }
        executorEnabled: { type: boolean, description: "Expose the owner's Executor accounts and apps to this agent via MCP. Default false." }
        executorApprovalMode: { $ref: "#/components/schemas/ExecutorApprovalMode" }
        imageId:
          type: string
          description: >-
            Switch to another custom image ID (pinned to its latest ready revision), or "base" for
            the built-in base image. Takes effect after Reset system (needsRebuild).
        imageRevision:
          type: integer
          format: int64
          description: >-
            Upgrade or pin a specific ready revision of the machine's current custom image.
            Takes effect after Reset system (needsRebuild).

    ModelChoice:
      type: object
      required: [model]
      properties:
        model: { type: string, maxLength: 200, description: "Model id ('' keeps the default)." }
        options:
          type: object
          additionalProperties: { type: string, maxLength: 100 }
          description: Values by option id (ModelOption.id).

    ModelCatalog:
      type: object
      required: [harness, source, switchable, customModels, models]
      properties:
        harness: { type: string }
        source:
          type: string
          enum: [harness, fallback]
          description: |
            harness: what the harness reported the last time it ran (seenAt). fallback: agenthold's list for the
            harness, shown until the harness has reported its own; it may not match what the account can use.
        seenAt: { type: string, format: date-time, description: When the harness reported the list (source harness). }
        switchable:
          type: boolean
          description: |
            The harness switches models within a conversation, from the next message on. Otherwise a new default
            applies when the harness restarts, and conversations cannot choose their own.
        customModels:
          type: boolean
          description: The harness accepts model ids it does not list (OpenCode's provider/model).
        models:
          type: array
          items: { $ref: "#/components/schemas/CatalogModel" }
        login:
          $ref: "#/components/schemas/AgentLogin"
          description: Which login the agent has on this harness (its own, or the one asked for with `harness`).
        provisionalOptions:
          type: array
          description: |
            Effort levels the harness reported for other models, for the models whose options are still unknown
            (a harness describes only its current model; agenthold probes the others once the agent is idle).
            The harness has the last word at the next message: a level the model lacks is refused with a notice.
          items: { $ref: "#/components/schemas/ModelOption" }

    CatalogModel:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        group: { type: string, description: Heading in the picker (provider or family). }
        options:
          type: array
          description: The model's options; absent while unknown (the harness describes a model's options only while it is the current one, agenthold learns the others when the agent is idle).
          items: { $ref: "#/components/schemas/ModelOption" }

    ModelOption:
      type: object
      required: [id, name, kind, values]
      properties:
        id: { type: string, description: The harness's config option id. }
        name: { type: string }
        description: { type: string }
        kind:
          type: string
          enum: [effort, toggle]
          description: "effort: reasoning effort levels. toggle: on/off (fast mode); its values are off then on."
        values:
          type: array
          items: { $ref: "#/components/schemas/ModelOptionValue" }

    ModelOptionValue:
      type: object
      required: [value, name]
      properties:
        value: { type: string }
        name: { type: string }
        description: { type: string }

    SandboxLimits:
      type: object
      required: [defaultCpus, defaultMemoryMb, maxCpus, maxMemoryMb, minMemoryMb, driver]
      properties:
        driver: { type: string }
        defaultCpus: { type: number }
        defaultMemoryMb: { type: integer, format: int64 }
        maxCpus: { type: number }
        maxMemoryMb: { type: integer, format: int64 }
        minMemoryMb: { type: integer, format: int64, description: Smallest memory an agent can be given; smaller guests cannot run a harness. }

    FileEntry:
      type: object
      required: [name, size, mode, isDir, isLink, modTime]
      properties:
        name: { type: string }
        size: { type: integer, format: int64 }
        mode: { type: string }
        isDir: { type: boolean }
        isLink: { type: boolean }
        modTime: { type: string, format: date-time }

    DirListing:
      type: object
      required: [path, entries]
      properties:
        path: { type: string, description: Absolute path of the directory. }
        entries:
          type: array
          items: { $ref: "#/components/schemas/FileEntry" }

    TextFile:
      type: object
      required: [path, size, modTime, mimeType, isBinary, truncated, content]
      properties:
        path: { type: string, description: Path relative to the home. }
        size: { type: integer, format: int64 }
        modTime: { type: string, format: date-time }
        mimeType: { type: string }
        isBinary: { type: boolean }
        truncated: { type: boolean, description: Content holds only the start of the file (or of the line range). }
        content: { type: string, description: UTF-8 text; empty for binary files. }
        startLine: { type: integer, description: First line in content (with a line range). }
        endLine: { type: integer, description: Last line in content (with a line range). }
        totalLines: { type: integer, description: "Lines in the file (with a line range, when it was read to the end)." }

    FileMatch:
      type: object
      required: [path, name, isDir]
      properties:
        path: { type: string, description: Path relative to the search base. }
        name: { type: string }
        isDir: { type: boolean }

    FileSearchResult:
      type: object
      required: [base, results, truncated]
      properties:
        base: { type: string, description: The search base relative to the home. }
        results:
          type: array
          items: { $ref: "#/components/schemas/FileMatch" }
        truncated: { type: boolean, description: There are more matches (or not every file was searched). }

    ProjectScript:
      type: object
      required: [id, name, command, icon, runOnWorktreeCreate, async, stopOnSettle, runOnSettle, autoOpenPreview, longRunning]
      properties:
        id: { type: string, description: "The name as a slug, unique in the file." }
        name: { type: string }
        command: { type: string }
        icon: { type: string, enum: [play, test, lint, configure, build, debug] }
        runOnWorktreeCreate: { type: boolean }
        async: { type: boolean, description: "With runOnWorktreeCreate: do not wait for it to finish." }
        stopOnSettle: { type: boolean }
        runOnSettle: { type: boolean }
        previewUrl: { type: string }
        autoOpenPreview: { type: boolean }
        longRunning: { type: boolean, description: Runs as a supervised service (it has a previewUrl or stops on settle). }
        service: { type: string, description: The service a long-running script runs as. }
        status: { $ref: "#/components/schemas/ServiceStatus" }

    ProjectScripts:
      type: object
      required: [path, scripts]
      properties:
        path: { type: string, description: The directory relative to the home. }
        source: { type: string, enum: [agenthold.json, t3.json], description: The file the scripts come from (none when absent). }
        iconPath: { type: string }
        defaultThreadEnvMode: { type: string, enum: [local, worktree] }
        scripts:
          type: array
          items: { $ref: "#/components/schemas/ProjectScript" }
        error: { type: string, description: Why the file could not be read. }

    ProjectScriptRun:
      type: object
      required: [script, mode]
      properties:
        script: { $ref: "#/components/schemas/ProjectScript" }
        mode: { type: string, enum: [exec, service] }
        service: { type: string, description: The service it runs as (mode service). }
        exitCode: { type: integer }
        output: { type: string }
        truncated: { type: boolean }
        timedOut: { type: boolean }

    SecretRule:
      type: object
      required: [hosts, header, template]
      properties:
        hosts:
          type: array
          items: { type: string }
          description: Exact host names or "*.example.com".
        header: { type: string }
        template: { type: string, description: 'Header value; {{.Value}} is the secret. Function: base64.' }

    SecretPreset:
      type: object
      required: [id, name, rule, envVar, description]
      properties:
        id: { type: string }
        name: { type: string }
        rule: { $ref: "#/components/schemas/SecretRule" }
        envVar: { type: string }
        description: { type: string }

    Secret:
      type: object
      required: [id, name, rule, placeholder, owner, canManage, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        rule: { $ref: "#/components/schemas/SecretRule" }
        placeholder: { type: string, description: What sandboxes see instead of the value. }
        owner: { $ref: "#/components/schemas/User" }
        canManage: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    SecretInput:
      type: object
      required: [name, value]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        value: { type: string, minLength: 1 }
        preset: { type: string, description: Use a preset's rule. }
        rule: { $ref: "#/components/schemas/SecretRule" }

    SecretPatch:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        value: { type: string, minLength: 1 }
        rule: { $ref: "#/components/schemas/SecretRule" }

    AttachedSecret:
      type: object
      required: [secret, envVar]
      properties:
        secret: { $ref: "#/components/schemas/Secret" }
        envVar: { type: string }

    HarnessType:
      type: object
      required: [id, name, default, secretPresets, accountLogins]
      properties:
        id: { type: string }
        accountLogins: { type: boolean, description: Its login can live on the user's account (/me/provider-logins). }
        default: { type: boolean, description: Used when an agent does not name a harness. }
        name: { type: string }
        source: { type: string, enum: [builtin, registry, local] }
        protocol: { type: string, enum: [acp, codex, claude] }
        description: { type: string }
        version: { type: string }
        iconUrl: { type: string }
        secretPresets:
          type: array
          items: { type: string }

    AcpRegistryAgent:
      type: object
      required: [id, name, version, description, distributions]
      properties:
        id: { type: string }
        name: { type: string }
        version: { type: string }
        description: { type: string }
        authors: { type: array, items: { type: string } }
        license: { type: string }
        website: { type: string }
        repository: { type: string }
        icon: { type: string }
        distributions: { type: array, items: { type: string } }
        builtinId: { type: string, description: "Set when agenthold already ships a built-in harness for this agent." }
        addedId: { type: string, description: "ID of your already-added custom harness, if any." }

    AcpRegistrySearchResponse:
      type: object
      required: [version, agents]
      properties:
        version: { type: string }
        agents:
          type: array
          items: { $ref: "#/components/schemas/AcpRegistryAgent" }

    CustomHarness:
      type: object
      required: [id, kind, name, description, args, env, customModels, createdAt, updatedAt]
      properties:
        id: { type: string }
        kind: { type: string, enum: [registry, local] }
        name: { type: string }
        description: { type: string }
        registryId: { type: string }
        registryVersion: { type: string }
        distribution: { type: string }
        command: { type: string }
        args: { type: array, items: { type: string } }
        env:
          type: object
          additionalProperties: { type: string }
        iconUrl: { type: string }
        websiteUrl: { type: string }
        repositoryUrl: { type: string }
        customModels: { type: array, items: { type: string } }
        authMethod: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CustomHarnessInput:
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [registry, local] }
        registryId: { type: string, description: "Required when kind=registry." }
        distribution: { type: string, enum: [auto, binary, npx, uvx], description: "Preferred distribution for registry agents." }
        name: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 500 }
        command: { type: string, maxLength: 512, description: "Required when kind=local; optional executable override for kind=registry." }
        args: { type: array, items: { type: string, maxLength: 1024 }, maxItems: 64 }
        env:
          type: object
          additionalProperties: { type: string }
        customModels: { type: array, items: { type: string, maxLength: 200 }, maxItems: 64 }
        authMethod: { type: string, maxLength: 128 }

    CustomHarnessPatch:
      type: object
      properties:
        name: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 500 }
        distribution: { type: string, enum: [auto, binary, npx, uvx] }
        command: { type: string, maxLength: 512 }
        args: { type: array, items: { type: string, maxLength: 1024 }, maxItems: 64 }
        env:
          type: object
          additionalProperties: { type: string }
        customModels: { type: array, items: { type: string, maxLength: 200 }, maxItems: 64 }
        authMethod: { type: string, maxLength: 128 }

    HarnessAuthFlow:
      type: object
      required: [flowId, status]
      properties:
        flowId: { type: string }
        status: { type: string, enum: [waiting_for_code, completed, failed] }
        authorizationUrl: { type: string }
        message: { type: string }

    AgentLogin:
      type: object
      description: Which login the agent's harness uses.
      required: [source, connected, mine]
      properties:
        source:
          type: string
          enum: [account, org, secret, sandbox, unsupported]
          description: |
            account: the account login of `user`. org: an organization-wide shared provider login fallback.
            secret: an API key secret attached to the agent wins.
            sandbox: whatever is signed in inside the sandbox. unsupported: the harness has no account logins.
        user:
          $ref: "#/components/schemas/User"
          description: Whose account logins the agent uses.
        mine: { type: boolean, description: You are that user. }
        connected: { type: boolean, description: That user has connected a login for the agent's harness. }
        kind: { type: string, description: How that login was connected. }
        status: { type: string, enum: [ok, error] }
        reason: { type: string, description: Why the account login is not used although a user is set. }

    ProviderLoginKind:
      type: object
      required: [id, name, description, inputLabel, multiline]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        command: { type: string, description: What to run on your own computer to get the credential. }
        inputLabel: { type: string }
        multiline: { type: boolean }

    ProviderLogin:
      type: object
      required: [kind, label, status, statusMessage, connectedAt]
      properties:
        kind: { type: string }
        label: { type: string, description: Describes the login without revealing it. }
        status: { type: string, enum: [ok, error] }
        statusMessage: { type: string }
        expiresAt: { type: string, format: date-time }
        connectedAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time }

    ProviderLoginInfo:
      type: object
      required: [provider, name, kinds, agents]
      properties:
        provider: { type: string, description: Harness id. }
        name: { type: string }
        kinds:
          type: array
          items: { $ref: "#/components/schemas/ProviderLoginKind" }
        login: { $ref: "#/components/schemas/ProviderLogin" }
        agents:
          type: array
          description: Agents with this harness that use your logins.
          items: { $ref: "#/components/schemas/LoginAgent" }

    LoginAgent:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }

    ProviderLoginInput:
      type: object
      required: [kind, credential]
      properties:
        kind: { type: string }
        credential: { type: string, minLength: 1, maxLength: 65536, description: "The token, key or file contents. Never returned." }

    AuthMethodInfo:
      type: object
      required: [id, name, description, type]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        type: { type: string, description: '"terminal": run it in the agent terminal (terminal?auth=<id>).' }

    HarnessState:
      type: object
      required: [harness, connected, agentName, agentVersion, loadSession, authMethods]
      properties:
        harness: { type: string }
        connected: { type: boolean }
        agentName: { type: string }
        agentVersion: { type: string }
        loadSession: { type: boolean }
        authMethods:
          type: array
          items: { $ref: "#/components/schemas/AuthMethodInfo" }

    Session:
      type: object
      required: [id, agentId, title, running, createdBy, createdAt, updatedAt]
      properties:
        id: { type: string }
        agentId: { type: string }
        origin:
          type: object
          description: Set when another agent or parent thread started this session (sub-thread, side chat, send_message, ask, or assign_task).
          required: [agentId, agentName, sessionId]
          properties:
            agentId: { type: string }
            agentName: { type: string }
            sessionId: { type: string, description: The parent or calling agent's session that started this thread. }
            sessionTitle: { type: string, description: The parent session's title, if known. }
        parentKind:
          $ref: "#/components/schemas/SessionParentKind"
          description: Relationship to origin session ('subthread', 'side_chat', 'a2a', or empty/absent for root threads).
        harness:
          type: string
          description: "The effective harness this session runs on (pinned per-thread override or the agent's default harness)."
        permissionMode:
          $ref: "#/components/schemas/PermissionMode"
          description: Per-thread permission mode (default full-access).
        queuedCount:
          type: integer
          minimum: 0
          description: Number of follow-up messages currently waiting in this session's queue.
        title: { type: string }
        running: { type: boolean }
        cwd: { type: string, description: "Working directory relative to the agent's home directory." }
        git:
          $ref: "#/components/schemas/SessionGit"
          description: "The git project and branch this session is on; absent when not in a git repository."
        project:
          $ref: "#/components/schemas/SessionProject"
          description: The project this thread works on; absent for threads of no project.
        model:
          $ref: "#/components/schemas/ModelChoice"
          description: The session's own model choice; absent when it uses the agent's default.
        createdBy: { $ref: "#/components/schemas/User" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        pinnedAt:
          type: string
          format: date-time
          description: When the thread was pinned; absent when not pinned.
        snoozed:
          type: boolean
          description: True while the thread is snoozed (indefinitely or until snoozedUntil).
        snoozedUntil:
          type: string
          format: date-time
          description: When a timed snooze expires; absent when not snoozed or snoozed indefinitely.
        settledAt:
          type: string
          format: date-time
          description: When the thread was settled (done, out of the active list); absent while it is active.
        settledBy:
          type: string
          enum: [user, agent, auto]
          description: >-
            Who settled it: a user, the agent itself (platform tools), or the auto-settle job after the agent
            owner's period without activity. Absent while it is active.
        shareRole:
          $ref: "#/components/schemas/SessionAccessRole"
          description: >-
            The caller's effective access level on this thread (owner, shared, collaborator, or viewer).

    PermissionMode:
      type: string
      enum: [full-access, auto-accept-edits, supervised, plan]

    SessionParentKind:
      type: string
      enum: ["", subthread, side_chat, a2a]

    SessionModelInput:
      type: object
      properties:
        harness: { type: string, description: "Optional harness id to switch this session to without mutating the parent agent." }
        model: { type: string, maxLength: 200, description: "Model id ('' keeps the default)." }
        options:
          type: object
          additionalProperties: { type: string, maxLength: 100 }
          description: Values by option id (ModelOption.id).

    SessionSettingsPatch:
      type: object
      properties:
        harness: { type: string, description: "Switch this session's harness without mutating the parent agent." }
        model: { type: string, maxLength: 200, description: "Model id ('' resets to the harness default)." }
        modelOptions:
          type: object
          additionalProperties: { type: string, maxLength: 100 }
        permissionMode: { $ref: "#/components/schemas/PermissionMode" }

    PromptImageInput:
      type: object
      required: [mimeType, data]
      properties:
        mimeType: { type: string, enum: [image/png, image/jpeg, image/gif, image/webp] }
        data: { type: string, description: "Base64 encoded image bytes, without a data URL prefix." }

    QueueMessageInput:
      type: object
      required: [text]
      properties:
        text: { type: string, description: The message. May be empty when images are attached. }
        images:
          type: array
          maxItems: 4
          items: { $ref: "#/components/schemas/PromptImageInput" }
        steer: { type: boolean, description: "When true and the session is running, interrupt the current turn and run this message next." }

    QueuedMessage:
      type: object
      required: [id, sessionId, userId, userName, text, steer, createdAt]
      properties:
        id: { type: string }
        sessionId: { type: string }
        userId: { type: string }
        userName: { type: string }
        text: { type: string }
        images:
          type: array
          items: { $ref: "#/components/schemas/PromptImageInput" }
        steer: { type: boolean }
        createdAt: { type: string, format: date-time }

    EnqueueMessageResult:
      type: object
      required: [started]
      properties:
        started: { type: boolean, description: "True if the session was idle and the message started a turn immediately." }
        message: { $ref: "#/components/schemas/QueuedMessage" }

    SendQueuedMessageResult:
      type: object
      required: [started, steered]
      properties:
        started: { type: boolean, description: "True if the session was idle and the turn started immediately." }
        steered: { type: boolean, description: "True if the running turn was interrupted to run this message next." }

    RewindSessionInput:
      type: object
      required: [seq]
      properties:
        seq: { type: integer, format: int64, minimum: 1 }
        revertFiles: { type: boolean, description: "Best-effort safe git reset when the session works in a dedicated git worktree." }

    RewindSessionResult:
      type: object
      required: [seq, deletedEvents, filesReverted]
      properties:
        seq: { type: integer, format: int64 }
        promptText: { type: string, description: "Prompt text that was at seq, if seq was a prompt event." }
        deletedEvents: { type: integer, format: int64 }
        filesReverted: { type: boolean }
        revertNote: { type: string }

    SessionSearchResult:
      type: object
      required: [session, matchField]
      properties:
        session: { $ref: "#/components/schemas/Session" }
        agentName: { type: string }
        matchField: { type: string, enum: [title, branch, project, message] }
        snippet: { type: string }
        matchSeq: { type: integer, format: int64 }

    UserSettings:
      type: object
      required: [threadAutoSettleDays]
      properties:
        threadAutoSettleDays:
          type: integer
          minimum: 0
          maximum: 365
          description: >-
            Threads of your agents settle themselves after this many days without activity; 0 = never. It applies
            to every thread of the agents you own, also those that people you share with started.

    UserSettingsUpdate:
      type: object
      properties:
        threadAutoSettleDays: { type: integer, minimum: 0, maximum: 365 }

    SessionEvent:
      type: object
      required: [seq, at, type, data]
      properties:
        seq: { type: integer, format: int64 }
        at: { type: string, format: date-time }
        type:
          type: string
          enum: [prompt, update, permission, permission_resolved, turn_end, error, notice, subthread, secret_request, secret_request_resolved, account_connect_request, visual, mcp_app]
          description: |
            prompt: {text, user{id,name}}; update: an ACP SessionUpdate
            (discriminated by "sessionUpdate"); permission: {requestId,
            toolCall, options[{optionId,name,kind}], policy};
            permission_resolved: {requestId, optionId, by}; turn_end:
            {stopReason}; error/notice: {message}; subthread: {sessionId,
            agentId, title, harness, model, status, summary};
            secret_request: {requestId, name, description, hosts, envVar?, header?};
            secret_request_resolved: {requestId, status, secretId?, name?, envVar?, placeholder?, by};
            account_connect_request: {requestId, toolId, slug, name, description?, kind, authMode, reason?, connected, connectEndpoint};
            visual:
            {title, html, height}; mcp_app: {title, html, server,
            toolCallId, resourceUri, actions, height}.
        userId: { type: string }
        data:
          type: object
          additionalProperties: true

    ActivityEntry:
      type: object
      required: [seq, at, level, source, message]
      properties:
        seq: { type: integer, format: int64 }
        at: { type: string, format: date-time }
        level: { type: string, enum: [debug, info, warn, error] }
        source:
          type: string
          description: "What wrote it: machine, guest, tunnel, harness, stderr, acp, server."
        message: { type: string }

    ShareInput:
      type: object
      required: [email]
      properties:
        email: { type: string, minLength: 1, maxLength: 320, description: The verified email of a user who has signed in before. }

    Share:
      type: object
      required: [user, createdAt]
      properties:
        user: { $ref: "#/components/schemas/User" }
        createdAt: { type: string, format: date-time }

    AccessList:
      type: object
      required: [owner, shares]
      properties:
        owner: { $ref: "#/components/schemas/User" }
        shares:
          type: array
          items: { $ref: "#/components/schemas/Share" }

    AuditEntry:
      type: object
      required: [id, at, user, action, target, details]
      properties:
        id: { type: integer, format: int64 }
        at: { type: string, format: date-time }
        user: { $ref: "#/components/schemas/User" }
        action: { type: string }
        target: { type: string }
        details:
          type: object
          additionalProperties: true

    ExposureAccess:
      type: string
      description: |
        Who may open an exposure: `private` (the owner and users the machine
        is shared with), `authenticated` (anyone signed in to this agenthold)
        or `public` (anyone).
      enum: [private, authenticated, public]

    Exposure:
      type: object
      required: [id, agentId, port, name, access, wakeOnRequest, url, createdBy, createdAt]
      properties:
        id: { type: string }
        agentId: { type: string }
        port: { type: integer, minimum: 1, maximum: 65535 }
        name: { type: string }
        access: { $ref: "#/components/schemas/ExposureAccess" }
        wakeOnRequest:
          type: boolean
          description: |
            Whether visitors who are neither the owner nor a shared user wake a
            sleeping machine (and keep it awake). Owner and shared users always do.
        url: { type: string, description: The full URL of the exposure. }
        createdBy:
          type: string
          description: The id of the user who created it, or `agent:<id>` for the agent itself.
        createdAt: { type: string, format: date-time }

    ExposureList:
      type: object
      required: [enabled, hostSuffix, exposures]
      properties:
        enabled: { type: boolean, description: Whether the server has preview URLs configured. }
        hostSuffix: { type: string }
        exposures:
          type: array
          items: { $ref: "#/components/schemas/Exposure" }

    ExposureInput:
      type: object
      required: [port]
      properties:
        port: { type: integer }
        name:
          type: string
          description: |
            Lowercase letters, digits and hyphens, 1 to 40 characters. Some names
            (www, api, admin, ...) and names starting with xn-- are reserved.
        access: { $ref: "#/components/schemas/ExposureAccess" }
        wakeOnRequest: { type: boolean }

    ExposurePatch:
      type: object
      properties:
        name: { type: string }
        access: { $ref: "#/components/schemas/ExposureAccess" }
        wakeOnRequest: { type: boolean }

    ServiceInput:
      type: object
      required: [command]
      properties:
        command: { type: string, minLength: 1, maxLength: 8192, description: Run with `sh -lc` as the agent account. }
        workdir: { type: string, description: Relative to the home (default the home). }
        env:
          type: object
          additionalProperties: { type: string }
        enabled: { type: boolean, description: Default true. }

    ServiceStatus:
      type: object
      required: [state, restarts]
      properties:
        state: { type: string, enum: [running, backoff, stopped, failed] }
        pid: { type: integer }
        restarts: { type: integer }
        exitCode: { type: integer, description: Exit code of the last run (absent when a signal ended it). }
        signal: { type: string, description: Signal that ended the last run. }
        error: { type: string, description: Why it could not be started (state failed). }
        startedAt: { type: string, format: date-time }

    Service:
      type: object
      required: [name, command, workdir, env, enabled, createdAt, updatedAt]
      properties:
        name: { type: string }
        command: { type: string }
        workdir: { type: string }
        env:
          type: object
          additionalProperties: { type: string }
        enabled: { type: boolean }
        status:
          $ref: "#/components/schemas/ServiceStatus"
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ServiceList:
      type: object
      required: [running, services]
      properties:
        running: { type: boolean, description: Whether the machine is connected (its services can run). }
        error: { type: string, description: Why the live status is missing although the machine runs. }
        services:
          type: array
          items: { $ref: "#/components/schemas/Service" }

    App:
      type: object
      required: [id, name, owner, cpus, memoryMb, idleMinutes, state, stateError, stateChangedAt, needsRebuild, isTemplate, role, links, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        owner: { $ref: "#/components/schemas/User" }
        nodeId: { type: string }
        nodeName: { type: string }
        imageId: { type: string, description: "Custom image ID, or empty string for the built-in agenthold Base image." }
        imageName: { type: string, description: "Display name of the app's image." }
        imageRevision: { type: integer, format: int64, description: "Pinned custom image revision (0 for built-in base)." }
        imageUpdateAvailable: { type: boolean, description: "True when the app's custom image has a newer ready revision." }
        cpus: { type: number }
        memoryMb: { type: integer, format: int64 }
        idleMinutes: { type: integer, description: 0 means always on (never sleeps for idleness). }
        state: { $ref: "#/components/schemas/SandboxState" }
        stateError: { type: string }
        stateChangedAt: { type: string, format: date-time }
        needsRebuild: { type: boolean }
        isTemplate: { type: boolean, description: "The app is a template: it is never started; clone it (POST /agents/{id}/clone)." }
        role: { $ref: "#/components/schemas/AgentRole" }
        createdByAgent:
          type: object
          description: |
            The agent that created the app with deploy_app and manages it (it may since have
            been deleted). Absent once the owner took the app over.
          required: [id, name]
          properties:
            id: { type: string }
            name: { type: string, description: Empty when the agent was deleted. }
        url: { type: string, description: The app's primary preview URL, if one is exposed. }
        lastActivityAt: { type: string, format: date-time }
        sleepsAt: { type: string, format: date-time }
        links:
          type: object
          description: Where the machine sub-resources of this app are.
          required: [services, exposures, files, terminal, shares, secrets, audit]
          properties:
            services: { type: string }
            exposures: { type: string }
            files: { type: string }
            terminal: { type: string }
            shares: { type: string }
            secrets: { type: string }
            audit: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    AppInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 40, description: "A DNS label: lowercase letters, digits and hyphens, unique among your apps." }
        cpus: { type: number }
        memoryMb: { type: integer, format: int64 }
        idleMinutes: { type: integer, minimum: 0, maximum: 10080, description: Default 0 (always on). }
        imageId:
          type: string
          description: Custom image ID, "base" for built-in base, or omit for the installation default.

    AppPatch:
      type: object
      properties:
        isTemplate: { type: boolean, description: Convert to a template (it is stopped first) or back, as for agents. }
        name: { type: string, minLength: 1, maxLength: 40 }
        cpus: { type: number }
        memoryMb: { type: integer, format: int64 }
        idleMinutes: { type: integer, minimum: 0, maximum: 10080 }
        imageId: { type: string, description: Switch image (takes effect after Reset system). }
        imageRevision: { type: integer, format: int64, description: Switch to a specific ready revision (takes effect after Reset system). }

    BuiltinBaseImage:
      type: object
      required: [id, name, description, isDefault]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        isDefault: { type: boolean }

    ImageInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        description: { type: string, maxLength: 500 }
        aptPackages:
          type: array
          items: { type: string }
        setupScript: { type: string, description: Bash script executed as root inside an isolated builder microVM. }
        env:
          type: object
          additionalProperties: { type: string }
          description: Environment variables written to /etc/agenthold/image.env.d/10-custom.env. PATH supports $PATH/${PATH}.
        secretIds:
          type: array
          items: { type: string }
          description: Secret IDs injected via the egress proxy during image builds only (never baked into the image).
        isDefault:
          type: boolean
          description: Make this custom image the installation default for new agents and apps.

    CustomImage:
      type: object
      required: [id, name, description, aptPackages, setupScript, env, secretIds, isDefault, latestRevision, readyArches, building, agentCount, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        aptPackages:
          type: array
          items: { type: string }
        setupScript: { type: string }
        env:
          type: object
          additionalProperties: { type: string }
        secretIds:
          type: array
          items: { type: string }
        isDefault: { type: boolean }
        latestRevision: { type: integer, format: int64 }
        readyArches:
          type: array
          items: { type: string }
        building: { type: boolean }
        agentCount: { type: integer, format: int64 }
        latestBuildStatus: { type: string, enum: [queued, building, ready, failed] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ImageBuild:
      type: object
      required: [id, imageId, revision, arch, nodeId, status, error, layerSha256, layerSize, zstdSize, createdAt]
      properties:
        id: { type: string }
        imageId: { type: string }
        revision: { type: integer, format: int64 }
        arch: { type: string }
        nodeId: { type: string }
        status: { type: string, enum: [queued, building, ready, failed] }
        error: { type: string }
        baseKey: { type: string }
        layerSha256: { type: string }
        layerSize: { type: integer, format: int64 }
        zstdSize: { type: integer, format: int64 }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    ImageBuildDetail:
      allOf:
        - $ref: "#/components/schemas/ImageBuild"
        - type: object
          required: [log]
          properties:
            log: { type: string }

    CustomImageDetail:
      allOf:
        - $ref: "#/components/schemas/CustomImage"
        - type: object
          required: [builds]
          properties:
            builds:
              type: array
              items: { $ref: "#/components/schemas/ImageBuild" }

    ImageList:
      type: object
      required: [base, images]
      properties:
        base: { $ref: "#/components/schemas/BuiltinBaseImage" }
        images:
          type: array
          items: { $ref: "#/components/schemas/CustomImage" }

    DeployInput:
      type: object
      required: [sourceAgentId, sourceDir, command, port]
      properties:
        sourceAgentId: { type: string, description: The machine to copy from. }
        sourceDir: { type: string, description: Directory in the source machine, relative to its home or absolute. }
        command: { type: string, description: Runs in `~/app/current` with `PORT` set. }
        port: { type: integer, minimum: 1, maximum: 65535 }
        env:
          type: object
          additionalProperties: { type: string }
        access: { $ref: "#/components/schemas/ExposureAccess" }
        exclude:
          type: array
          description: Names (any depth) or relative paths left out. Default [".git"].
          items: { type: string }

    DeployResult:
      type: object
      required: [release, ready, rolledBack, logs]
      properties:
        release: { type: integer }
        ready: { type: boolean, description: The port accepted connections. }
        rolledBack: { type: boolean, description: The new release did not come up and the previous one serves again. }
        logs: { type: string, description: The service's last log lines when it did not come up. }
        url: { type: string }
        exposure: { $ref: "#/components/schemas/Exposure" }
        service: { $ref: "#/components/schemas/ServiceStatus" }

    MCPServerInput:
      type: object
      required: [name, transport]
      properties:
        name: { type: string, description: 'Letters, digits, dashes and underscores.' }
        transport: { type: string, enum: [stdio, http] }
        command: { type: string, description: stdio only; runs inside the sandbox. }
        args:
          type: array
          items: { type: string }
        env:
          type: object
          additionalProperties: { type: string }
          description: 'stdio only. Values may reference secrets as {{secret:NAME}}.'
        url: { type: string, description: http only. }
        headers:
          type: object
          additionalProperties: { type: string }
          description: 'http only. Values may reference secrets as {{secret:NAME}}; the sandbox sees a placeholder and the egress proxy injects the value.'

    MCPServer:
      allOf:
        - $ref: "#/components/schemas/MCPServerInput"
        - type: object
          required: [id, ownerId, scope, secretRefs, createdAt, updatedAt, args, env, headers, command, url]
          properties:
            id: { type: string }
            ownerId: { type: string }
            scope: { type: string, enum: [library, agent], description: 'library: in your library, attachable to your agents. agent: belongs to one agent.' }
            agentId: { type: string }
            secretRefs:
              type: array
              items: { type: string }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }

    SkillInput:
      type: object
      required: [name, description, content]
      properties:
        name: { type: string, description: 'Lowercase letters, digits and dashes.' }
        description: { type: string, description: When the agent should use the skill. }
        content: { type: string, description: The SKILL.md instructions (Markdown). }

    Skill:
      allOf:
        - $ref: "#/components/schemas/SkillInput"
        - type: object
          required: [id, ownerId, createdAt, updatedAt]
          properties:
            id: { type: string }
            ownerId: { type: string }

            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }

    APIToken:
      type: object
      required: [id, name, prefix, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        prefix: { type: string, description: The first characters of the token. }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }

    CreatedAPIToken:
      allOf:
        - $ref: "#/components/schemas/APIToken"
        - type: object
          required: [token]
          properties:
            token: { type: string }

    ScheduleInput:
      type: object
      required: [name, cron, prompt]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        cron: { type: string, description: 'Five fields (minute hour day month weekday) or @hourly, @daily, @weekly.' }
        timezone: { type: string, description: IANA time zone. Default UTC. }
        prompt: { type: string, minLength: 1 }
        enabled: { type: boolean }

    Schedule:
      allOf:
        - $ref: "#/components/schemas/ScheduleInput"
        - type: object
          required: [id, agentId, sessionId, timezone, enabled, createdBy, nextRunAt, lastError, createdAt]
          properties:
            id: { type: string }
            agentId: { type: string }
            sessionId: { type: string }
            createdBy: { $ref: "#/components/schemas/User" }
            nextRunAt: { type: string, format: date-time }
            lastRunAt: { type: string, format: date-time }
            lastError: { type: string }
            createdAt: { type: string, format: date-time }

    WebhookInput:
      type: object
      required: [name, promptTemplate]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        promptTemplate: { type: string, minLength: 1, description: '{{payload}} marks where the delimited request body goes; otherwise it is appended.' }
        signingSecret: { type: string, description: 'Set to require HMAC-SHA256 signatures; "" removes it; omit to keep.' }
        signatureHeader: { type: string, description: Header holding the signature. Default X-Hub-Signature-256. }
        enabled: { type: boolean }

    Webhook:
      type: object
      required: [id, agentId, sessionId, name, promptTemplate, signed, signatureHeader, enabled, createdBy, lastError, createdAt]
      properties:
        id: { type: string }
        agentId: { type: string }
        sessionId: { type: string }
        name: { type: string }
        promptTemplate: { type: string }
        signed: { type: boolean }
        signatureHeader: { type: string }
        enabled: { type: boolean }
        createdBy: { $ref: "#/components/schemas/User" }
        lastDeliveryAt: { type: string, format: date-time }
        lastError: { type: string }
        createdAt: { type: string, format: date-time }

    CreatedWebhook:
      allOf:
        - $ref: "#/components/schemas/Webhook"
        - type: object
          required: [url]
          properties:
            url: { type: string, description: The secret delivery URL. Shown once. }

    SessionProject:
      type: object
      required: [id, name, direct]
      properties:
        id: { type: string }
        name: { type: string }
        direct: { type: boolean, description: "Works in the main checkouts, not in a workspace of its own." }
        branch: { type: string, description: "The branch of the thread's workspace (absent when direct)." }

    ProjectSourceKind:
      type: string
      enum: [repo, folder]
      description: "repo: cloned from url. folder: a directory (created, or the existing path), made a local git repository."

    ProjectSource:
      type: object
      required: [id, name, kind]
      properties:
        id: { type: string }
        name: { type: string, description: "The source's directory in the project's workspaces." }
        kind: { $ref: "#/components/schemas/ProjectSourceKind" }
        url: { type: string }
        path: { type: string, description: "Where the main checkout lives in agents' homes; default projects/<slug>/<name>." }
        defaultBranch: { type: string, description: "The branch threads start from and merge into; found on the first checkout when not set." }

    ProjectSourceInput:
      type: object
      properties:
        name: { type: string, maxLength: 64 }
        kind: { $ref: "#/components/schemas/ProjectSourceKind" }
        url: { type: string, maxLength: 2048 }
        path: { type: string, maxLength: 4096 }
        defaultBranch: { type: string, maxLength: 255 }

    ProjectInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 2000 }
        instructions: { type: string, maxLength: 20000, description: "Written into every workspace's AGENTS.md." }
        sources:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/ProjectSourceInput" }

    Project:
      type: object
      required: [id, name, slug, description, instructions, sources, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string, description: "The project's directory in agents' homes: projects/<slug>." }
        description: { type: string }
        instructions: { type: string }
        sources:
          type: array
          items: { $ref: "#/components/schemas/ProjectSource" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ProjectFileChange:
      type: object
      required: [path, status]
      properties:
        path: { type: string }
        status: { type: string, description: "git's status letter (A, M, D, ...); ? untracked." }

    ProjectSourceChanges:
      type: object
      required: [source, base, commits, dirty, remote, files]
      properties:
        source: { type: string }
        base: { type: string, description: The default branch the thread's branch forked from. }
        commits: { type: integer }
        dirty: { type: boolean, description: Uncommitted changes. }
        remote: { type: boolean, description: The repository has a remote to push to. }
        files:
          type: array
          items: { $ref: "#/components/schemas/ProjectFileChange" }
        error: { type: string }

    ProjectThread:
      type: object
      required: [session, agentId, agentName, connected, sources]
      properties:
        session: { $ref: "#/components/schemas/Session" }
        agentId: { type: string }
        agentName: { type: string }
        connected: { type: boolean, description: "The agent's machine runs; changes are only known then." }
        sources:
          type: array
          items: { $ref: "#/components/schemas/ProjectSourceChanges" }
        error: { type: string }

    ProjectOverlap:
      type: object
      required: [source, path, sessionIds]
      properties:
        source: { type: string }
        path: { type: string }
        sessionIds:
          type: array
          items: { type: string }

    ProjectStatus:
      type: object
      required: [threads, overlaps]
      properties:
        threads:
          type: array
          items: { $ref: "#/components/schemas/ProjectThread" }
        overlaps:
          type: array
          items: { $ref: "#/components/schemas/ProjectOverlap" }

    ProjectSourceResult:
      type: object
      required: [source, done, commits]
      properties:
        source: { type: string }
        done: { type: boolean, description: "Merged (or pushed)." }
        commits: { type: integer }
        error: { type: string }

    SessionGit:
      type: object
      required: [project, branch]
      properties:
        project: { type: string }
        branch: { type: string }
        repoPath: { type: string }

    GitCredentialInput:
      type: object
      required: [host, token]
      properties:
        host: { type: string, minLength: 1, maxLength: 253, description: "Hostname, e.g. github.com or gitlab.com." }
        username: { type: string, maxLength: 200, description: "Optional HTTP Basic username (defaults to x-access-token for github.com, oauth2 for gitlab.com, git otherwise)." }
        token: { type: string, minLength: 1, maxLength: 16384 }
        label: { type: string, maxLength: 100 }

    GitCredential:
      type: object
      required: [id, host, username, label, source, createdAt, updatedAt]
      properties:
        id: { type: string }
        host: { type: string }
        username: { type: string }
        label: { type: string }
        source:
          type: string
          enum: [token, github]
          description: "token: pasted. github: a GitHub account connected through the device flow."
        account: { type: string, description: "The connected GitHub login." }
        scopes: { type: string, description: "Scopes GitHub granted the connected token (empty for GitHub Apps)." }
        expiresAt: { type: string, format: date-time, description: "When the token expires; agenthold refreshes refreshable tokens before then." }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    GitHubConnectInfo:
      type: object
      required: [enabled, host]
      properties:
        enabled: { type: boolean, description: "Whether this server can connect GitHub accounts (git.github.client_id)." }
        host: { type: string, description: "The git host connected accounts are stored for." }

    GitHubDeviceFlow:
      type: object
      required: [id, userCode, verificationUri, expiresAt, interval]
      properties:
        id: { type: string }
        userCode: { type: string }
        verificationUri: { type: string }
        expiresAt: { type: string, format: date-time }
        interval: { type: integer, description: "Seconds to wait between polls." }

    GitHubDevicePoll:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [pending, connected, denied, expired] }
        credential: { $ref: "#/components/schemas/GitCredential" }

    GitSettings:
      type: object
      required: [authorName, authorEmail, defaultAuthorName, defaultAuthorEmail, credentials, github]
      properties:
        github: { $ref: "#/components/schemas/GitHubConnectInfo" }
        authorName: { type: string }
        authorEmail: { type: string }
        defaultAuthorName: { type: string }
        defaultAuthorEmail: { type: string }
        credentials:
          type: array
          items: { $ref: "#/components/schemas/GitCredential" }

    GitRepo:
      type: object
      required: [path, project, branch, detached, dirty, ahead, behind, isWorktree]
      properties:
        path: { type: string }
        project: { type: string }
        remoteUrl: { type: string }
        branch: { type: string }
        detached: { type: boolean }
        dirty: { type: boolean }
        ahead: { type: integer }
        behind: { type: integer }
        isWorktree: { type: boolean }
        mainPath: { type: string }

    GitRepoList:
      type: object
      required: [connected, repos]
      properties:
        connected: { type: boolean }
        repos:
          type: array
          items: { $ref: "#/components/schemas/GitRepo" }

    GitRepoStatus:
      type: object
      required: [branches]
      properties:
        repo: { $ref: "#/components/schemas/GitRepo" }
        branches:
          type: array
          items: { type: string }

    GitDiffFile:
      type: object
      required: [path, status, additions, deletions, binary, truncated]
      properties:
        path: { type: string, description: Path relative to the repository root. }
        oldPath: { type: string, description: The previous path of a renamed file. }
        status: { type: string, enum: [A, M, D, R, "?"], description: "Added, modified, deleted, renamed or untracked (?)." }
        additions: { type: integer }
        deletions: { type: integer }
        binary: { type: boolean }
        truncated: { type: boolean, description: The patch is left out because it is too large. }
        patch: { type: string, description: Unified diff of the file. }

    GitDiff:
      type: object
      required: [mode, repo, files, additions, deletions, truncated]
      properties:
        mode: { type: string, enum: [uncommitted, branch, commit] }
        repo: { $ref: "#/components/schemas/GitRepo" }
        base: { type: string, description: The branch a branch diff compares with. }
        mergeBase: { type: string, description: The commit the branch forked from. }
        ref: { type: string, description: The commit a commit diff shows (full SHA). }
        files:
          type: array
          items: { $ref: "#/components/schemas/GitDiffFile" }
        additions: { type: integer }
        deletions: { type: integer }
        truncated: { type: boolean, description: More files changed than are listed. }

    GitCommit:
      type: object
      required: [sha, shortSha, subject, body, author, email, date, filesChanged, additions, deletions]
      properties:
        sha: { type: string }
        shortSha: { type: string }
        subject: { type: string }
        body: { type: string }
        author: { type: string }
        email: { type: string }
        date: { type: string, format: date-time }
        filesChanged: { type: integer }
        additions: { type: integer }
        deletions: { type: integer }

    GitCommitList:
      type: object
      required: [repo, commits]
      properties:
        repo: { $ref: "#/components/schemas/GitRepo" }
        commits:
          type: array
          items: { $ref: "#/components/schemas/GitCommit" }

    GitCommitResult:
      type: object
      required: [repo, commit]
      properties:
        repo: { $ref: "#/components/schemas/GitRepo" }
        commit: { $ref: "#/components/schemas/GitCommit" }

    ExecutorApprovalMode:
      type: string
      enum: [model, automatic, browser]
      description: >-
        How Executor tool approvals are answered for this agent:
        model (default; the agent asks you in chat and resumes),
        automatic (Executor approves immediately; the harness's own tool confirmation guards it),
        browser (pauses with a signed-in Executor approval link).

    ExecutorStatus:
      type: object
      required: [available, enabled, running, oauthReady, customAppsEnabled]
      properties:
        available: { type: boolean, description: "True when an Executor runtime binary is present on the controller." }
        enabled: { type: boolean, description: "False when executor.disabled is set in configuration." }
        running: { type: boolean, description: "True when this user's isolated Executor process is currently running." }
        version: { type: string, description: "Executor runtime version when known." }
        dashboardUrl: { type: string, description: "Dedicated Agenthold-authenticated URL for the full Executor dashboard (requires preview.host_suffix or executor.public_url)." }
        oauthReady: { type: boolean, description: "True when an HTTPS Executor dashboard origin is configured for OAuth2 provider callbacks." }
        customAppsEnabled: { type: boolean, description: "True when custom MCP server and custom app imports are allowed (executor.allow_private_fetch)." }
        reason: { type: string, description: "Why Executor is unavailable or disabled." }

    ExecutorOverview:
      type: object
      required: [status, apps, accounts]
      properties:
        status: { $ref: "#/components/schemas/ExecutorStatus" }
        apps:
          type: array
          items: { $ref: "#/components/schemas/ExecutorApp" }
        accounts:
          type: array
          items: { $ref: "#/components/schemas/ExecutorAccount" }

    ExecutorApp:
      type: object
      required: [id, slug, name, requirements]
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        activeVersion: { type: string }
        builtin: { type: boolean }
        requirements:
          type: array
          items: { $ref: "#/components/schemas/ExecutorRequirement" }

    ExecutorRequirement:
      type: object
      required: [name, scope, providerId, providerName, many, authMethods, linkedAccountIds]
      properties:
        name: { type: string }
        scope: { type: string, enum: [user, app] }
        providerId: { type: string }
        providerName: { type: string }
        many: { type: boolean }
        authMethods:
          type: array
          items: { $ref: "#/components/schemas/ExecutorAuthMethod" }
        linkedAccountIds:
          type: array
          items: { type: string }

    ExecutorAuthMethod:
      type: object
      required: [name, kind]
      properties:
        name: { type: string }
        kind: { type: string, enum: [secrets, oauth2, other] }
        label: { type: string }
        guide: { type: string }
        fields:
          type: array
          items: { $ref: "#/components/schemas/ExecutorSecretField" }

    ExecutorSecretField:
      type: object
      required: [name, required]
      properties:
        name: { type: string }
        title: { type: string }
        description: { type: string }
        required: { type: boolean }
        secret: { type: boolean }

    ExecutorAccount:
      type: object
      required: [id, providerId, providerName, label, method, status, linkedApps]
      properties:
        id: { type: string }
        providerId: { type: string }
        providerName: { type: string }
        label: { type: string }
        description: { type: string }
        method: { type: string }
        status: { type: string, description: "ready, needs_reauth, error, or unknown." }
        identity: { type: string, description: "Provider email or username when available." }
        linkedApps:
          type: array
          items: { type: string }

    ExecutorAccountHealth:
      type: object
      required: [status]
      properties:
        status: { type: string }
        message: { type: string }

    ExecutorCatalog:
      type: object
      required: [apps]
      properties:
        apps:
          type: array
          items: { $ref: "#/components/schemas/ExecutorCatalogEntry" }

    ExecutorCatalogEntry:
      type: object
      required: [id, name, auth]
      properties:
        id: { type: string }
        package: { type: string }
        name: { type: string }
        description: { type: string }
        category: { type: string }
        iconUrl: { type: string }
        auth:
          type: array
          items: { type: string }

    ExecutorConnectionSession:
      type: object
      required: [connectionId, token, providerId, providerName, methods]
      properties:
        connectionId: { type: string }
        token: { type: string }
        browserUrl: { type: string, description: "Direct URL on the Executor dashboard host for OAuth2 or browser connection." }
        expiresAt: { type: string, format: date-time }
        providerId: { type: string }
        providerName: { type: string }
        methods:
          type: array
          items: { $ref: "#/components/schemas/ExecutorAuthMethod" }

    # --- Phase 2A: Organization Tools, Skills, Provider Logins & In-Thread Secret Requests ---

    OrgToolConfig:
      type: object
      properties:
        url: { type: string }
        headers:
          type: object
          additionalProperties: { type: string }
        command: { type: string }
        args:
          type: array
          items: { type: string }
        env:
          type: object
          additionalProperties: { type: string }
        executorCatalogId: { type: string }

    OrgTool:
      type: object
      required: [id, slug, name, description, kind, authMode, config, hasSecret, secretHosts, enabledByDefault, userEnabled, connected, allowedRoles, createdAt, updatedAt]
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        description: { type: string }
        kind: { type: string, enum: [mcp_http, mcp_stdio, executor_app] }
        authMode: { type: string, enum: [none, org_shared, user_oauth] }
        config: { $ref: "#/components/schemas/OrgToolConfig" }
        hasSecret: { type: boolean, description: "True when an encrypted org-shared secret is configured; values are never returned." }
        secretHosts:
          type: array
          items: { type: string }
        enabledByDefault: { type: boolean }
        userEnabled: { type: boolean, description: "Effective enabled state for the signed-in user." }
        connected: { type: boolean, description: "For user_oauth executor_app tools, whether the user has a linked account." }
        allowedRoles:
          type: array
          items: { type: string }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    OrgToolInput:
      type: object
      required: [slug, name, kind]
      properties:
        slug: { type: string }
        name: { type: string }
        description: { type: string }
        kind: { type: string, enum: [mcp_http, mcp_stdio, executor_app] }
        authMode: { type: string, enum: [none, org_shared, user_oauth] }
        config: { $ref: "#/components/schemas/OrgToolConfig" }
        secret: { type: string, description: "Optional org-shared secret value (write-only; never returned)." }
        clearSecret: { type: boolean, description: "When true on update, clears the stored secret." }
        secretHosts:
          type: array
          items: { type: string }
        enabledByDefault: { type: boolean }
        allowedRoles:
          type: array
          items: { type: string }

    UserOrgToolPreferenceInput:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }

    OrgToolConnectResponse:
      type: object
      required: [toolId, slug, connected]
      properties:
        toolId: { type: string }
        slug: { type: string }
        connected: { type: boolean }
        app: { $ref: "#/components/schemas/ExecutorApp" }
        session: { $ref: "#/components/schemas/ExecutorConnectionSession" }

    OrgSkill:
      type: object
      required: [id, name, description, content, enabledByDefault, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        content: { type: string }
        enabledByDefault: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    OrgSkillInput:
      type: object
      required: [name, description, content]
      properties:
        name: { type: string }
        description: { type: string }
        content: { type: string }
        enabledByDefault: { type: boolean }

    OrgProviderLogin:
      type: object
      required: [provider, configured, enabled]
      properties:
        provider: { type: string }
        configured: { type: boolean }
        kind: { type: string, enum: [api_key, oauth_token, gateway] }
        label: { type: string }
        enabled: { type: boolean }
        updatedBy: { type: string }
        updatedAt: { type: string, format: date-time }

    OrgProviderLoginInput:
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [api_key, oauth_token, gateway] }
        label: { type: string }
        credential: { type: string, description: "API key or OAuth token (write-only; required on initial setup)." }
        baseUrl: { type: string, description: "Gateway base URL when kind is gateway." }
        header: { type: string, description: "Optional custom auth header for gateway kind." }
        hosts:
          type: array
          items: { type: string }
        enabled: { type: boolean }

    SecretRequestSubmitInput:
      type: object
      properties:
        value: { type: string, description: "Secret value (encrypted directly to the user's secret store; never persisted in chat history)." }
        decline: { type: boolean, description: "When true, declines the agent's secret request." }
        name: { type: string, description: "Optional override for the saved secret's name." }
        envVar: { type: string, description: "Optional override for the environment variable attached to the agent." }

    SecretRequestResponse:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [submitted, declined] }
        secretId: { type: string }
        name: { type: string }
        envVar: { type: string }
        placeholder: { type: string }

    # --- Phase 4A: the machine's headless browser ---

    BrowserRect:
      type: object
      description: A box in viewport CSS pixels.
      required: [x, y, width, height]
      properties:
        x: { type: number }
        y: { type: number }
        width: { type: number }
        height: { type: number }

    BrowserElement:
      type: object
      description: An interactive element of the page.
      required: [role, name, tag, selector, rect]
      properties:
        role: { type: string, description: "ARIA role (explicit or implicit), or the tag." }
        name: { type: string, description: Accessible name (label, text, placeholder, ...). }
        tag: { type: string }
        selector: { type: string, description: A CSS selector that finds it. }
        rect: { $ref: "#/components/schemas/BrowserRect" }
        href: { type: string }
        value: { type: string }
        disabled: { type: boolean }

    BrowserMatch:
      type: object
      description: An element an `eval` query found.
      required: [tag, text, selector, rect]
      properties:
        tag: { type: string }
        text: { type: string }
        selector: { type: string }
        attributes:
          type: object
          additionalProperties: { type: string }
        rect: { $ref: "#/components/schemas/BrowserRect" }

    BrowserState:
      type: object
      description: |
        The machine's headless browser and its page. `screenshot` is a base64
        PNG of the viewport (`width` x `height` CSS pixels) when the request
        captures one; `text` is the page's visible text (snapshot).
      required: [available, running, width, height, consoleErrors, elements]
      properties:
        available: { type: boolean, description: The machine has a browser it can start. }
        running: { type: boolean }
        url: { type: string }
        title: { type: string }
        width: { type: integer }
        height: { type: integer }
        consoleErrors: { type: integer, description: Console errors and uncaught exceptions since the last navigation. }
        lastError: { type: string }
        screenshot: { type: string, description: Base64 PNG. }
        elements:
          type: array
          items: { $ref: "#/components/schemas/BrowserElement" }
        text: { type: string }
        truncated: { type: boolean }
        matches:
          type: array
          items: { $ref: "#/components/schemas/BrowserMatch" }

    BrowserNavigateInput:
      type: object
      required: [url]
      properties:
        url: { type: string }
        width: { type: integer, minimum: 200, maximum: 3840 }
        height: { type: integer, minimum: 200, maximum: 4320 }

    BrowserInteractInput:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [click, type, press, scroll, back, forward, reload, eval]
          x-enum-varnames: [BrowserClick, BrowserType, BrowserPress, BrowserScroll, BrowserBack, BrowserForward, BrowserReload, BrowserEval]
        x: { type: number }
        y: { type: number }
        selector: { type: string }
        text: { type: string }
        key: { type: string }
        dx: { type: number }
        dy: { type: number }
    # Phase 4B: Inline visual replies & MCP Apps
    VisualEventData:
      type: object
      required: [html]
      properties:
        title: { type: string }
        html: { type: string }
        height: { type: integer, minimum: 120, maximum: 900 }

    McpAppAction:
      type: object
      required: [name]
      properties:
        name: { type: string }
        label: { type: string }
        description: { type: string }
        readOnly: { type: boolean }

    McpAppEventData:
      type: object
      required: [title, html]
      properties:
        title: { type: string }
        html: { type: string }
        server: { type: string }
        toolCallId: { type: string }
        resourceUri: { type: string }
        height: { type: integer, minimum: 120, maximum: 900 }
        actions:
          type: array
          items: { $ref: "#/components/schemas/McpAppAction" }

    # --- Phase 3A: Multiplayer Thread Sharing, Guest Links & Collaborative Review Comments ---

    SessionShareRole:
      type: string
      enum: [viewer, collaborator]
      x-enum-varnames: [ShareRoleViewer, ShareRoleCollaborator]

    SessionAccessRole:
      type: string
      enum: [owner, shared, collaborator, viewer]
      x-enum-varnames: [ShareAccessOwner, ShareAccessShared, ShareAccessCollaborator, ShareAccessViewer]

    SessionShareInput:
      type: object
      required: [email, role]
      properties:
        email: { type: string, format: email }
        role: { $ref: "#/components/schemas/SessionShareRole" }

    SessionShare:
      type: object
      required: [user, role, createdBy, createdAt]
      properties:
        user: { $ref: "#/components/schemas/User" }
        role: { $ref: "#/components/schemas/SessionShareRole" }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }

    SessionAccessList:
      type: object
      required: [owner, shares]
      properties:
        owner: { $ref: "#/components/schemas/User" }
        shares:
          type: array
          items: { $ref: "#/components/schemas/SessionShare" }

    SharedThread:
      type: object
      required: [session, agentName, role, sharedAt]
      properties:
        session: { $ref: "#/components/schemas/Session" }
        agentName: { type: string }
        role: { $ref: "#/components/schemas/SessionShareRole" }
        sharedAt: { type: string, format: date-time }

    GuestLink:
      type: object
      required: [id, sessionId, createdBy, expiresAt, createdAt, active]
      properties:
        id: { type: string }
        sessionId: { type: string }
        createdBy: { type: string }
        expiresAt: { type: string, format: date-time }
        revokedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        active: { type: boolean }

    GuestLinkCreated:
      type: object
      required: [link, token, url]
      properties:
        link: { $ref: "#/components/schemas/GuestLink" }
        token: { type: string }
        url: { type: string, description: "One-time shareable path (/guest/<token>)." }

    GuestRequestStatus:
      type: string
      enum: [pending, approved, dismissed]
      x-enum-varnames: [GuestRequestPending, GuestRequestApproved, GuestRequestDismissed]

    GuestRequestInput:
      type: object
      required: [text]
      properties:
        name: { type: string, maxLength: 80 }
        text: { type: string, minLength: 1, maxLength: 16384 }

    GuestRequest:
      type: object
      required: [id, sessionId, guestLinkId, guestName, text, status, createdAt]
      properties:
        id: { type: string }
        sessionId: { type: string }
        guestLinkId: { type: string }
        guestName: { type: string }
        text: { type: string }
        status: { $ref: "#/components/schemas/GuestRequestStatus" }
        resolvedBy: { type: string }
        createdAt: { type: string, format: date-time }
        resolvedAt: { type: string, format: date-time }

    GuestThreadView:
      type: object
      required: [sessionId, title, running, expiresAt, events, pendingRequests]
      properties:
        sessionId: { type: string }
        title: { type: string }
        agentName: { type: string }
        running: { type: boolean }
        expiresAt: { type: string, format: date-time }
        events:
          type: array
          items: { $ref: "#/components/schemas/SessionEvent" }
        pendingRequests:
          type: array
          items: { $ref: "#/components/schemas/GuestRequest" }

    ReviewCommentSide:
      type: string
      enum: [new, old]
      x-enum-varnames: [ShareCommentSideNew, ShareCommentSideOld]

    SessionReviewCommentInput:
      type: object
      required: [filePath, startLine, endLine, body]
      properties:
        filePath: { type: string, minLength: 1, maxLength: 512 }
        startLine: { type: integer, minimum: 1 }
        endLine: { type: integer, minimum: 1 }
        side: { $ref: "#/components/schemas/ReviewCommentSide" }
        body: { type: string, minLength: 1, maxLength: 8192 }

    SessionReviewComment:
      type: object
      required: [id, sessionId, userId, userName, filePath, startLine, endLine, side, body, createdAt]
      properties:
        id: { type: string }
        sessionId: { type: string }
        userId: { type: string }
        userName: { type: string }
        filePath: { type: string }
        startLine: { type: integer }
        endLine: { type: integer }
        side: { $ref: "#/components/schemas/ReviewCommentSide" }
        body: { type: string }
        resolvedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    SessionHandoffInput:
      type: object
      required: [target]
      properties:
        target: { type: string, description: "Email or name of a teammate with access to this thread." }
        note: { type: string, maxLength: 1000 }

    SessionHandoffResult:
      type: object
      required: [to, message]
      properties:
        to: { $ref: "#/components/schemas/User" }
        message: { type: string }
