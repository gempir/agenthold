version: "2"
run:
  timeout: 5m
linters:
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - misspell
    - noctx
    - revive
    - unconvert
    - unparam
    - usestdlibvars
  settings:
    revive:
      rules:
        - name: exported
  exclusions:
    generated: strict
    presets:
      - std-error-handling # unchecked Close and friends
    rules:
      - path: _test\.go
        linters: [noctx, bodyclose, unparam]
formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/gempir/agenthold
  exclusions:
    generated: strict
