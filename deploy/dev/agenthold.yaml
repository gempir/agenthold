# Native development server, run as root inside the Lima VM by make dev.
data_dir: /var/lib/agenthold-dev
public_url: http://localhost:8080
test_harness: true
auth:
  # Development: users of a provider you enable here get the User role (the shipped default is disabled).
  default_role: user
  # Development only: admin / admin. Generate your own with agenthold hash-password.
  local:
    username: admin
    password_hash: $argon2id$v=19$m=65536,t=3,p=4$n+qTSj1iaT9J18JcHD66TA$krvYz+qGs3qgHCmCGqfow/9RituEvdbFMufWxGqBacQ
sandbox:
  driver: firecracker
  network_pool: 10.213.0.0/16
  idle_check_interval: 10s
  firecracker:
    binary: build/runtime/firecracker
    jailer: build/runtime/jailer
    kernel: build/guest/arm64/vmlinux-6.1.188-agenthold
    base_image: build/guest/arm64/base-arm64.ext4
