name: ci

on:
  push:
    branches: [main]
    # The documentation site is built by Cloudflare Workers Builds; a docs change
    # should neither run the whole suite nor redeploy the app.
    paths-ignore: ["docs/**", "**.md"]
  pull_request:
    paths-ignore: ["docs/**", "**.md"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# KVM tests, release builds and publication run on the demo host itself
# (scripts/deploy/build-local.sh): GitHub keeps only what needs neither KVM nor hosting.
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make test-go

  postgres:
    name: Go tests (PostgreSQL 16)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agenthold
          POSTGRES_PASSWORD: agenthold-ci
          POSTGRES_DB: agenthold_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agenthold -d agenthold_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AGENTHOLD_TEST_POSTGRES: postgres://agenthold:agenthold-ci@127.0.0.1:5432/agenthold_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Require the real PostgreSQL fixture
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 -v ./internal/store -run '^TestPostgresURLReopenIsolationAndCleanup$' | tee "$RUNNER_TEMP/postgres-proof.log"
          grep -q '^--- PASS: TestPostgresURLReopenIsolationAndCleanup ' "$RUNNER_TEMP/postgres-proof.log"
      - name: Full Go race suite against PostgreSQL
        run: make test-go
        env:
          GOFLAGS: -count=1

  go-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: ./...

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: make lint-web test-web web

  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: make generate
      - name: Generated code is up to date
        run: git diff --exit-code

  native-build:
    name: Native build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: make build
      - uses: actions/upload-artifact@v7
        with:
          name: native-build-${{ matrix.arch }}
          path: bin/
          if-no-files-found: error

