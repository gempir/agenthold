# Cloudflare Tunnel instead of Caddy: no inbound ports, Cloudflare terminates
# TLS. Enable with COMPOSE_FILE=docker-compose.yml:docker-compose.cloudflared.yml
# in .env and set CLOUDFLARE_TUNNEL_TOKEN (docs/install.md).
services:
  caddy:
    profiles: ["caddy"] # not started when the tunnel is used

  cloudflared:
    image: cloudflare/cloudflared:2026.11.0
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - agenthold
