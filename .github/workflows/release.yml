name: release preparation

# Manual artifact preparation only. Publishing remains disabled until runtime
# embedding, base-image pins and release checks are finalized.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Refresh package index
        run: sudo apt-get update
      - name: Prepare guest artifacts and runtime
        run: make guest-kernel guest-base runtime
      - name: Build native binaries
        run: make build
      - name: Stage artifacts and checksums
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p release
          cp bin/agenthold "release/agenthold-linux-$ARCH"
          cp "build/guest/$ARCH/base-$ARCH.ext4.zst" "build/guest/$ARCH/base-$ARCH.manifest.json" release/
          cp "build/guest/$ARCH/base-$ARCH.ext4.sha256" "build/guest/$ARCH/kernel.manifest.json" release/
          (cd release && sha256sum "agenthold-linux-$ARCH" "base-$ARCH.ext4.zst" > SHA256SUMS)
      - uses: actions/upload-artifact@v7
        with:
          name: release-preparation-${{ matrix.arch }}
          path: release/
          if-no-files-found: error
