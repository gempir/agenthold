name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Refresh package index
        run: sudo apt-get update
      - run: make web
      - name: Build bundled native release
        env:
          VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('sha-{0}', github.sha) }}
        run: scripts/release/build.sh
      - name: Name architecture-specific checksum manifest
        env:
          ARCH: ${{ matrix.arch }}
        run: mv "build/release/$ARCH/SHA256SUMS" "build/release/$ARCH/SHA256SUMS-$ARCH"
      - uses: actions/upload-artifact@v7
        with:
          name: bundled-release-${{ matrix.arch }}
          path: build/release/${{ matrix.arch }}/
          if-no-files-found: error
          compression-level: 0

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: bundled-release-*
          merge-multiple: true
          path: release
      - name: Publish immutable release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" --verify-tag --generate-notes release/*
