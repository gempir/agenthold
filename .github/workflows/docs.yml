name: docs

# Builds the documentation site (docs/, Nimbus on Astro) on every change to it
# and publishes it to Cloudflare at agenthold.dev when main changes. Setup: docs/src/content/https://agenthold.dev/docs-site/.
on:
  push:
    branches: [main]
    paths: ["docs/**", "api/openapi.yaml", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["docs/**", "api/openapi.yaml", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: docs/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # The build writes what the lint and the type check read (.nimbus/, .astro/).
      - run: pnpm run build
      - run: pnpm run check
      - run: pnpm run lint:docs
      - run: pnpm run typecheck
      - uses: actions/upload-artifact@v7
        with:
          name: docs-site
          path: docs/dist
          retention-days: 7
