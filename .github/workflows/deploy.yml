name: deploy

# Deploys main to production once its CI run is green: builds the server and
# base images for that commit (linux/arm64, the production host's platform),
# pushes them to ghcr.io as sha-<commit>, then switches the host to those exact
# digests over SSH (deploy/production/deploy.sh). Setup and rollback: docs/deploy.md.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: >-
          Redeploy this commit from images that already exist (rollback). Leave empty
          to build and deploy the current head of main.
        required: false
        type: string

permissions:
  contents: read

jobs:
  gate:
    # Only after a green CI run of a push to main in this repository.
    if: >-
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' ||
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.pick.outputs.sha }}
      deploy: ${{ steps.pick.outputs.deploy }}
      build: ${{ steps.pick.outputs.build }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          build=true
          if [ "$EVENT" = workflow_dispatch ]; then
            sha=${INPUT_SHA:-$GITHUB_SHA}
            [ -n "$INPUT_SHA" ] && build=false
          else
            sha=$RUN_SHA
          fi
          if ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::'$sha' is not a full 40-character commit sha"
            exit 1
          fi
          deploy=true
          if [ "$EVENT" = workflow_run ]; then
            head=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
            if [ "$head" != "$sha" ]; then
              echo "::notice::main moved on to $head; skipping $sha, that commit deploys itself"
              deploy=false
            fi
          fi
          {
            echo "sha=$sha"
            echo "deploy=$deploy"
            echo "build=$build"
          } >>"$GITHUB_OUTPUT"

  build:
    needs: gate
    if: needs.gate.outputs.deploy == 'true' && needs.gate.outputs.build == 'true'
    # Native arm64 runner: no QEMU, and the production host is arm64.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: agenthold
            context: .
          - image: agenthold-base
            context: images/base
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          platforms: linux/arm64
          push: true
          # A plain manifest (no attestation index), so the tag's digest is the image's.
          provenance: false
          sbom: false
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:sha-${{ needs.gate.outputs.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.gate.outputs.sha }}
          build-args: |
            VERSION=sha-${{ needs.gate.outputs.sha }}
            COMMIT=${{ needs.gate.outputs.sha }}
          cache-from: type=gha,scope=deploy-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=deploy-${{ matrix.image }}

  deploy:
    needs: [gate, build]
    # build is skipped for a rollback (images exist already) but must not have failed.
    if: >-
      !cancelled() && needs.gate.outputs.deploy == 'true' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    # One deploy at a time. A deploy waiting behind another is replaced by a
    # newer one; a running deploy is never cancelled half way.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      SHA: ${{ needs.gate.outputs.sha }}
      REGISTRY_PATH: ghcr.io/${{ github.repository_owner }}
    steps:
      - name: Still the head of main?
        id: fresh
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          # Builds finish out of order; never replace a newer deploy with an older one.
          ok=true
          if [ "$EVENT" = workflow_run ]; then
            head=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
            if [ "$head" != "$SHA" ]; then
              echo "::notice::main moved on to $head; not deploying $SHA"
              ok=false
            fi
          fi
          echo "ok=$ok" >>"$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        if: steps.fresh.outputs.ok == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image digests
        if: steps.fresh.outputs.ok == 'true'
        id: images
        run: |
          # Deploy by digest: what runs is exactly what was built for this commit.
          for image in agenthold agenthold-base; do
            digest=$(docker buildx imagetools inspect "$REGISTRY_PATH/$image:sha-$SHA" --format '{{.Manifest.Digest}}')
            case "$digest" in sha256:*) ;; *) echo "::error::no image $image:sha-$SHA ($digest)"; exit 1 ;; esac
            echo "${image//-/_}=$REGISTRY_PATH/$image@$digest" >>"$GITHUB_OUTPUT"
          done

      - name: Configure SSH
        if: steps.fresh.outputs.ok == 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" >~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" >~/.ssh/known_hosts

      - name: Deploy
        if: steps.fresh.outputs.ok == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          SERVER_IMAGE: ${{ steps.images.outputs.agenthold }}
          BASE_IMAGE: ${{ steps.images.outputs.agenthold_base }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The host verifies the new container (health check, exact image) and
          # rolls back itself if that fails; a non-zero exit fails this job.
          # The ghcr token goes over stdin, for this run's pulls only.
          printf '%s\n' "$GHCR_TOKEN" | ssh -i ~/.ssh/deploy_key \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 -o ConnectTimeout=20 \
            "$DEPLOY_USER@$DEPLOY_HOST" "deploy $SERVER_IMAGE $BASE_IMAGE $SHA"

      - name: Check the public URL
        if: steps.fresh.outputs.ok == 'true' && vars.DEPLOY_URL != ''
        env:
          URL: ${{ vars.DEPLOY_URL }}
        run: |
          for i in $(seq 1 20); do
            curl -fsS --max-time 10 "$URL/healthz" >/dev/null && exit 0
            sleep 6
          done
          echo "::error::$URL/healthz did not answer after the deploy"
          exit 1

      - name: Summary
        if: always() && steps.fresh.outputs.ok == 'true'
        env:
          SERVER_IMAGE: ${{ steps.images.outputs.agenthold }}
          BASE_IMAGE: ${{ steps.images.outputs.agenthold_base }}
        run: |
          {
            echo "### Production deploy"
            echo "- commit: \`$SHA\`"
            echo "- server: \`$SERVER_IMAGE\`"
            echo "- base: \`$BASE_IMAGE\`"
          } >>"$GITHUB_STEP_SUMMARY"
