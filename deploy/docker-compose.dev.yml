# Development stack: `make dev`, then open http://localhost:8080.
# The server always runs in a container (see PLAN.md 3.1). It rebuilds on Go
# changes and proxies the UI to Vite, which hot-reloads through the same port.
name: agenthold-dev

services:
    server:
        build:
            context: ..
            dockerfile: deploy/Dockerfile.dev
        working_dir: /src
        volumes:
            - ..:/src
            - go-mod:/go/pkg/mod
            - go-build:/root/.cache/go-build
            - server-data:/data
            - /var/run/docker.sock:/var/run/docker.sock
            # Shared with every sandbox (read-only at /opt/agenthold): carries sandboxd.
            - sandboxd-bin:/var/lib/agenthold/bin
        environment:
            AGENTHOLD_CONFIG: /src/deploy/dev/agenthold.yaml
            # "off" serves the embedded production build of the UI instead of Vite
            # (build it first: make web). CI does this.
            AGENTHOLD_DEV_PROXY: "${AGENTHOLD_DEV_PROXY:-}"
            GITHUB_CLIENT_ID: "${GITHUB_CLIENT_ID:-}"
            GITHUB_CLIENT_SECRET: "${GITHUB_CLIENT_SECRET:-}"
        # The egress firewall (nftables in the server's own network namespace).
        cap_add:
            - NET_ADMIN
        ports:
            - "8080:8080"
        depends_on:
            - web
            - keycloak

    keycloak:
        image: quay.io/keycloak/keycloak:26.4.7
        command: start-dev --import-realm --http-port=8081
        environment:
            KC_BOOTSTRAP_ADMIN_USERNAME: admin
            KC_BOOTSTRAP_ADMIN_PASSWORD: admin
            KC_HOSTNAME: "http://localhost:8081"
            KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
        ports:
            - "8081:8081"
        volumes:
            - ./dev/keycloak:/opt/keycloak/data/import:ro

    web:
        image: node:26-alpine
        working_dir: /src/web
        command: sh -c "npm install -g pnpm@11.7.0 >/dev/null && pnpm install --frozen-lockfile --store-dir /pnpm-store && pnpm dev"
        volumes:
            - ../web:/src/web
            - web-node-modules:/src/web/node_modules
            - pnpm-store:/pnpm-store
        environment:
            AGENTHOLD_API_URL: "http://server:8080"
            CHOKIDAR_USEPOLLING: "true"

volumes:
    sandboxd-bin:
        name: agenthold-dev-bin
    server-data:
    go-mod:
    go-build:
    web-node-modules:
    pnpm-store:
