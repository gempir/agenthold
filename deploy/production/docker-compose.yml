# agenthold production stack: the server and Caddy (automatic HTTPS).
# See docs/install.md. Run from this directory: docker compose up -d
name: agenthold

services:
  agenthold:
    image: ${AGENTHOLD_IMAGE:-ghcr.io/gempir/agenthold:latest}
    # Build from source instead of pulling: docker compose build
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    # The server manages Docker and installs the egress firewall in its own
    # network namespace; it must run as root with CAP_NET_ADMIN.
    user: "0:0"
    cap_add:
      - NET_ADMIN
    env_file: .env
    environment:
      AGENTHOLD_CONFIG: /etc/agenthold/agenthold.yaml
      AGENTHOLD_PUBLIC_URL: https://${AGENTHOLD_DOMAIN}
      # Image for new agents (agenthold.yaml). Set here, not only in .env, so
      # deploy.sh can pin it to a digest (docs/deploy.md).
      AGENTHOLD_BASE_IMAGE: ${AGENTHOLD_BASE_IMAGE:-ghcr.io/gempir/agenthold-base:latest}
    volumes:
      - ./agenthold.yaml:/etc/agenthold/agenthold.yaml:ro
      - data:/data
      # sandboxd is shared with every sandbox from this volume.
      - sandboxd-bin:/var/lib/agenthold/bin
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "/usr/local/bin/agenthold", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2.11.9
    restart: unless-stopped
    command: caddy reverse-proxy --from ${AGENTHOLD_DOMAIN} --to agenthold:8080
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - agenthold

volumes:
  data:
  sandboxd-bin:
    # Must match sandbox.docker.sandboxd_volume (default <name_prefix>-bin).
    name: agenthold-bin
  caddy-data:
  caddy-config:
