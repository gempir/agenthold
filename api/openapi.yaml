openapi: 3.0.3
info:
  title: agenthold API
  version: 0.1.0
  description: |
    REST API of the agenthold server. Browser clients authenticate with the
    session cookie set by the login flow. All paths are under /api/v1.

    **Machines: agents and apps.** Every machine (one microVM) has a kind:
    `agent` runs a harness, `app` runs only services and is reached through
    exposures. Both kinds share one id space. The rule:

    - `/agents` and `/agents/{agentId}` itself (get, update, delete, start,
      stop, rebuild) are for agents; for an app id they answer 404. Apps have
      the same operations under `/apps` and `/apps/{appId}`, and `/apps/{appId}`
      answers 404 for an agent id. `GET /agents` never lists apps.
    - Harness-bound sub-resources (harness, sessions, schedules, webhooks,
      account logins, attached MCP servers and skills) answer 409 for an app.
    - Machine sub-resources work for both kinds and are addressed under
      `/agents/{agentId}/...` with the machine's id: services, exposures, files,
      terminal, shares, secrets and audit. An App lists them in `links`.
servers:
  - url: /api/v1
tags:
  - name: auth-flow
    description: Browser redirects of the login flow. Not JSON endpoints.
  - name: auth
  - name: agents
  - name: nodes
  - name: admin
  - name: files
  - name: sessions
  - name: sharing
  - name: tokens
  - name: provider-logins
    description: Claude Code and Codex logins kept on your account and used by your agents.
  - name: triggers
    description: Schedules and webhooks.
  - name: tools
    description: MCP servers and skills.
  - name: secrets
  - name: egress
  - name: exposure
    description: Preview URLs for ports of a machine.
  - name: services
    description: Long-running commands supervised inside a machine (agents and apps).
  - name: apps
    description: Machines without a harness that run services.
  - name: streams
    description: WebSocket endpoints. Not generated as JSON handlers.
  - name: meta

paths:
  /version:
    get:
      operationId: getVersion
      tags: [meta]
      security: []
      responses:
        "200":
          description: Build information.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Version" }

  /sandbox/limits:
    get:
      operationId: getSandboxLimits
      tags: [agents]
      responses:
        "200":
          description: Defaults and limits for agent sandboxes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SandboxLimits" }

  /auth/providers:
    get:
      operationId: listAuthProviders
      tags: [auth]
      security: []
      responses:
        "200":
          description: Configured sign-in providers.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AuthProvider" }

  /auth/login/{provider}:
    get:
      operationId: login
      tags: [auth-flow]
      security: []
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string } }
        - name: redirect
          in: query
          description: Local path to return to after login. Defaults to "/".
          schema: { type: string }
      responses:
        "302": { description: Redirect to the identity provider. }
        "404": { $ref: "#/components/responses/Error" }

  /auth/callback/{provider}:
    get:
      operationId: loginCallback
      tags: [auth-flow]
      security: []
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string } }
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
      responses:
        "302": { description: "Session cookie set, redirect into the app." }
        "400": { $ref: "#/components/responses/Error" }

  /auth/local:
    post:
      operationId: localLogin
      tags: [auth-flow]
      security: []
      description: |
        Sign in as the local admin configured in `auth.local`. Sets the
        session cookie. Attempts are rate limited per client address.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LocalLoginInput" }
      responses:
        "204": { description: Signed in; session cookie set. }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /auth/logout:
    post:
      operationId: logout
      tags: [auth-flow]
      responses:
        "204": { description: Session ended. }

  /me:
    get:
      operationId: getMe
      tags: [auth]
      responses:
        "200":
          description: The signed-in user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Error" }

  /nodes:
    get:
      operationId: listNodes
      tags: [nodes]
      description: Nodes that run agents and their status. Admins only.
      responses:
        "200":
          description: Nodes and their last reported capacity.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/NodeInfo" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /admin/overview:
    get:
      operationId: getAdminOverview
      tags: [admin]
      description: >-
        Everything running on this installation: every node, and every machine (agents and apps, of all
        owners) with its state, owner, configured size and live usage. Admins only (the same notion as the
        node endpoints: the local admin and users listed in auth.admins). Live usage comes from inside
        running machines, fetched concurrently with a short timeout and cached for a few seconds; a machine
        that does not answer keeps its row and gets a `usageReason` instead. Sleeping machines are never
        woken. Machines of an offline node are `unreachable` and are not contacted.
      responses:
        "200":
          description: The overview.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminOverview" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /nodes/join-tokens:
    post:
      operationId: createNodeJoinToken
      tags: [nodes]
      description: >-
        Creates a single-use token for `agenthold node --join <token>`. The token is shown once and
        expires after ttlMinutes (default 60, at most 1440). Admins only.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateNodeJoinToken" }
      responses:
        "201":
          description: The new token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NodeJoinToken" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /nodes/{nodeId}:
    parameters:
      - { name: nodeId, in: path, required: true, schema: { type: string } }
    delete:
      operationId: deleteNode
      tags: [nodes]
      description: >-
        Removes an edge node and disconnects it. Refused while the node hosts agents, unless the node is
        offline and force is set: then its agents are forgotten (their disks stay on that machine). Admins only.
      parameters:
        - { name: force, in: query, required: false, schema: { type: boolean } }
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /agents:
    get:
      operationId: listAgents
      tags: [agents]
      description: Agents you own and agents shared with you. Templates are left out unless asked for.
      parameters:
        - name: template
          in: query
          required: false
          description: '`false` (default) lists the machines that are not templates, `true` only templates, `all` both.'
          schema: { type: string, enum: ["true", "false", "all"], default: "false" }
      responses:
        "200":
          description: Agents.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Agent" }
    post:
      operationId: createAgent
      tags: [agents]
      description: Create an agent. You become its owner.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentInput" }
      responses:
        "201":
          description: Created. The sandbox is provisioned in the background.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agent" }
        "400": { $ref: "#/components/responses/Error" }

  /agents/{agentId}:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    get:
      operationId: getAgent
      tags: [agents]
      responses:
        "200":
          description: The agent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agent" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateAgent
      tags: [agents]
      description: Resource changes take effect after a system reset (see `needsRebuild`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentPatch" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agent" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteAgent
      tags: [agents]
      description: Destroys the sandbox and its home volume, then the agent. Runs in the background.
      responses:
        "202": { description: Destruction started. }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /agents/{agentId}/start:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    post:
      operationId: startAgent
      tags: [agents]
      responses:
        "202":
          description: Starting.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agent" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /agents/{agentId}/stop:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    post:
      operationId: stopAgent
      tags: [agents]
      responses:
        "202":
          description: Stopping. The home volume is kept.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agent" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /agents/{agentId}/rebuild:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    post:
      operationId: rebuildAgent
      description: Owner only.
      tags: [agents]
      responses:
        "202":
          description: Resetting the system and applying current resources; the home disk is kept.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agent" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /agents/{agentId}/clone:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    post:
      operationId: cloneAgent
      tags: [agents]
      description: |
        Clone the machine: a new agent with a copy of its system and home disks and of its settings,
        attached MCP servers, skills and secrets (not its shares, sessions, schedules or webhooks).
        A running machine is stopped for the copy and started again afterwards (409 while it works on a
        prompt). 409 also when its system needs a reset first: it is on an older base image than the current
        one, or has pending changes, and a clone would inherit that. The clone is placed on
        the same node and provisioned in the background. A template is cloned the same way ("new agent
        from template"). Owner only: the home disk can hold harness credentials.

        Cloning is machine-level: for an app id it makes a new app (kind `app`, owned by you, managed by
        no agent) with a copy of its disks and services but not its exposures; its name must be a free
        app name and `apps.max_per_owner` applies. Apps can be templates under the same rules.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CloneInput" }
      responses:
        "201":
          description: Created. The disks are copied in the background; the new agent is `creating` until then.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agent" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /apps:
    get:
      operationId: listApps
      tags: [apps]
      description: Apps you own and apps shared with you.
      responses:
        "200":
          description: Apps.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/App" }
    post:
      operationId: createApp
      tags: [apps]
      description: Create an app (a machine without a harness). You become its owner.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppInput" }
      responses:
        "201":
          description: Created. The machine is provisioned in the background.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/App" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /apps/{appId}:
    parameters:
      - $ref: "#/components/parameters/AppId"
    get:
      operationId: getApp
      tags: [apps]
      responses:
        "200":
          description: The app.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/App" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateApp
      tags: [apps]
      description: Owner only. Resource changes take effect after a system reset (see `needsRebuild`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppPatch" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/App" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteApp
      tags: [apps]
      description: Owner only. Destroys the machine and its disks. Runs in the background.
      responses:
        "202": { description: Destruction started. }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /apps/{appId}/start:
    parameters:
      - $ref: "#/components/parameters/AppId"
    post:
      operationId: startApp
      tags: [apps]
      responses:
        "202":
          description: Starting. Its services start with it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/App" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /apps/{appId}/stop:
    parameters:
      - $ref: "#/components/parameters/AppId"
    post:
      operationId: stopApp
      tags: [apps]
      responses:
        "202":
          description: Stopping. Its services stop; the disks are kept.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/App" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /apps/{appId}/rebuild:
    parameters:
      - $ref: "#/components/parameters/AppId"
    post:
      operationId: rebuildApp
      description: Owner only. Resets the system disk; the home disk (with the deployed releases) is kept.
      tags: [apps]
      responses:
        "202":
          description: Resetting.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/App" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /apps/{appId}/take-over:
    parameters:
      - $ref: "#/components/parameters/AppId"
    post:
      operationId: takeOverApp
      tags: [apps]
      description: |
        Owner only. The agent that created the app stops managing it: it can
        no longer deploy to it, run commands in it, read its logs, restart,
        stop or delete it. No agent manages it afterwards; this cannot be
        undone (an agent can only deploy a new app under another name).
      responses:
        "200":
          description: Taken over.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/App" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /apps/{appId}/deploy:
    parameters:
      - $ref: "#/components/parameters/AppId"
    post:
      operationId: deployApp
      tags: [apps]
      description: |
        Owner only. Copy a directory of a source machine (one you may open a
        terminal in) into a new release of the app (`~/app/releases/<n>`),
        point `~/app/current` at it, define the service `app` (the command
        runs in `~/app/current` with `PORT`), (re)start it, expose the port and
        wait up to 60 s for it to accept connections. A copy that fails
        leaves the previous release serving; a release whose port does not
        come up is rolled back (`ready` false, `rolledBack` true, `logs` set).
        Sleeping machines are woken. The last 3 releases are kept.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeployInput" }
      responses:
        "200":
          description: Deployed (see `ready`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeployResult" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /agents/{agentId}/terminal:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    get:
      operationId: openTerminal
      tags: [streams]
      description: |
        WebSocket upgrade to an interactive shell in the sandbox (owner or shared user).
        A sleeping agent is woken. Binary messages carry terminal input and
        output. Text messages are JSON: the client sends
        `{"type":"resize","cols":N,"rows":N}`; the server sends
        `{"type":"status","message":"..."}` while waking,
        `{"type":"exit","code":N}` and `{"type":"error","message":"..."}`.
      parameters:
        - { name: cols, in: query, schema: { type: integer } }
        - { name: rows, in: query, schema: { type: integer } }
        - name: auth
          in: query
          description: Run this harness login method (owner only) instead of a shell.
          schema: { type: string }
      responses:
        "101": { description: Switching to WebSocket. }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /agents/{agentId}/files:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    get:
      operationId: listFiles
      tags: [files]
      description: List a directory. Relative paths are relative to /home/agent. The agent must be running.
      parameters:
        - { name: path, in: query, schema: { type: string } }
      responses:
        "200":
          description: Directory listing.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DirListing" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteFile
      tags: [files]
      parameters:
        - { name: path, in: query, required: true, schema: { type: string } }
        - { name: recursive, in: query, schema: { type: boolean } }
      responses:
        "204": { description: Deleted. }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /agents/{agentId}/files/content:
    parameters:
      - $ref: "#/components/parameters/AgentId"
      - { name: path, in: query, required: true, schema: { type: string } }
    get:
      operationId: downloadFile
      tags: [files]
      responses:
        "200":
          description: File content.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    put:
      operationId: uploadFile
      tags: [files]
      description: Create or replace a file (owner or shared user). Missing parent directories are created.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "204": { description: Written. }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /agents/{agentId}/files/mkdir:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    post:
      operationId: makeDirectory
      tags: [files]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path: { type: string }
      responses:
        "204": { description: Created. }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /egress/ca.pem:
    get:
      operationId: getEgressCA
      tags: [egress]
      description: The installation's egress CA certificate (trusted inside sandboxes).
      responses:
        "200":
          description: PEM certificate.
          content:
            application/x-pem-file:
              schema: { type: string }

  /secrets/presets:
    get:
      operationId: listSecretPresets
      tags: [secrets]
      responses:
        "200":
          description: Injection rule presets for common providers.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SecretPreset" }

  /secrets:
    get:
      operationId: listSecrets
      tags: [secrets]
      description: Your secrets. Values are never returned.
      responses:
        "200":
          description: Secrets.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Secret" }
    post:
      operationId: createSecret
      tags: [secrets]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SecretInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Secret" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /secrets/{secretId}:
    parameters:
      - { name: secretId, in: path, required: true, schema: { type: string } }
    patch:
      operationId: updateSecret
      tags: [secrets]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SecretPatch" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Secret" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteSecret
      tags: [secrets]
      responses:
        "204": { description: Deleted and detached from all agents. }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /agents/{agentId}/secrets:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    get:
      operationId: listAgentSecrets
      tags: [secrets]
      responses:
        "200":
          description: Secrets attached to the agent.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AttachedSecret" }
        "404": { $ref: "#/components/responses/Error" }

  /agents/{agentId}/secrets/{secretId}:
    parameters:
      - $ref: "#/components/parameters/AgentId"
      - { name: secretId, in: path, required: true, schema: { type: string } }
    put:
      operationId: attachSecret
      tags: [secrets]
      description: |
        Attach one of your secrets to an agent you own.
        Injection works immediately; a changed environment variable needs a system reset.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                envVar: { type: string, description: Variable that holds the placeholder in the sandbox. }
      responses:
        "200":
          description: Attached.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttachedSecret" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: detachSecret
      tags: [secrets]
      responses:
        "204": { description: Detached. }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /harnesses:
    get:
      operationId: listHarnesses
      tags: [sessions]
      responses:
        "200":
          description: Available harnesses.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/HarnessType" }

  /agents/{agentId}/harness:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    get:
      operationId: getHarness
      tags: [sessions]
      description: The agent's harness. With connect=true the harness is started (waking the agent) to discover login methods.
      parameters:
        - { name: connect, in: query, schema: { type: boolean } }
      responses:
        "200":
          description: Harness state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HarnessState" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /agents/{agentId}/models:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    get:
      operationId: listModels
      tags: [sessions]
      description: |
        The models the agent's harness offers and their options (reasoning effort, fast mode), as the harness last
        reported them, or agenthold's small fallback list for the harness when it never did. Does not wake the agent.
      responses:
        "200":
          description: The model catalog.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelCatalog" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /agents/{agentId}/sessions:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    get:
      operationId: listSessions
      tags: [sessions]
      responses:
        "200":
          description: Sessions, most recently active first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Session" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: createSession
      tags: [sessions]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, maxLength: 200 }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /sessions/{sessionId}:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      operationId: getSession
      tags: [sessions]
      responses:
        "200":
          description: The session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: renameSession
      tags: [sessions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string, minLength: 1, maxLength: 200 }
      responses:
        "200":
          description: Renamed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteSession
      tags: [sessions]
      responses:
        "204": { description: Deleted. }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /sessions/{sessionId}/model:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    put:
      operationId: setSessionModel
      tags: [sessions]
      description: |
        The session's own model and options. An empty model with no options returns the session to the agent's
        default. It applies from the next message on (a running turn keeps its model).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ModelChoice" }
      responses:
        "200":
          description: Set.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /sessions/{sessionId}/prompt:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      operationId: promptSession
      tags: [sessions]
      description: Start a turn (owner or shared user). Wakes the agent if it sleeps. Progress arrives on the event stream.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, minLength: 1 }
      responses:
        "202": { description: The turn started. }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /sessions/{sessionId}/cancel:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      operationId: cancelSession
      tags: [sessions]
      responses:
        "202": { description: Cancellation requested. }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /sessions/{sessionId}/permissions/{requestId}:
    parameters:
      - $ref: "#/components/parameters/SessionId"
      - { name: requestId, in: path, required: true, schema: { type: string } }
    post:
      operationId: answerPermission
      tags: [sessions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [optionId]
              properties:
                optionId: { type: string }
      responses:
        "204": { description: Answered. }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /sessions/{sessionId}/events:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      operationId: listSessionEvents
      tags: [sessions]
      description: Stored events after a cursor. For live updates use the stream.
      parameters:
        - { name: after, in: query, schema: { type: integer, format: int64 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 5000 } }
      responses:
        "200":
          description: Events in order.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SessionEvent" }
        "404": { $ref: "#/components/responses/Error" }

  /sessions/{sessionId}/stream:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      operationId: streamSession
      tags: [streams]
      description: |
        WebSocket. The server sends every event after `after` as a JSON text
        message (a SessionEvent), then live events as they happen. After a
        reconnect, pass the last seq received to continue without gaps.
        `{"type":"status","running":bool}` messages report whether a turn runs;
        `{"type":"presence","viewers":[{id,name,avatarUrl,role}]}` lists who is watching.
      parameters:
        - { name: after, in: query, schema: { type: integer, format: int64 } }
      responses:
        "101": { description: Switching to WebSocket. }
        "404": { $ref: "#/components/responses/Error" }

  /agents/{agentId}/shares:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    get:
      operationId: listShares
      tags: [sharing]
      description: The agent's owner and the users it is shared with.
      responses:
        "200":
          description: Access list.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccessList" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: shareAgent
      tags: [sharing]
      description: |
        Share the agent with another user (owner only), found by verified
        email. A user exists once they have signed in. Shared users can use
        the agent (chat, terminal, files) but not configure, share or delete it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShareInput" }
      responses:
        "200":
          description: Shared (or already shared).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Share" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /agents/{agentId}/shares/{userId}:
    parameters:
      - $ref: "#/components/parameters/AgentId"
      - { name: userId, in: path, required: true, schema: { type: string } }
    delete:
      operationId: unshareAgent
      tags: [sharing]
      description: Stop sharing with a user (owner), or leave an agent shared with you.
      responses:
        "204": { description: Removed. }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /agents/{agentId}/audit:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    get:
      operationId: listAgentAudit
      tags: [sharing]
      description: Who did what to this agent (owner only). Newest first.
      parameters:
        - { name: before, in: query, schema: { type: integer, format: int64 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500 } }
      responses:
        "200":
          description: Audit entries.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AuditEntry" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /agents/{agentId}/exposures:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    get:
      operationId: listExposures
      tags: [exposure]
      description: |
        The machine's exposed ports (owner or shared user). `enabled` is false
        when the server has no `preview.host_suffix`; the list is then empty.
      responses:
        "200":
          description: Exposures.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExposureList" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: createExposure
      tags: [exposure]
      description: |
        Expose a TCP port of the machine over HTTP at
        `<name><preview.host_suffix>` (owner only). The name defaults to
        `<agent-name>-<port>`. A port can be exposed once.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExposureInput" }
      responses:
        "201":
          description: Exposed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Exposure" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /agents/{agentId}/exposures/{exposureId}:
    parameters:
      - $ref: "#/components/parameters/AgentId"
      - { name: exposureId, in: path, required: true, schema: { type: string } }
    patch:
      operationId: updateExposure
      tags: [exposure]
      description: Rename an exposure or change who may open it (owner only).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExposurePatch" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Exposure" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteExposure
      tags: [exposure]
      description: Stop exposing the port (owner only).
      responses:
        "204": { description: Removed. }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /agents/{agentId}/services:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    get:
      operationId: listServices
      tags: [services]
      description: |
        The machine's services (owner or shared user), with their live status
        while the machine runs (`running` false: the machine is not connected
        and every service is down; enabled services start with it).
      responses:
        "200":
          description: Services.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceList" }
        "404": { $ref: "#/components/responses/Error" }

  /agents/{agentId}/services/{serviceName}:
    parameters:
      - $ref: "#/components/parameters/AgentId"
      - $ref: "#/components/parameters/ServiceName"
    get:
      operationId: getService
      tags: [services]
      responses:
        "200":
          description: The service.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Service" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      operationId: putService
      tags: [services]
      description: |
        Create or replace a service (owner only) and apply it to the running
        machine: a new or changed service (re)starts, an unchanged one keeps
        running. The command runs with `sh -lc` as the agent account in
        `workdir` (relative to the home). Secrets reach services through
        attached secrets' placeholders, never through `env`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServiceInput" }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Service" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteService
      tags: [services]
      description: Stop and remove a service (owner only).
      responses:
        "204": { description: Removed. }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /agents/{agentId}/services/{serviceName}/start:
    parameters:
      - $ref: "#/components/parameters/AgentId"
      - $ref: "#/components/parameters/ServiceName"
    post:
      operationId: startService
      tags: [services]
      description: Enable the service and start it if the machine runs (owner only).
      responses:
        "200":
          description: Started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Service" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /agents/{agentId}/services/{serviceName}/stop:
    parameters:
      - $ref: "#/components/parameters/AgentId"
      - $ref: "#/components/parameters/ServiceName"
    post:
      operationId: stopService
      tags: [services]
      description: Disable the service and stop it with everything it started (owner only).
      responses:
        "200":
          description: Stopped.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Service" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /agents/{agentId}/services/{serviceName}/restart:
    parameters:
      - $ref: "#/components/parameters/AgentId"
      - $ref: "#/components/parameters/ServiceName"
    post:
      operationId: restartService
      tags: [services]
      description: Restart the service now, resetting its backoff (owner only; the machine must run).
      responses:
        "200":
          description: Restarted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Service" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /agents/{agentId}/services/{serviceName}/logs:
    parameters:
      - $ref: "#/components/parameters/AgentId"
      - $ref: "#/components/parameters/ServiceName"
    get:
      operationId: getServiceLogs
      tags: [services]
      description: |
        The last `lines` lines (default 200, at most 10000) of the service's
        output, as plain text (owner or shared user; the machine must run).
        Lines starting with `agenthold:` are written by the supervisor
        (starts, exits, restarts).
      parameters:
        - { name: lines, in: query, schema: { type: integer, minimum: 1, maximum: 10000 } }
      responses:
        "200":
          description: Log output.
          content:
            text/plain:
              schema: { type: string }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /agents/{agentId}/services/{serviceName}/logs/stream:
    parameters:
      - $ref: "#/components/parameters/AgentId"
      - $ref: "#/components/parameters/ServiceName"
    get:
      operationId: streamServiceLogs
      tags: [streams]
      description: |
        WebSocket. The server sends the last `lines` lines, then new output
        as it is written, as text messages of raw log text. It sends
        `{"type":"error","message":"..."}` as a text message starting with
        `{` only when following fails, then closes.
      parameters:
        - { name: lines, in: query, schema: { type: integer } }
      responses:
        "101": { description: Switching to WebSocket. }
        "404": { $ref: "#/components/responses/Error" }

  /preview/authorize:
    get:
      operationId: authorizePreview
      tags: [auth-flow]
      description: |
        Exposure hosts send browsers here when they have no preview cookie.
        Only top-level navigations are served (`Sec-Fetch-Dest: document`,
        `Sec-Fetch-Mode: navigate` when the browser sends them). Requires a
        signed-in user (otherwise redirects to the login page and back),
        checks access to the exposure, asks for consent when the exposure is
        `authenticated` and the user has no access to the machine, and
        redirects to `<exposure host>/_agenthold/callback` with a single-use
        code bound to the exposure and to `state`.
      parameters:
        - { name: host, in: query, required: true, schema: { type: string } }
        - name: return
          in: query
          description: Path on the exposure host to return to. Defaults to "/".
          schema: { type: string }
        - name: state
          in: query
          required: true
          description: Hash of the exposure host's state cookie; binds the code to the browser.
          schema: { type: string }
      responses:
        "200": { description: "Consent page: an authenticated exposure of a machine you have no access to asks to see your identity." }
        "302": { description: Redirect to the exposure host or the login page. }
        "403": { description: No access to this exposure (HTML page). }
        "404": { description: No such exposure (HTML page). }
    post:
      operationId: confirmPreview
      tags: [auth-flow]
      description: The consent page's form. Records consent and continues like the GET.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [host]
              properties:
                host: { type: string }
                return: { type: string }
                state: { type: string }
      responses:
        "302": { description: Redirect to the exposure host. }
        "403": { description: Refused (HTML page). }

  /agents/{agentId}/mcp-servers:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    get:
      operationId: listAgentMCPServers
      tags: [tools]
      description: The agent's own servers and attached library servers.
      responses:
        "200":
          description: MCP servers used by the agent.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MCPServer" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: createAgentMCPServer
      tags: [tools]
      description: A server only this agent uses (owner only).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MCPServerInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MCPServer" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /agents/{agentId}/mcp-servers/{serverId}:
    parameters:
      - $ref: "#/components/parameters/AgentId"
      - { name: serverId, in: path, required: true, schema: { type: string } }
    put:
      operationId: attachMCPServer
      tags: [tools]
      description: Attach one of your library servers (owner only). Takes effect in the next session.
      responses:
        "204": { description: Attached. }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: detachMCPServer
      tags: [tools]
      description: Detach a library server, or delete one of the agent's own servers.
      responses:
        "204": { description: Detached. }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /mcp-servers:
    get:
      operationId: listMCPServers
      tags: [tools]
      responses:
        "200":
          description: Your MCP server library (attachable to your agents).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MCPServer" }
    post:
      operationId: createMCPServer
      tags: [tools]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MCPServerInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MCPServer" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /mcp-servers/{serverId}:
    parameters:
      - { name: serverId, in: path, required: true, schema: { type: string } }
    put:
      operationId: updateMCPServer
      tags: [tools]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MCPServerInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MCPServer" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteMCPServer
      tags: [tools]
      responses:
        "204": { description: Deleted (and detached everywhere). }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /skills:
    get:
      operationId: listSkills
      tags: [tools]
      responses:
        "200":
          description: Your skills library.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Skill" }
    post:
      operationId: createSkill
      tags: [tools]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SkillInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Skill" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /skills/{skillId}:
    parameters:
      - { name: skillId, in: path, required: true, schema: { type: string } }
    put:
      operationId: updateSkill
      tags: [tools]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SkillInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Skill" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteSkill
      tags: [tools]
      responses:
        "204": { description: Deleted. }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /agents/{agentId}/skills:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    get:
      operationId: listAgentSkills
      tags: [tools]
      responses:
        "200":
          description: Skills attached to the agent.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Skill" }
        "404": { $ref: "#/components/responses/Error" }

  /agents/{agentId}/skills/{skillId}:
    parameters:
      - $ref: "#/components/parameters/AgentId"
      - { name: skillId, in: path, required: true, schema: { type: string } }
    put:
      operationId: attachSkill
      tags: [tools]
      description: Attach one of your skills (owner only). It is written into the sandbox for the next session.
      responses:
        "204": { description: Attached. }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: detachSkill
      tags: [tools]
      responses:
        "204": { description: Detached; removed from the sandbox in the next session. }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /me/tokens:
    get:
      operationId: listTokens
      tags: [tokens]
      responses:
        "200":
          description: Your personal access tokens (without their values).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/APIToken" }
    post:
      operationId: createToken
      tags: [tokens]
      description: |
        Create a personal access token. It acts as you, with your permissions.
        Send it as `Authorization: Bearer <token>`. The token is shown once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                expiresInDays: { type: integer, minimum: 1, maximum: 3650 }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedAPIToken" }
        "400": { $ref: "#/components/responses/Error" }

  /me/tokens/{tokenId}:
    parameters:
      - { name: tokenId, in: path, required: true, schema: { type: string } }
    delete:
      operationId: deleteToken
      tags: [tokens]
      responses:
        "204": { description: Revoked. }
        "404": { $ref: "#/components/responses/Error" }

  /me/provider-logins:
    get:
      operationId: listProviderLogins
      tags: [provider-logins]
      description: |
        Harnesses whose login can live on your account, whether you connected
        each, and which agents use your logins. Credentials are never returned.
      responses:
        "200":
          description: One entry per harness with account logins.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProviderLoginInfo" }

  /me/provider-logins/{provider}:
    parameters:
      - { name: provider, in: path, required: true, schema: { type: string }, description: "Harness id (claude-code, codex)." }
    put:
      operationId: connectProviderLogin
      tags: [provider-logins]
      description: |
        Connect (or replace) your login for a harness. The credential is
        checked, stored encrypted and never shown again. Only from a browser
        session, not with an API token.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProviderLoginInput" }
      responses:
        "200":
          description: Connected.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderLoginInfo" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: disconnectProviderLogin
      tags: [provider-logins]
      description: Delete your login for a harness. Agents using it lose access at once.
      responses:
        "204": { description: Disconnected. }
        "404": { $ref: "#/components/responses/Error" }

  /agents/{agentId}/login:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    put:
      operationId: useMyLogins
      tags: [provider-logins]
      description: |
        Make the agent's harness use your account logins. Owner only. Users
        the agent is shared with then use your login through it.
      responses:
        "200":
          description: The agent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agent" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: stopUsingLogins
      tags: [provider-logins]
      description: |
        Stop using account logins: the harness then uses what is signed in
        inside its sandbox. The agent's owner, and the login's owner.
      responses:
        "200":
          description: The agent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agent" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /agents/{agentId}/schedules:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    get:
      operationId: listSchedules
      tags: [triggers]
      responses:
        "200":
          description: The agent's schedules.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Schedule" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: createSchedule
      tags: [triggers]
      description: Owner only. The schedule prompts its own session as you.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScheduleInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Schedule" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /schedules/{scheduleId}:
    parameters:
      - { name: scheduleId, in: path, required: true, schema: { type: string } }
    put:
      operationId: updateSchedule
      tags: [triggers]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScheduleInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Schedule" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteSchedule
      tags: [triggers]
      responses:
        "204": { description: Deleted. }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /schedules/{scheduleId}/run:
    parameters:
      - { name: scheduleId, in: path, required: true, schema: { type: string } }
    post:
      operationId: runSchedule
      tags: [triggers]
      description: Run now (owner or shared user).
      responses:
        "202": { description: The turn started. }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /agents/{agentId}/webhooks:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    get:
      operationId: listWebhooks
      tags: [triggers]
      responses:
        "200":
          description: The agent's webhooks.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Webhook" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: createWebhook
      tags: [triggers]
      description: Owner only. The URL is shown once; deliveries prompt the webhook's session as you.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebhookInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedWebhook" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /webhooks/{webhookId}:
    parameters:
      - { name: webhookId, in: path, required: true, schema: { type: string } }
    put:
      operationId: updateWebhook
      tags: [triggers]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebhookInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Webhook" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteWebhook
      tags: [triggers]
      responses:
        "204": { description: Deleted. }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /hooks/{token}:
    parameters:
      - { name: token, in: path, required: true, schema: { type: string } }
    post:
      operationId: deliverWebhook
      tags: [auth-flow]
      security: []
      description: |
        Inbound webhook (no session or token: the URL is the secret). The
        request body (up to 256 KiB) becomes part of the prompt, clearly marked
        as untrusted. If the webhook has a signing secret, the signature
        header must hold the HMAC-SHA256 of the body ("sha256=<hex>" or hex).
      requestBody:
        content:
          "*/*":
            schema: { type: string, format: binary }
      responses:
        "202": { description: The turn started. }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }

security:
  - session: []
  - token: []

components:
  securitySchemes:
    token:
      type: http
      scheme: bearer
      description: A personal access token (POST /me/tokens).
    session:
      type: apiKey
      in: cookie
      name: agenthold_session

  parameters:
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string }
    AgentId:
      name: agentId
      in: path
      required: true
      description: The machine id (an agent's or, for machine sub-resources, an app's).
      schema: { type: string }
    AppId:
      name: appId
      in: path
      required: true
      schema: { type: string }
    ServiceName:
      name: serviceName
      in: path
      required: true
      schema: { type: string }
  responses:
    Error:
      description: Error.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }

    Version:
      type: object
      required: [version, commit]
      properties:
        version: { type: string }
        commit: { type: string }

    AuthProvider:
      type: object
      required: [id, name, type]
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string, enum: [oidc, github, local], description: 'local: sign in with username and password (POST /auth/local).' }

    LocalLoginInput:
      type: object
      required: [username, password]
      properties:
        username: { type: string, maxLength: 256 }
        password: { type: string, maxLength: 1024 }

    User:
      type: object
      required: [id, email, name, avatarUrl]
      properties:
        id: { type: string }
        email: { type: string }
        name: { type: string }
        avatarUrl: { type: string }

    Me:
      type: object
      required: [user, admin]
      properties:
        user: { $ref: "#/components/schemas/User" }
        admin: { type: boolean, description: "Manages the installation: the local admin or a user listed in auth.admins." }

    SandboxState:
      type: string
      enum: [creating, starting, running, stopping, sleeping, rebuilding, destroying, error, unreachable]

    NodeInfo:
      type: object
      required: [id, name, online, local, agents]
      properties:
        id: { type: string }
        name: { type: string }
        online: { type: boolean }
        local: { type: boolean, description: The controller's built-in node. }
        agents: { type: integer, description: Agents placed on this node. }
        cpus: { type: integer, description: Logical CPUs reported by the node. }
        availableMemoryBytes: { type: integer, format: int64, description: Available memory at the last report. }
        freeDiskBytes: { type: integer, format: int64, description: Free data filesystem space at the last report. }
        lastSeen: { type: string, format: date-time, description: Last successful node contact. }

    OverviewAllocation:
      type: object
      required: [machines, cpus, memoryMb]
      description: Configured size (not usage) summed over a set of machines.
      properties:
        machines: { type: integer }
        cpus: { type: number, format: float, description: Sum of the machines' vCPUs. }
        memoryMb: { type: integer, format: int64, description: Sum of the machines' memory in MiB. }

    OverviewNode:
      type: object
      description: >-
        A node. `allocated` sums the configured size of every machine placed on it, whatever its state;
        `running` only of those running now.
      required: [id, name, online, local, allocated, running]
      properties:
        id: { type: string }
        name: { type: string }
        online: { type: boolean }
        local: { type: boolean, description: The controller's built-in node. }
        version: { type: string, description: "The agenthold release the node runs, if known." }
        lastSeen: { type: string, format: date-time }
        cpus: { type: integer, description: Logical CPUs (the last report if the node is offline). }
        memoryTotalBytes: { type: integer, format: int64, description: "Installed memory at the last report, if the node reports it." }
        availableMemoryBytes: { type: integer, format: int64, description: Available host memory at the last report. }
        freeDiskBytes: { type: integer, format: int64, description: Free data filesystem space at the last report. }
        diskAllocatedBytes: { type: integer, format: int64, description: "Space the machines' disk files occupy on the node (blocks actually allocated, not their sparse size), at the last report. Absent when the node does not report it." }
        allocated: { $ref: "#/components/schemas/OverviewAllocation" }
        running: { $ref: "#/components/schemas/OverviewAllocation" }

    OverviewUsage:
      type: object
      description: Usage measured inside a running machine.
      required: [sampledAt]
      properties:
        sampledAt: { type: string, format: date-time }
        cpuPercent:
          type: number
          format: float
          description: Share of the machine's vCPUs in use (0 to 100) between the two latest samples. Absent until there are two samples, and from guests that do not report it.
        memUsedBytes: { type: integer, format: int64 }
        memTotalBytes: { type: integer, format: int64 }
        homeUsedBytes: { type: integer, format: int64, description: Used space on the persistent home volume. }
        homeTotalBytes: { type: integer, format: int64, description: Size of the home volume. }
        rootUsedBytes: { type: integer, format: int64, description: Used space on the system volume (overlay). }
        rootTotalBytes: { type: integer, format: int64, description: Size of the system volume. }

    OverviewMachine:
      type: object
      required: [id, name, kind, isTemplate, owner, state, stateError, stateChangedAt, cpus, memoryMb, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        kind: { type: string, enum: [agent, app] }
        isTemplate: { type: boolean }
        owner: { $ref: "#/components/schemas/User" }
        nodeId: { type: string }
        nodeName: { type: string }
        state: { $ref: "#/components/schemas/SandboxState" }
        stateError: { type: string }
        stateChangedAt: { type: string, format: date-time }
        harness: { type: string, description: Agents only. }
        model: { type: string, description: Agents only; empty is the harness default. }
        cpus: { type: number, format: float, description: Configured vCPUs. }
        memoryMb: { type: integer, format: int64, description: Configured memory in MiB. }
        idleMinutes: { type: integer, description: Minutes without activity before it sleeps; 0 means never. }
        lastActivityAt: { type: string, format: date-time, description: Only while running. }
        sleepsAt: { type: string, format: date-time, description: Only while running and not busy. }
        createdAt: { type: string, format: date-time }
        usage: { $ref: "#/components/schemas/OverviewUsage" }
        usageReason:
          type: string
          enum: [node_offline, not_connected, timeout, unsupported, error]
          description: Why a running machine has no usage.

    OverviewTotals:
      type: object
      required: [machines, byState, allocated, running]
      properties:
        machines: { type: integer }
        byState:
          type: object
          description: Machines per sandbox state (offline nodes' machines count as unreachable).
          additionalProperties: { type: integer }
        allocated: { $ref: "#/components/schemas/OverviewAllocation" }
        running: { $ref: "#/components/schemas/OverviewAllocation" }

    AdminOverview:
      type: object
      required: [generatedAt, nodes, machines, totals]
      properties:
        generatedAt: { type: string, format: date-time }
        nodes: { type: array, items: { $ref: "#/components/schemas/OverviewNode" } }
        machines: { type: array, items: { $ref: "#/components/schemas/OverviewMachine" } }
        totals: { $ref: "#/components/schemas/OverviewTotals" }

    CreateNodeJoinToken:
      type: object
      properties:
        name: { type: string, description: Name for the node; by default the node proposes its hostname. }
        ttlMinutes: { type: integer, minimum: 1, maximum: 1440 }

    NodeJoinToken:
      type: object
      required: [token, expiresAt, command]
      properties:
        token: { type: string }
        expiresAt: { type: string, format: date-time }
        command: { type: string, description: The command to run on the new node. }

    AgentRole:
      type: string
      enum: [owner, shared]
      description: 'owner: full control. shared: use the agent (chat, terminal, files), not configure it.'

    Agent:
      type: object
      required: [id, name, owner, harness, model, modelOptions, permissionPolicy, credentialsInSandbox, login, cpus, memoryMb, idleMinutes, state, stateError, stateChangedAt, needsRebuild, isTemplate, role, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        owner: { $ref: "#/components/schemas/User" }
        nodeId: { type: string, description: Assigned node ID; absent before placement. }
        nodeName: { type: string, description: Assigned node name when known. }
        harness: { type: string }
        cpus: { type: number }
        memoryMb: { type: integer, format: int64 }
        idleMinutes: { type: integer }
        state: { $ref: "#/components/schemas/SandboxState" }
        stateError: { type: string }
        stateChangedAt: { type: string, format: date-time }
        needsRebuild:
          type: boolean
          description: Resources or environment changed since the sandbox was built.
        model: { type: string, description: The default model ('' is the harness's own default). }
        modelOptions:
          type: object
          additionalProperties: { type: string }
          description: Default model options, by harness config option id (see ModelCatalog).
        permissionPolicy: { type: string, enum: [auto-approve, ask] }
        credentialsInSandbox:
          type: boolean
          description: A harness login was completed inside the sandbox; the agent can read its own credentials.
        isTemplate:
          type: boolean
          description: The machine is a template. It cannot be started, chatted with or scheduled; clone it for a new machine.
        clonedFrom:
          type: string
          description: Id of the agent this one was cloned from, shown to the owner only. The source may no longer exist.
        login: { $ref: "#/components/schemas/AgentLogin" }
        lastActivityAt:
          type: string
          format: date-time
          description: Last activity while running (prompts, terminals, files, CPU use in the sandbox).
        sleepsAt:
          type: string
          format: date-time
          description: When the agent goes to sleep if nothing happens. Absent while busy or not running.
        role:
          $ref: "#/components/schemas/AgentRole"
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    AgentInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        cpus: { type: number }
        memoryMb: { type: integer, format: int64 }
        idleMinutes: { type: integer, minimum: 1, maximum: 10080 }
        harness: { type: string, description: Harness id (see /harnesses). Default claude-code. }
        model: { type: string }
        permissionPolicy: { type: string, enum: [auto-approve, ask] }

    CloneInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        asTemplate: { type: boolean, description: Create the clone as a template instead of a machine. }

    AgentPatch:
      type: object
      properties:
        isTemplate:
          type: boolean
          description: |
            Convert the machine to a template or back to a normal machine. It is stopped first (409 while it
            works on a prompt). Converting to a template disables its schedules and webhooks; they stay
            disabled when it is converted back, and cannot be enabled while it is a template.
        name: { type: string, minLength: 1, maxLength: 100 }
        cpus: { type: number }
        memoryMb: { type: integer, format: int64 }
        idleMinutes: { type: integer, minimum: 1, maximum: 10080 }
        harness: { type: string, description: Harness id (see /harnesses). Default claude-code. }
        model: { type: string, description: The default model. Changing the harness without a model resets it. }
        modelOptions:
          type: object
          additionalProperties: { type: string }
          description: Default model options, by harness config option id. Changing the harness resets them.
        permissionPolicy: { type: string, enum: [auto-approve, ask] }

    ModelChoice:
      type: object
      required: [model]
      properties:
        model: { type: string, maxLength: 200, description: "Model id ('' keeps the default)." }
        options:
          type: object
          additionalProperties: { type: string, maxLength: 100 }
          description: Values by option id (ModelOption.id).

    ModelCatalog:
      type: object
      required: [harness, source, switchable, customModels, models]
      properties:
        harness: { type: string }
        source:
          type: string
          enum: [harness, fallback]
          description: |
            harness: what the harness reported the last time it ran (seenAt). fallback: agenthold's list for the
            harness, shown until the harness has reported its own; it may not match what the account can use.
        seenAt: { type: string, format: date-time, description: When the harness reported the list (source harness). }
        switchable:
          type: boolean
          description: |
            The harness switches models within a conversation, from the next message on. Otherwise a new default
            applies when the harness restarts, and conversations cannot choose their own.
        customModels:
          type: boolean
          description: The harness accepts model ids it does not list (OpenCode's provider/model).
        models:
          type: array
          items: { $ref: "#/components/schemas/CatalogModel" }
        provisionalOptions:
          type: array
          description: |
            Effort levels the harness reported for other models, for the models whose options are still unknown
            (a harness describes only its current model; agenthold probes the others once the agent is idle).
            The harness has the last word at the next message: a level the model lacks is refused with a notice.
          items: { $ref: "#/components/schemas/ModelOption" }

    CatalogModel:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        group: { type: string, description: Heading in the picker (provider or family). }
        options:
          type: array
          description: The model's options; absent while unknown (the harness describes a model's options only while it is the current one, agenthold learns the others when the agent is idle).
          items: { $ref: "#/components/schemas/ModelOption" }

    ModelOption:
      type: object
      required: [id, name, kind, values]
      properties:
        id: { type: string, description: The harness's config option id. }
        name: { type: string }
        description: { type: string }
        kind:
          type: string
          enum: [effort, toggle]
          description: "effort: reasoning effort levels. toggle: on/off (fast mode); its values are off then on."
        values:
          type: array
          items: { $ref: "#/components/schemas/ModelOptionValue" }

    ModelOptionValue:
      type: object
      required: [value, name]
      properties:
        value: { type: string }
        name: { type: string }
        description: { type: string }

    SandboxLimits:
      type: object
      required: [defaultCpus, defaultMemoryMb, maxCpus, maxMemoryMb, minMemoryMb, driver]
      properties:
        driver: { type: string }
        defaultCpus: { type: number }
        defaultMemoryMb: { type: integer, format: int64 }
        maxCpus: { type: number }
        maxMemoryMb: { type: integer, format: int64 }
        minMemoryMb: { type: integer, format: int64, description: Smallest memory an agent can be given; smaller guests cannot run a harness. }

    FileEntry:
      type: object
      required: [name, size, mode, isDir, isLink, modTime]
      properties:
        name: { type: string }
        size: { type: integer, format: int64 }
        mode: { type: string }
        isDir: { type: boolean }
        isLink: { type: boolean }
        modTime: { type: string, format: date-time }

    DirListing:
      type: object
      required: [path, entries]
      properties:
        path: { type: string, description: Absolute path of the directory. }
        entries:
          type: array
          items: { $ref: "#/components/schemas/FileEntry" }

    SecretRule:
      type: object
      required: [hosts, header, template]
      properties:
        hosts:
          type: array
          items: { type: string }
          description: Exact host names or "*.example.com".
        header: { type: string }
        template: { type: string, description: 'Header value; {{.Value}} is the secret. Function: base64.' }

    SecretPreset:
      type: object
      required: [id, name, rule, envVar, description]
      properties:
        id: { type: string }
        name: { type: string }
        rule: { $ref: "#/components/schemas/SecretRule" }
        envVar: { type: string }
        description: { type: string }

    Secret:
      type: object
      required: [id, name, rule, placeholder, owner, canManage, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        rule: { $ref: "#/components/schemas/SecretRule" }
        placeholder: { type: string, description: What sandboxes see instead of the value. }
        owner: { $ref: "#/components/schemas/User" }
        canManage: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    SecretInput:
      type: object
      required: [name, value]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        value: { type: string, minLength: 1 }
        preset: { type: string, description: Use a preset's rule. }
        rule: { $ref: "#/components/schemas/SecretRule" }

    SecretPatch:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        value: { type: string, minLength: 1 }
        rule: { $ref: "#/components/schemas/SecretRule" }

    AttachedSecret:
      type: object
      required: [secret, envVar]
      properties:
        secret: { $ref: "#/components/schemas/Secret" }
        envVar: { type: string }

    HarnessType:
      type: object
      required: [id, name, default, secretPresets, accountLogins]
      properties:
        id: { type: string }
        accountLogins: { type: boolean, description: Its login can live on the user's account (/me/provider-logins). }
        default: { type: boolean, description: Used when an agent does not name a harness. }
        name: { type: string }
        secretPresets:
          type: array
          items: { type: string }

    AgentLogin:
      type: object
      description: Which login the agent's harness uses.
      required: [source, connected, mine]
      properties:
        source:
          type: string
          enum: [account, secret, sandbox, unsupported]
          description: |
            account: the account login of `user`. secret: an API key secret attached to the agent wins.
            sandbox: whatever is signed in inside the sandbox. unsupported: the harness has no account logins.
        user:
          $ref: "#/components/schemas/User"
          description: Whose account logins the agent uses.
        mine: { type: boolean, description: You are that user. }
        connected: { type: boolean, description: That user has connected a login for the agent's harness. }
        kind: { type: string, description: How that login was connected. }
        status: { type: string, enum: [ok, error] }
        reason: { type: string, description: Why the account login is not used although a user is set. }

    ProviderLoginKind:
      type: object
      required: [id, name, description, inputLabel, multiline]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        command: { type: string, description: What to run on your own computer to get the credential. }
        inputLabel: { type: string }
        multiline: { type: boolean }

    ProviderLogin:
      type: object
      required: [kind, label, status, statusMessage, connectedAt]
      properties:
        kind: { type: string }
        label: { type: string, description: Describes the login without revealing it. }
        status: { type: string, enum: [ok, error] }
        statusMessage: { type: string }
        expiresAt: { type: string, format: date-time }
        connectedAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time }

    ProviderLoginInfo:
      type: object
      required: [provider, name, kinds, agents]
      properties:
        provider: { type: string, description: Harness id. }
        name: { type: string }
        kinds:
          type: array
          items: { $ref: "#/components/schemas/ProviderLoginKind" }
        login: { $ref: "#/components/schemas/ProviderLogin" }
        agents:
          type: array
          description: Agents with this harness that use your logins.
          items: { $ref: "#/components/schemas/LoginAgent" }

    LoginAgent:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }

    ProviderLoginInput:
      type: object
      required: [kind, credential]
      properties:
        kind: { type: string }
        credential: { type: string, minLength: 1, maxLength: 65536, description: "The token, key or file contents. Never returned." }

    AuthMethodInfo:
      type: object
      required: [id, name, description, type]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        type: { type: string, description: '"terminal": run it in the agent terminal (terminal?auth=<id>).' }

    HarnessState:
      type: object
      required: [harness, connected, agentName, agentVersion, loadSession, authMethods]
      properties:
        harness: { type: string }
        connected: { type: boolean }
        agentName: { type: string }
        agentVersion: { type: string }
        loadSession: { type: boolean }
        authMethods:
          type: array
          items: { $ref: "#/components/schemas/AuthMethodInfo" }

    Session:
      type: object
      required: [id, agentId, title, running, createdBy, createdAt, updatedAt]
      properties:
        id: { type: string }
        agentId: { type: string }
        origin:
          type: object
          description: Set when another agent started the session (send_message or ask).
          required: [agentId, agentName, sessionId]
          properties:
            agentId: { type: string }
            agentName: { type: string }
            sessionId: { type: string, description: The other agent's session that sent the messages. }
        title: { type: string }
        running: { type: boolean }
        model:
          $ref: "#/components/schemas/ModelChoice"
          description: The session's own model choice; absent when it uses the agent's default.
        createdBy: { $ref: "#/components/schemas/User" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    SessionEvent:
      type: object
      required: [seq, at, type, data]
      properties:
        seq: { type: integer, format: int64 }
        at: { type: string, format: date-time }
        type:
          type: string
          enum: [prompt, update, permission, permission_resolved, turn_end, error, notice]
          description: |
            prompt: {text, user{id,name}}; update: an ACP SessionUpdate
            (discriminated by "sessionUpdate"); permission: {requestId,
            toolCall, options[{optionId,name,kind}], policy};
            permission_resolved: {requestId, optionId, by}; turn_end:
            {stopReason}; error/notice: {message}.
        userId: { type: string }
        data:
          type: object
          additionalProperties: true

    ShareInput:
      type: object
      required: [email]
      properties:
        email: { type: string, minLength: 1, maxLength: 320, description: The verified email of a user who has signed in before. }

    Share:
      type: object
      required: [user, createdAt]
      properties:
        user: { $ref: "#/components/schemas/User" }
        createdAt: { type: string, format: date-time }

    AccessList:
      type: object
      required: [owner, shares]
      properties:
        owner: { $ref: "#/components/schemas/User" }
        shares:
          type: array
          items: { $ref: "#/components/schemas/Share" }

    AuditEntry:
      type: object
      required: [id, at, user, action, target, details]
      properties:
        id: { type: integer, format: int64 }
        at: { type: string, format: date-time }
        user: { $ref: "#/components/schemas/User" }
        action: { type: string }
        target: { type: string }
        details:
          type: object
          additionalProperties: true

    ExposureAccess:
      type: string
      description: |
        Who may open an exposure: `private` (the owner and users the machine
        is shared with), `authenticated` (anyone signed in to this agenthold)
        or `public` (anyone).
      enum: [private, authenticated, public]

    Exposure:
      type: object
      required: [id, agentId, port, name, access, wakeOnRequest, url, createdBy, createdAt]
      properties:
        id: { type: string }
        agentId: { type: string }
        port: { type: integer, minimum: 1, maximum: 65535 }
        name: { type: string }
        access: { $ref: "#/components/schemas/ExposureAccess" }
        wakeOnRequest:
          type: boolean
          description: |
            Whether visitors who are neither the owner nor a shared user wake a
            sleeping machine (and keep it awake). Owner and shared users always do.
        url: { type: string, description: The full URL of the exposure. }
        createdBy:
          type: string
          description: The id of the user who created it, or `agent:<id>` for the agent itself.
        createdAt: { type: string, format: date-time }

    ExposureList:
      type: object
      required: [enabled, hostSuffix, exposures]
      properties:
        enabled: { type: boolean, description: Whether the server has preview URLs configured. }
        hostSuffix: { type: string }
        exposures:
          type: array
          items: { $ref: "#/components/schemas/Exposure" }

    ExposureInput:
      type: object
      required: [port]
      properties:
        port: { type: integer }
        name:
          type: string
          description: |
            Lowercase letters, digits and hyphens, 1 to 40 characters. Some names
            (www, api, admin, ...) and names starting with xn-- are reserved.
        access: { $ref: "#/components/schemas/ExposureAccess" }
        wakeOnRequest: { type: boolean }

    ExposurePatch:
      type: object
      properties:
        name: { type: string }
        access: { $ref: "#/components/schemas/ExposureAccess" }
        wakeOnRequest: { type: boolean }

    ServiceInput:
      type: object
      required: [command]
      properties:
        command: { type: string, minLength: 1, maxLength: 8192, description: Run with `sh -lc` as the agent account. }
        workdir: { type: string, description: Relative to the home (default the home). }
        env:
          type: object
          additionalProperties: { type: string }
        enabled: { type: boolean, description: Default true. }

    ServiceStatus:
      type: object
      required: [state, restarts]
      properties:
        state: { type: string, enum: [running, backoff, stopped, failed] }
        pid: { type: integer }
        restarts: { type: integer }
        exitCode: { type: integer, description: Exit code of the last run (absent when a signal ended it). }
        signal: { type: string, description: Signal that ended the last run. }
        error: { type: string, description: Why it could not be started (state failed). }
        startedAt: { type: string, format: date-time }

    Service:
      type: object
      required: [name, command, workdir, env, enabled, createdAt, updatedAt]
      properties:
        name: { type: string }
        command: { type: string }
        workdir: { type: string }
        env:
          type: object
          additionalProperties: { type: string }
        enabled: { type: boolean }
        status:
          $ref: "#/components/schemas/ServiceStatus"
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ServiceList:
      type: object
      required: [running, services]
      properties:
        running: { type: boolean, description: Whether the machine is connected (its services can run). }
        error: { type: string, description: Why the live status is missing although the machine runs. }
        services:
          type: array
          items: { $ref: "#/components/schemas/Service" }

    App:
      type: object
      required: [id, name, owner, cpus, memoryMb, idleMinutes, state, stateError, stateChangedAt, needsRebuild, isTemplate, role, links, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        owner: { $ref: "#/components/schemas/User" }
        nodeId: { type: string }
        nodeName: { type: string }
        cpus: { type: number }
        memoryMb: { type: integer, format: int64 }
        idleMinutes: { type: integer, description: 0 means always on (never sleeps for idleness). }
        state: { $ref: "#/components/schemas/SandboxState" }
        stateError: { type: string }
        stateChangedAt: { type: string, format: date-time }
        needsRebuild: { type: boolean }
        isTemplate: { type: boolean, description: "The app is a template: it is never started; clone it (POST /agents/{id}/clone)." }
        role: { $ref: "#/components/schemas/AgentRole" }
        createdByAgent:
          type: object
          description: |
            The agent that created the app with deploy_app and manages it (it may since have
            been deleted). Absent once the owner took the app over.
          required: [id, name]
          properties:
            id: { type: string }
            name: { type: string, description: Empty when the agent was deleted. }
        url: { type: string, description: The app's primary preview URL, if one is exposed. }
        lastActivityAt: { type: string, format: date-time }
        sleepsAt: { type: string, format: date-time }
        links:
          type: object
          description: Where the machine sub-resources of this app are.
          required: [services, exposures, files, terminal, shares, secrets, audit]
          properties:
            services: { type: string }
            exposures: { type: string }
            files: { type: string }
            terminal: { type: string }
            shares: { type: string }
            secrets: { type: string }
            audit: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    AppInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 40, description: "A DNS label: lowercase letters, digits and hyphens, unique among your apps." }
        cpus: { type: number }
        memoryMb: { type: integer, format: int64 }
        idleMinutes: { type: integer, minimum: 0, maximum: 10080, description: Default 0 (always on). }

    AppPatch:
      type: object
      properties:
        isTemplate: { type: boolean, description: Convert to a template (it is stopped first) or back, as for agents. }
        name: { type: string, minLength: 1, maxLength: 40 }
        cpus: { type: number }
        memoryMb: { type: integer, format: int64 }
        idleMinutes: { type: integer, minimum: 0, maximum: 10080 }

    DeployInput:
      type: object
      required: [sourceAgentId, sourceDir, command, port]
      properties:
        sourceAgentId: { type: string, description: The machine to copy from. }
        sourceDir: { type: string, description: Directory in the source machine, relative to its home or absolute. }
        command: { type: string, description: Runs in `~/app/current` with `PORT` set. }
        port: { type: integer, minimum: 1, maximum: 65535 }
        env:
          type: object
          additionalProperties: { type: string }
        access: { $ref: "#/components/schemas/ExposureAccess" }
        exclude:
          type: array
          description: Names (any depth) or relative paths left out. Default [".git"].
          items: { type: string }

    DeployResult:
      type: object
      required: [release, ready, rolledBack, logs]
      properties:
        release: { type: integer }
        ready: { type: boolean, description: The port accepted connections. }
        rolledBack: { type: boolean, description: The new release did not come up and the previous one serves again. }
        logs: { type: string, description: The service's last log lines when it did not come up. }
        url: { type: string }
        exposure: { $ref: "#/components/schemas/Exposure" }
        service: { $ref: "#/components/schemas/ServiceStatus" }

    MCPServerInput:
      type: object
      required: [name, transport]
      properties:
        name: { type: string, description: 'Letters, digits, dashes and underscores.' }
        transport: { type: string, enum: [stdio, http] }
        command: { type: string, description: stdio only; runs inside the sandbox. }
        args:
          type: array
          items: { type: string }
        env:
          type: object
          additionalProperties: { type: string }
          description: 'stdio only. Values may reference secrets as {{secret:NAME}}.'
        url: { type: string, description: http only. }
        headers:
          type: object
          additionalProperties: { type: string }
          description: 'http only. Values may reference secrets as {{secret:NAME}}; the sandbox sees a placeholder and the egress proxy injects the value.'

    MCPServer:
      allOf:
        - $ref: "#/components/schemas/MCPServerInput"
        - type: object
          required: [id, ownerId, scope, secretRefs, createdAt, updatedAt, args, env, headers, command, url]
          properties:
            id: { type: string }
            ownerId: { type: string }
            scope: { type: string, enum: [library, agent], description: 'library: in your library, attachable to your agents. agent: belongs to one agent.' }
            agentId: { type: string }
            secretRefs:
              type: array
              items: { type: string }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }

    SkillInput:
      type: object
      required: [name, description, content]
      properties:
        name: { type: string, description: 'Lowercase letters, digits and dashes.' }
        description: { type: string, description: When the agent should use the skill. }
        content: { type: string, description: The SKILL.md instructions (Markdown). }

    Skill:
      allOf:
        - $ref: "#/components/schemas/SkillInput"
        - type: object
          required: [id, ownerId, createdAt, updatedAt]
          properties:
            id: { type: string }
            ownerId: { type: string }

            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }

    APIToken:
      type: object
      required: [id, name, prefix, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        prefix: { type: string, description: The first characters of the token. }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }

    CreatedAPIToken:
      allOf:
        - $ref: "#/components/schemas/APIToken"
        - type: object
          required: [token]
          properties:
            token: { type: string }

    ScheduleInput:
      type: object
      required: [name, cron, prompt]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        cron: { type: string, description: 'Five fields (minute hour day month weekday) or @hourly, @daily, @weekly.' }
        timezone: { type: string, description: IANA time zone. Default UTC. }
        prompt: { type: string, minLength: 1 }
        enabled: { type: boolean }

    Schedule:
      allOf:
        - $ref: "#/components/schemas/ScheduleInput"
        - type: object
          required: [id, agentId, sessionId, timezone, enabled, createdBy, nextRunAt, lastError, createdAt]
          properties:
            id: { type: string }
            agentId: { type: string }
            sessionId: { type: string }
            createdBy: { $ref: "#/components/schemas/User" }
            nextRunAt: { type: string, format: date-time }
            lastRunAt: { type: string, format: date-time }
            lastError: { type: string }
            createdAt: { type: string, format: date-time }

    WebhookInput:
      type: object
      required: [name, promptTemplate]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        promptTemplate: { type: string, minLength: 1, description: '{{payload}} marks where the delimited request body goes; otherwise it is appended.' }
        signingSecret: { type: string, description: 'Set to require HMAC-SHA256 signatures; "" removes it; omit to keep.' }
        signatureHeader: { type: string, description: Header holding the signature. Default X-Hub-Signature-256. }
        enabled: { type: boolean }

    Webhook:
      type: object
      required: [id, agentId, sessionId, name, promptTemplate, signed, signatureHeader, enabled, createdBy, lastError, createdAt]
      properties:
        id: { type: string }
        agentId: { type: string }
        sessionId: { type: string }
        name: { type: string }
        promptTemplate: { type: string }
        signed: { type: boolean }
        signatureHeader: { type: string }
        enabled: { type: boolean }
        createdBy: { $ref: "#/components/schemas/User" }
        lastDeliveryAt: { type: string, format: date-time }
        lastError: { type: string }
        createdAt: { type: string, format: date-time }

    CreatedWebhook:
      allOf:
        - $ref: "#/components/schemas/Webhook"
        - type: object
          required: [url]
          properties:
            url: { type: string, description: The secret delivery URL. Shown once. }
