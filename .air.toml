# Live reload the native server inside the Lima VM.
root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/agenthold ./cmd/agenthold"
entrypoint = ["./tmp/agenthold"]
include_ext = ["go", "yaml", "sql"]
exclude_dir = ["web", "tmp", "bin", "build", ".git", "deploy"]
delay = 200
stop_on_error = true
poll = true
poll_interval = 500

[log]
time = true
