name: docs

# Builds the documentation site (docs/, Nimbus on Astro) on every change to it
# and publishes it to Cloudflare at agenthold.dev when main changes. Setup: docs/src/content/docs/docs-site.md.
on:
  push:
    branches: [main]
    paths: ["docs/**", "api/openapi.yaml", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["docs/**", "api/openapi.yaml", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: docs/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run lint:docs
      - run: pnpm run typecheck
      - run: pnpm run build
      - uses: actions/upload-artifact@v7
        with:
          name: docs-site
          path: docs/dist
          retention-days: 7

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: docs
    concurrency:
      group: docs-deploy
      cancel-in-progress: false
    env:
      # Deploys only once the Cloudflare credentials exist, so the workflow is
      # green before the one-time setup is done.
      HAVE_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: docs/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml
      - name: Not configured
        if: env.HAVE_CLOUDFLARE != 'true'
        run: echo "::notice::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not set; skipping the docs deploy"
      - name: Deploy to Cloudflare
        if: env.HAVE_CLOUDFLARE == 'true'
        working-directory: docs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm install --frozen-lockfile
          pnpm run deploy
