name: ci

on:
  push:
    branches: [main]
    # The documentation site has its own workflow (docs.yml); a docs change
    # should neither run the whole suite nor redeploy the app.
    paths-ignore: ["docs/**", "**.md"]
  pull_request:
    paths-ignore: ["docs/**", "**.md"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make test-go
      - run: make build-go

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make test-docker

  go-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: ./...

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: make lint-web test-web web

  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: make generate
      - name: Generated code is up to date
        run: git diff --exit-code

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  base-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: images/base
          push: false
          cache-from: type=gha,scope=base-image
          cache-to: type=gha,mode=max,scope=base-image

  # The end-to-end checks run as parallel shards, each on its own stack, so the
  # slowest single check (sleep, ~3 minutes by nature) sets the wall time.
  e2e:
    name: e2e (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: sleep
            checks: sleep
          - shard: api
            checks: sessions api agents
          - shard: ui
            checks: ""
    env:
      E2E_IMAGE: debian:trixie-slim
      E2E_USER: root
      SKIP_BASE: "1"
      SKIP_REAL_MODEL: "1"
      # Test the production build of the UI (embedded in the server), not Vite.
      AGENTHOLD_DEV_PROXY: "off"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Build the UI
        run: make web
      - uses: docker/setup-buildx-action@v4
      # The server image only holds the Go toolchain and air; cache it.
      - uses: docker/build-push-action@v7
        with:
          context: deploy
          file: deploy/Dockerfile.dev
          load: true
          tags: agenthold-dev-server
          cache-from: type=gha,scope=dev-server
          cache-to: type=gha,mode=max,scope=dev-server
      - name: Start the dev stack
        run: |
          docker pull "$E2E_IMAGE"
          # The UI is served from the embedded build, so Vite (the web service) is not needed.
          docker compose -f deploy/docker-compose.dev.yml up -d --no-build --no-deps server keycloak
          for i in $(seq 1 120); do
            curl -sf localhost:8081/realms/agenthold/.well-known/openid-configuration >/dev/null &&
            curl -sf localhost:8080/api/v1/auth/providers | grep -q keycloak && break
            sleep 3
          done
          sleep 5
      - name: End-to-end checks
        if: matrix.checks != ''
        run: scripts/e2e/run-all.sh ${{ matrix.checks }}
      - name: UI tests (Playwright)
        if: matrix.shard == 'ui'
        working-directory: web
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm e2e
      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.shard }}
          path: web/test-results
          if-no-files-found: ignore
          retention-days: 7
      - name: Logs
        if: failure()
        run: docker compose -f deploy/docker-compose.dev.yml logs --tail 200 server keycloak
