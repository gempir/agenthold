openapi: 3.0.3
info:
  title: agenthold API
  version: 0.1.0
  description: |
    REST API of the agenthold server. Browser clients authenticate with the
    session cookie set by the login flow. All paths are under /api/v1.
servers:
  - url: /api/v1
tags:
  - name: auth-flow
    description: Browser redirects of the login flow. Not JSON endpoints.
  - name: auth
  - name: workspaces
  - name: invites
  - name: agents
  - name: files
  - name: sessions
  - name: sharing
  - name: tokens
  - name: triggers
    description: Schedules and webhooks.
  - name: tools
    description: MCP servers and skills.
  - name: secrets
  - name: egress
  - name: streams
    description: WebSocket endpoints. Not generated as JSON handlers.
  - name: meta

paths:
  /version:
    get:
      operationId: getVersion
      tags: [meta]
      security: []
      responses:
        "200":
          description: Build information.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Version" }

  /sandbox/limits:
    get:
      operationId: getSandboxLimits
      tags: [agents]
      responses:
        "200":
          description: Defaults and limits for agent sandboxes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SandboxLimits" }

  /auth/providers:
    get:
      operationId: listAuthProviders
      tags: [auth]
      security: []
      responses:
        "200":
          description: Configured sign-in providers.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AuthProvider" }

  /auth/login/{provider}:
    get:
      operationId: login
      tags: [auth-flow]
      security: []
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string } }
        - name: redirect
          in: query
          description: Local path to return to after login. Defaults to "/".
          schema: { type: string }
      responses:
        "302": { description: Redirect to the identity provider. }
        "404": { $ref: "#/components/responses/Error" }

  /auth/callback/{provider}:
    get:
      operationId: loginCallback
      tags: [auth-flow]
      security: []
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string } }
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
      responses:
        "302": { description: Session cookie set, redirect into the app. }
        "400": { $ref: "#/components/responses/Error" }

  /auth/logout:
    post:
      operationId: logout
      tags: [auth-flow]
      responses:
        "204": { description: Session ended. }

  /me:
    get:
      operationId: getMe
      tags: [auth]
      responses:
        "200":
          description: The signed-in user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Error" }

  /workspaces:
    get:
      operationId: listWorkspaces
      tags: [workspaces]
      responses:
        "200":
          description: Workspaces the user is a member of.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Workspace" }
    post:
      operationId: createWorkspace
      tags: [workspaces]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkspaceInput" }
      responses:
        "201":
          description: Created. The caller becomes its owner.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        "400": { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: getWorkspace
      tags: [workspaces]
      responses:
        "200":
          description: The workspace.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateWorkspace
      tags: [workspaces]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkspaceInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteWorkspace
      tags: [workspaces]
      responses:
        "204": { description: Deleted. }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/members:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: listMembers
      tags: [workspaces]
      responses:
        "200":
          description: Members of the workspace.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Member" }
        "404": { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/members/{userId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - { name: userId, in: path, required: true, schema: { type: string } }
    patch:
      operationId: updateMember
      tags: [workspaces]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { $ref: "#/components/schemas/WorkspaceRole" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      operationId: removeMember
      tags: [workspaces]
      description: Remove a member. Members may remove themselves (leave).
      responses:
        "204": { description: Removed. }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/invites:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: listInvites
      tags: [invites]
      responses:
        "200":
          description: Pending invites.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Invite" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: createInvite
      tags: [invites]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InviteInput" }
      responses:
        "201":
          description: Created. The token is only returned once.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedInvite" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/invites/{inviteId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - { name: inviteId, in: path, required: true, schema: { type: string } }
    delete:
      operationId: revokeInvite
      tags: [invites]
      responses:
        "204": { description: Revoked. }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /invites/{token}:
    parameters:
      - { name: token, in: path, required: true, schema: { type: string } }
    get:
      operationId: getInvite
      tags: [invites]
      responses:
        "200":
          description: What accepting this invite would do.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitePreview" }
        "404": { $ref: "#/components/responses/Error" }

  /invites/{token}/accept:
    parameters:
      - { name: token, in: path, required: true, schema: { type: string } }
    post:
      operationId: acceptInvite
      tags: [invites]
      responses:
        "200":
          description: Joined. Returns the workspace.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/agents:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: listAgents
      tags: [agents]
      description: Agents in the workspace that the caller can see.
      responses:
        "200":
          description: Agents.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Agent" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: createAgent
      tags: [agents]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentInput" }
      responses:
        "201":
          description: Created. The sandbox is provisioned in the background.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agent" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /agents/{agentId}:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    get:
      operationId: getAgent
      tags: [agents]
      responses:
        "200":
          description: The agent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agent" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateAgent
      tags: [agents]
      description: Image and resource changes take effect after a rebuild (see `needsRebuild`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentPatch" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agent" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteAgent
      tags: [agents]
      description: Destroys the sandbox and its home volume, then the agent. Runs in the background.
      responses:
        "202": { description: Destruction started. }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /agents/{agentId}/start:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    post:
      operationId: startAgent
      tags: [agents]
      responses:
        "202":
          description: Starting.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agent" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /agents/{agentId}/stop:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    post:
      operationId: stopAgent
      tags: [agents]
      responses:
        "202":
          description: Stopping. The home volume is kept.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agent" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /agents/{agentId}/rebuild:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    post:
      operationId: rebuildAgent
      tags: [agents]
      responses:
        "202":
          description: Rebuilding from the current image and resources; the home volume is kept.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agent" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /agents/{agentId}/terminal:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    get:
      operationId: openTerminal
      tags: [streams]
      description: |
        WebSocket upgrade to an interactive shell in the sandbox (operator role).
        A sleeping agent is woken. Binary messages carry terminal input and
        output. Text messages are JSON: the client sends
        `{"type":"resize","cols":N,"rows":N}`; the server sends
        `{"type":"status","message":"..."}` while waking,
        `{"type":"exit","code":N}` and `{"type":"error","message":"..."}`.
      parameters:
        - { name: cols, in: query, schema: { type: integer } }
        - { name: rows, in: query, schema: { type: integer } }
        - name: auth
          in: query
          description: Run this harness login method (agent admin) instead of a shell.
          schema: { type: string }
      responses:
        "101": { description: Switching to WebSocket. }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /agents/{agentId}/files:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    get:
      operationId: listFiles
      tags: [files]
      description: List a directory. Relative paths are relative to /home/agent. The agent must be running.
      parameters:
        - { name: path, in: query, schema: { type: string } }
      responses:
        "200":
          description: Directory listing.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DirListing" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteFile
      tags: [files]
      parameters:
        - { name: path, in: query, required: true, schema: { type: string } }
        - { name: recursive, in: query, schema: { type: boolean } }
      responses:
        "204": { description: Deleted. }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /agents/{agentId}/files/content:
    parameters:
      - $ref: "#/components/parameters/AgentId"
      - { name: path, in: query, required: true, schema: { type: string } }
    get:
      operationId: downloadFile
      tags: [files]
      responses:
        "200":
          description: File content.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    put:
      operationId: uploadFile
      tags: [files]
      description: Create or replace a file (operator role). Missing parent directories are created.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "204": { description: Written. }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /agents/{agentId}/files/mkdir:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    post:
      operationId: makeDirectory
      tags: [files]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path: { type: string }
      responses:
        "204": { description: Created. }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /egress/ca.pem:
    get:
      operationId: getEgressCA
      tags: [egress]
      description: The installation's egress CA certificate (trusted inside sandboxes).
      responses:
        "200":
          description: PEM certificate.
          content:
            application/x-pem-file:
              schema: { type: string }

  /secrets/presets:
    get:
      operationId: listSecretPresets
      tags: [secrets]
      responses:
        "200":
          description: Injection rule presets for common providers.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SecretPreset" }

  /workspaces/{workspaceId}/secrets:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: listSecrets
      tags: [secrets]
      description: Secrets the caller can attach (their own; all of them for workspace admins). Values are never returned.
      responses:
        "200":
          description: Secrets.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Secret" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: createSecret
      tags: [secrets]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SecretInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Secret" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /secrets/{secretId}:
    parameters:
      - { name: secretId, in: path, required: true, schema: { type: string } }
    patch:
      operationId: updateSecret
      tags: [secrets]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SecretPatch" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Secret" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteSecret
      tags: [secrets]
      responses:
        "204": { description: Deleted and detached from all agents. }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /agents/{agentId}/secrets:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    get:
      operationId: listAgentSecrets
      tags: [secrets]
      responses:
        "200":
          description: Secrets attached to the agent.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AttachedSecret" }
        "404": { $ref: "#/components/responses/Error" }

  /agents/{agentId}/secrets/{secretId}:
    parameters:
      - $ref: "#/components/parameters/AgentId"
      - { name: secretId, in: path, required: true, schema: { type: string } }
    put:
      operationId: attachSecret
      tags: [secrets]
      description: |
        Attach a secret (agent admin; the secret's owner or a workspace admin).
        Injection works immediately; a changed environment variable needs a rebuild.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                envVar: { type: string, description: Variable that holds the placeholder in the sandbox. }
      responses:
        "200":
          description: Attached.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttachedSecret" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: detachSecret
      tags: [secrets]
      responses:
        "204": { description: Detached. }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /agents/{agentId}/network-policy:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    get:
      operationId: getNetworkPolicy
      tags: [egress]
      responses:
        "200":
          description: The agent's network policy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NetworkPolicy" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      operationId: setNetworkPolicy
      tags: [egress]
      description: Takes effect within seconds, without a restart.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NetworkPolicy" }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NetworkPolicy" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /agents/{agentId}/egress-log:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    get:
      operationId: listEgressLog
      tags: [egress]
      parameters:
        - { name: before, in: query, description: Return entries older than this id., schema: { type: integer, format: int64 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500 } }
      responses:
        "200":
          description: Newest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EgressEvent" }
        "404": { $ref: "#/components/responses/Error" }

  /harnesses:
    get:
      operationId: listHarnesses
      tags: [sessions]
      responses:
        "200":
          description: Available harnesses.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/HarnessType" }

  /agents/{agentId}/harness:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    get:
      operationId: getHarness
      tags: [sessions]
      description: The agent's harness. With connect=true the harness is started (waking the agent) to discover login methods.
      parameters:
        - { name: connect, in: query, schema: { type: boolean } }
      responses:
        "200":
          description: Harness state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HarnessState" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /agents/{agentId}/sessions:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    get:
      operationId: listSessions
      tags: [sessions]
      responses:
        "200":
          description: Sessions, most recently active first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Session" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: createSession
      tags: [sessions]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, maxLength: 200 }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /sessions/{sessionId}:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      operationId: getSession
      tags: [sessions]
      responses:
        "200":
          description: The session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: renameSession
      tags: [sessions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string, minLength: 1, maxLength: 200 }
      responses:
        "200":
          description: Renamed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteSession
      tags: [sessions]
      responses:
        "204": { description: Deleted. }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /sessions/{sessionId}/prompt:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      operationId: promptSession
      tags: [sessions]
      description: Start a turn (operator role). Wakes the agent if it sleeps. Progress arrives on the event stream.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, minLength: 1 }
      responses:
        "202": { description: The turn started. }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /sessions/{sessionId}/cancel:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      operationId: cancelSession
      tags: [sessions]
      responses:
        "202": { description: Cancellation requested. }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /sessions/{sessionId}/permissions/{requestId}:
    parameters:
      - $ref: "#/components/parameters/SessionId"
      - { name: requestId, in: path, required: true, schema: { type: string } }
    post:
      operationId: answerPermission
      tags: [sessions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [optionId]
              properties:
                optionId: { type: string }
      responses:
        "204": { description: Answered. }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /sessions/{sessionId}/events:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      operationId: listSessionEvents
      tags: [sessions]
      description: Stored events after a cursor. For live updates use the stream.
      parameters:
        - { name: after, in: query, schema: { type: integer, format: int64 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 5000 } }
      responses:
        "200":
          description: Events in order.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SessionEvent" }
        "404": { $ref: "#/components/responses/Error" }

  /sessions/{sessionId}/stream:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      operationId: streamSession
      tags: [streams]
      description: |
        WebSocket. The server sends every event after `after` as a JSON text
        message (a SessionEvent), then live events as they happen. After a
        reconnect, pass the last seq received to continue without gaps.
        `{"type":"status","running":bool}` messages report whether a turn runs;
        `{"type":"presence","viewers":[{id,name,avatarUrl,role}]}` lists who is watching.
      parameters:
        - { name: after, in: query, schema: { type: integer, format: int64 } }
      responses:
        "101": { description: Switching to WebSocket. }
        "404": { $ref: "#/components/responses/Error" }

  /agents/{agentId}/grants:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    get:
      operationId: listGrants
      tags: [sharing]
      description: Who has access to the agent, including implicit access (owner, workspace owners and admins).
      responses:
        "200":
          description: Access list.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccessList" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: setGrant
      tags: [sharing]
      description: Grant a role to a workspace member or to the whole workspace (agent admin). Replaces an existing grant for the same subject.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GrantInput" }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Grant" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /agents/{agentId}/grants/{grantId}:
    parameters:
      - $ref: "#/components/parameters/AgentId"
      - { name: grantId, in: path, required: true, schema: { type: string } }
    delete:
      operationId: deleteGrant
      tags: [sharing]
      responses:
        "204": { description: Revoked. }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /agents/{agentId}/audit:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    get:
      operationId: listAgentAudit
      tags: [sharing]
      description: Who did what to this agent (agent admin). Newest first.
      parameters:
        - { name: before, in: query, schema: { type: integer, format: int64 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500 } }
      responses:
        "200":
          description: Audit entries.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AuditEntry" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/mcp-servers:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: listWorkspaceMCPServers
      tags: [tools]
      responses:
        "200":
          description: Workspace-level MCP servers (attachable to agents).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MCPServer" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: createWorkspaceMCPServer
      tags: [tools]
      description: Workspace admins only.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MCPServerInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MCPServer" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /agents/{agentId}/mcp-servers:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    get:
      operationId: listAgentMCPServers
      tags: [tools]
      description: The agent's own servers and attached workspace servers.
      responses:
        "200":
          description: MCP servers used by the agent.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MCPServer" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: createAgentMCPServer
      tags: [tools]
      description: A server only this agent uses (agent admin).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MCPServerInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MCPServer" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /agents/{agentId}/mcp-servers/{serverId}:
    parameters:
      - $ref: "#/components/parameters/AgentId"
      - { name: serverId, in: path, required: true, schema: { type: string } }
    put:
      operationId: attachMCPServer
      tags: [tools]
      description: Attach a workspace server (agent admin). Takes effect in the next session.
      responses:
        "204": { description: Attached. }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: detachMCPServer
      tags: [tools]
      description: Detach a workspace server, or delete one of the agent's own servers.
      responses:
        "204": { description: Detached. }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /mcp-servers/{serverId}:
    parameters:
      - { name: serverId, in: path, required: true, schema: { type: string } }
    put:
      operationId: updateMCPServer
      tags: [tools]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MCPServerInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MCPServer" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteMCPServer
      tags: [tools]
      responses:
        "204": { description: Deleted (and detached everywhere). }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /workspaces/{workspaceId}/skills:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    get:
      operationId: listSkills
      tags: [tools]
      responses:
        "200":
          description: The workspace skills library.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Skill" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: createSkill
      tags: [tools]
      description: Workspace admins only.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SkillInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Skill" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /skills/{skillId}:
    parameters:
      - { name: skillId, in: path, required: true, schema: { type: string } }
    put:
      operationId: updateSkill
      tags: [tools]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SkillInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Skill" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteSkill
      tags: [tools]
      responses:
        "204": { description: Deleted. }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /agents/{agentId}/skills:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    get:
      operationId: listAgentSkills
      tags: [tools]
      responses:
        "200":
          description: Skills attached to the agent.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Skill" }
        "404": { $ref: "#/components/responses/Error" }

  /agents/{agentId}/skills/{skillId}:
    parameters:
      - $ref: "#/components/parameters/AgentId"
      - { name: skillId, in: path, required: true, schema: { type: string } }
    put:
      operationId: attachSkill
      tags: [tools]
      description: Attach a skill (agent admin). It is written into the sandbox for the next session.
      responses:
        "204": { description: Attached. }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: detachSkill
      tags: [tools]
      responses:
        "204": { description: Detached; removed from the sandbox in the next session. }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /me/tokens:
    get:
      operationId: listTokens
      tags: [tokens]
      responses:
        "200":
          description: Your personal access tokens (without their values).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/APIToken" }
    post:
      operationId: createToken
      tags: [tokens]
      description: |
        Create a personal access token. It acts as you, with your permissions.
        Send it as `Authorization: Bearer <token>`. The token is shown once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                expiresInDays: { type: integer, minimum: 1, maximum: 3650 }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedAPIToken" }
        "400": { $ref: "#/components/responses/Error" }

  /me/tokens/{tokenId}:
    parameters:
      - { name: tokenId, in: path, required: true, schema: { type: string } }
    delete:
      operationId: deleteToken
      tags: [tokens]
      responses:
        "204": { description: Revoked. }
        "404": { $ref: "#/components/responses/Error" }

  /agents/{agentId}/schedules:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    get:
      operationId: listSchedules
      tags: [triggers]
      responses:
        "200":
          description: The agent's schedules.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Schedule" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: createSchedule
      tags: [triggers]
      description: Agent admin. The schedule prompts its own session as you.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScheduleInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Schedule" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /schedules/{scheduleId}:
    parameters:
      - { name: scheduleId, in: path, required: true, schema: { type: string } }
    put:
      operationId: updateSchedule
      tags: [triggers]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScheduleInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Schedule" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteSchedule
      tags: [triggers]
      responses:
        "204": { description: Deleted. }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /schedules/{scheduleId}/run:
    parameters:
      - { name: scheduleId, in: path, required: true, schema: { type: string } }
    post:
      operationId: runSchedule
      tags: [triggers]
      description: Run now (operator).
      responses:
        "202": { description: The turn started. }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /agents/{agentId}/webhooks:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    get:
      operationId: listWebhooks
      tags: [triggers]
      responses:
        "200":
          description: The agent's webhooks.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Webhook" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: createWebhook
      tags: [triggers]
      description: Agent admin. The URL is shown once; deliveries prompt the webhook's session as you.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebhookInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedWebhook" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /webhooks/{webhookId}:
    parameters:
      - { name: webhookId, in: path, required: true, schema: { type: string } }
    put:
      operationId: updateWebhook
      tags: [triggers]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebhookInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Webhook" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteWebhook
      tags: [triggers]
      responses:
        "204": { description: Deleted. }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /hooks/{token}:
    parameters:
      - { name: token, in: path, required: true, schema: { type: string } }
    post:
      operationId: deliverWebhook
      tags: [auth-flow]
      security: []
      description: |
        Inbound webhook (no session or token: the URL is the secret). The
        request body (up to 256 KiB) becomes part of the prompt, clearly marked
        as untrusted. If the webhook has a signing secret, the signature
        header must hold the HMAC-SHA256 of the body ("sha256=<hex>" or hex).
      requestBody:
        content:
          "*/*":
            schema: { type: string, format: binary }
      responses:
        "202": { description: The turn started. }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }

security:
  - session: []
  - token: []

components:
  securitySchemes:
    token:
      type: http
      scheme: bearer
      description: A personal access token (POST /me/tokens).
    session:
      type: apiKey
      in: cookie
      name: agenthold_session

  parameters:
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string }
    AgentId:
      name: agentId
      in: path
      required: true
      schema: { type: string }
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema: { type: string }

  responses:
    Error:
      description: Error.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }

    Version:
      type: object
      required: [version, commit]
      properties:
        version: { type: string }
        commit: { type: string }

    AuthProvider:
      type: object
      required: [id, name, type]
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string, enum: [oidc, github] }

    User:
      type: object
      required: [id, email, name, avatarUrl]
      properties:
        id: { type: string }
        email: { type: string }
        name: { type: string }
        avatarUrl: { type: string }

    Me:
      type: object
      required: [user, personalWorkspaceId]
      properties:
        user: { $ref: "#/components/schemas/User" }
        personalWorkspaceId: { type: string }

    WorkspaceRole:
      type: string
      enum: [owner, admin, member]

    Workspace:
      type: object
      required: [id, name, personal, role, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        personal: { type: boolean }
        role:
          $ref: "#/components/schemas/WorkspaceRole"
        createdAt: { type: string, format: date-time }

    WorkspaceInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }

    Member:
      type: object
      required: [user, role, joinedAt]
      properties:
        user: { $ref: "#/components/schemas/User" }
        role: { $ref: "#/components/schemas/WorkspaceRole" }
        joinedAt: { type: string, format: date-time }

    InviteInput:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [admin, member]
        email:
          type: string
          description: If set, only a user with this email can accept.
        expiresInHours:
          type: integer
          minimum: 1
          maximum: 720
          description: Defaults to 168 (7 days).

    Invite:
      type: object
      required: [id, role, email, createdAt, expiresAt, createdBy]
      properties:
        id: { type: string }
        role: { type: string, enum: [admin, member] }
        email: { type: string }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }

    CreatedInvite:
      allOf:
        - $ref: "#/components/schemas/Invite"
        - type: object
          required: [token, url]
          properties:
            token: { type: string }
            url: { type: string, description: Link to share with the invitee. }

    InvitePreview:
      type: object
      required: [workspaceId, workspaceName, role, invitedBy, expiresAt, alreadyMember]
      properties:
        workspaceId: { type: string }
        workspaceName: { type: string }
        role: { type: string, enum: [admin, member] }
        invitedBy: { type: string }
        expiresAt: { type: string, format: date-time }
        alreadyMember: { type: boolean }

    SandboxState:
      type: string
      enum: [creating, starting, running, stopping, sleeping, rebuilding, destroying, error]

    AgentRole:
      type: string
      enum: [viewer, operator, admin]

    Agent:
      type: object
      required: [id, workspaceId, name, owner, image, harness, model, permissionPolicy, credentialsInSandbox, cpus, memoryMb, idleMinutes, state, stateError, stateChangedAt, needsRebuild, role, createdAt, updatedAt]
      properties:
        id: { type: string }
        workspaceId: { type: string }
        name: { type: string }
        owner: { $ref: "#/components/schemas/User" }
        image: { type: string }
        harness: { type: string }
        cpus: { type: number }
        memoryMb: { type: integer, format: int64 }
        idleMinutes: { type: integer }
        state: { $ref: "#/components/schemas/SandboxState" }
        stateError: { type: string }
        stateChangedAt: { type: string, format: date-time }
        needsRebuild:
          type: boolean
          description: Image or resources changed since the sandbox was built.
        model: { type: string }
        permissionPolicy: { type: string, enum: [auto-approve, ask] }
        credentialsInSandbox:
          type: boolean
          description: A harness login was completed inside the sandbox; the agent can read its own credentials.
        lastActivityAt:
          type: string
          format: date-time
          description: Last activity while running (prompts, terminals, files, CPU use in the sandbox).
        sleepsAt:
          type: string
          format: date-time
          description: When the agent goes to sleep if nothing happens. Absent while busy or not running.
        role:
          $ref: "#/components/schemas/AgentRole"
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    AgentInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        image: { type: string, description: OCI image. Defaults to the server's default image. }
        cpus: { type: number }
        memoryMb: { type: integer, format: int64 }
        idleMinutes: { type: integer, minimum: 1, maximum: 10080 }
        harness: { type: string, description: Harness id (see /harnesses). Default claude-code. }
        model: { type: string }
        permissionPolicy: { type: string, enum: [auto-approve, ask] }

    AgentPatch:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        image: { type: string }
        cpus: { type: number }
        memoryMb: { type: integer, format: int64 }
        idleMinutes: { type: integer, minimum: 1, maximum: 10080 }
        harness: { type: string, description: Harness id (see /harnesses). Default claude-code. }
        model: { type: string }
        permissionPolicy: { type: string, enum: [auto-approve, ask] }

    SandboxLimits:
      type: object
      required: [defaultImage, defaultCpus, defaultMemoryMb, maxCpus, maxMemoryMb, driver]
      properties:
        driver: { type: string }
        defaultImage: { type: string }
        defaultCpus: { type: number }
        defaultMemoryMb: { type: integer, format: int64 }
        maxCpus: { type: number }
        maxMemoryMb: { type: integer, format: int64 }

    FileEntry:
      type: object
      required: [name, size, mode, isDir, isLink, modTime]
      properties:
        name: { type: string }
        size: { type: integer, format: int64 }
        mode: { type: string }
        isDir: { type: boolean }
        isLink: { type: boolean }
        modTime: { type: string, format: date-time }

    DirListing:
      type: object
      required: [path, entries]
      properties:
        path: { type: string, description: Absolute path of the directory. }
        entries:
          type: array
          items: { $ref: "#/components/schemas/FileEntry" }

    SecretRule:
      type: object
      required: [hosts, header, template]
      properties:
        hosts:
          type: array
          items: { type: string }
          description: Exact host names or "*.example.com".
        header: { type: string }
        template: { type: string, description: 'Header value; {{.Value}} is the secret. Function: base64.' }

    SecretPreset:
      type: object
      required: [id, name, rule, envVar, description]
      properties:
        id: { type: string }
        name: { type: string }
        rule: { $ref: "#/components/schemas/SecretRule" }
        envVar: { type: string }
        description: { type: string }

    Secret:
      type: object
      required: [id, workspaceId, name, rule, placeholder, owner, canManage, createdAt, updatedAt]
      properties:
        id: { type: string }
        workspaceId: { type: string }
        name: { type: string }
        rule: { $ref: "#/components/schemas/SecretRule" }
        placeholder: { type: string, description: What sandboxes see instead of the value. }
        owner: { $ref: "#/components/schemas/User" }
        canManage: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    SecretInput:
      type: object
      required: [name, value]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        value: { type: string, minLength: 1 }
        preset: { type: string, description: Use a preset's rule. }
        rule: { $ref: "#/components/schemas/SecretRule" }

    SecretPatch:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        value: { type: string, minLength: 1 }
        rule: { $ref: "#/components/schemas/SecretRule" }

    AttachedSecret:
      type: object
      required: [secret, envVar]
      properties:
        secret: { $ref: "#/components/schemas/Secret" }
        envVar: { type: string }

    NetworkPolicy:
      type: object
      required: [mode, allow]
      properties:
        mode: { type: string, enum: [open, allowlist] }
        allow:
          type: array
          items: { type: string }
          description: 'Entries like "github.com", "*.npmjs.org", "github.com:22", "host:*", "1.2.3.0/24:443". Without a port: 80 and 443.'

    EgressEvent:
      type: object
      required: [id, at, kind, host, ip, port, method, path, status, allowed, reason, injected, bytesUp, bytesDown, durationMs]
      properties:
        id: { type: integer, format: int64 }
        at: { type: string, format: date-time }
        kind: { type: string, enum: [https, http, tls, tcp, dns] }
        host: { type: string }
        ip: { type: string }
        port: { type: integer }
        method: { type: string }
        path: { type: string }
        status: { type: integer }
        allowed: { type: boolean }
        reason: { type: string }
        injected: { type: boolean }
        bytesUp: { type: integer, format: int64 }
        bytesDown: { type: integer, format: int64 }
        durationMs: { type: integer, format: int64 }

    HarnessType:
      type: object
      required: [id, name, default, secretPresets, installHint]
      properties:
        id: { type: string }
        default: { type: boolean, description: Used when an agent does not name a harness. }
        name: { type: string }
        secretPresets:
          type: array
          items: { type: string }
        installHint: { type: string }

    AuthMethodInfo:
      type: object
      required: [id, name, description, type]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        type: { type: string, description: '"terminal": run it in the agent terminal (terminal?auth=<id>).' }

    HarnessState:
      type: object
      required: [harness, connected, agentName, agentVersion, loadSession, authMethods]
      properties:
        harness: { type: string }
        connected: { type: boolean }
        agentName: { type: string }
        agentVersion: { type: string }
        loadSession: { type: boolean }
        authMethods:
          type: array
          items: { $ref: "#/components/schemas/AuthMethodInfo" }

    Session:
      type: object
      required: [id, agentId, title, running, createdBy, createdAt, updatedAt]
      properties:
        id: { type: string }
        agentId: { type: string }
        title: { type: string }
        running: { type: boolean }
        createdBy: { $ref: "#/components/schemas/User" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    SessionEvent:
      type: object
      required: [seq, at, type, data]
      properties:
        seq: { type: integer, format: int64 }
        at: { type: string, format: date-time }
        type:
          type: string
          enum: [prompt, update, permission, permission_resolved, turn_end, error, notice]
          description: |
            prompt: {text, user{id,name}}; update: an ACP SessionUpdate
            (discriminated by "sessionUpdate"); permission: {requestId,
            toolCall, options[{optionId,name,kind}], policy};
            permission_resolved: {requestId, optionId, by}; turn_end:
            {stopReason}; error/notice: {message}.
        userId: { type: string }
        data:
          type: object
          additionalProperties: true

    GrantInput:
      type: object
      required: [subjectType, role]
      properties:
        subjectType: { type: string, enum: [user, workspace] }
        userId: { type: string, description: Required for subjectType user; must be a workspace member. }
        role: { $ref: "#/components/schemas/AgentRole" }

    Grant:
      type: object
      required: [id, subjectType, role, createdAt]
      properties:
        id: { type: string }
        subjectType: { type: string, enum: [user, workspace] }
        user: { $ref: "#/components/schemas/User" }
        role: { $ref: "#/components/schemas/AgentRole" }
        createdAt: { type: string, format: date-time }

    AccessEntry:
      type: object
      required: [user, role, via]
      properties:
        user: { $ref: "#/components/schemas/User" }
        role: { $ref: "#/components/schemas/AgentRole" }
        via:
          type: string
          enum: [owner, workspace_admin, grant, workspace_grant]

    AccessList:
      type: object
      required: [grants, effective]
      properties:
        grants:
          type: array
          items: { $ref: "#/components/schemas/Grant" }
        effective:
          type: array
          description: Every workspace member with access and their effective role.
          items: { $ref: "#/components/schemas/AccessEntry" }

    AuditEntry:
      type: object
      required: [id, at, user, action, target, details]
      properties:
        id: { type: integer, format: int64 }
        at: { type: string, format: date-time }
        user: { $ref: "#/components/schemas/User" }
        action: { type: string }
        target: { type: string }
        details:
          type: object
          additionalProperties: true

    MCPServerInput:
      type: object
      required: [name, transport]
      properties:
        name: { type: string, description: 'Letters, digits, dashes and underscores.' }
        transport: { type: string, enum: [stdio, http] }
        command: { type: string, description: stdio only; runs inside the sandbox. }
        args:
          type: array
          items: { type: string }
        env:
          type: object
          additionalProperties: { type: string }
          description: 'stdio only. Values may reference secrets as {{secret:NAME}}.'
        url: { type: string, description: http only. }
        headers:
          type: object
          additionalProperties: { type: string }
          description: 'http only. Values may reference secrets as {{secret:NAME}}; the sandbox sees a placeholder and the egress proxy injects the value.'

    MCPServer:
      allOf:
        - $ref: "#/components/schemas/MCPServerInput"
        - type: object
          required: [id, workspaceId, scope, secretRefs, createdAt, updatedAt, args, env, headers, command, url]
          properties:
            id: { type: string }
            workspaceId: { type: string }
            scope: { type: string, enum: [workspace, agent] }
            agentId: { type: string }
            secretRefs:
              type: array
              items: { type: string }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }

    SkillInput:
      type: object
      required: [name, description, content]
      properties:
        name: { type: string, description: 'Lowercase letters, digits and dashes.' }
        description: { type: string, description: When the agent should use the skill. }
        content: { type: string, description: The SKILL.md instructions (Markdown). }

    Skill:
      allOf:
        - $ref: "#/components/schemas/SkillInput"
        - type: object
          required: [id, workspaceId, createdAt, updatedAt]
          properties:
            id: { type: string }
            workspaceId: { type: string }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }

    APIToken:
      type: object
      required: [id, name, prefix, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        prefix: { type: string, description: The first characters of the token. }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }

    CreatedAPIToken:
      allOf:
        - $ref: "#/components/schemas/APIToken"
        - type: object
          required: [token]
          properties:
            token: { type: string }

    ScheduleInput:
      type: object
      required: [name, cron, prompt]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        cron: { type: string, description: 'Five fields (minute hour day month weekday) or @hourly, @daily, @weekly.' }
        timezone: { type: string, description: IANA time zone. Default UTC. }
        prompt: { type: string, minLength: 1 }
        enabled: { type: boolean }

    Schedule:
      allOf:
        - $ref: "#/components/schemas/ScheduleInput"
        - type: object
          required: [id, agentId, sessionId, timezone, enabled, createdBy, nextRunAt, lastError, createdAt]
          properties:
            id: { type: string }
            agentId: { type: string }
            sessionId: { type: string }
            createdBy: { $ref: "#/components/schemas/User" }
            nextRunAt: { type: string, format: date-time }
            lastRunAt: { type: string, format: date-time }
            lastError: { type: string }
            createdAt: { type: string, format: date-time }

    WebhookInput:
      type: object
      required: [name, promptTemplate]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        promptTemplate: { type: string, minLength: 1, description: '{{payload}} marks where the delimited request body goes; otherwise it is appended.' }
        signingSecret: { type: string, description: 'Set to require HMAC-SHA256 signatures; "" removes it; omit to keep.' }
        signatureHeader: { type: string, description: Header holding the signature. Default X-Hub-Signature-256. }
        enabled: { type: boolean }

    Webhook:
      type: object
      required: [id, agentId, sessionId, name, promptTemplate, signed, signatureHeader, enabled, createdBy, lastError, createdAt]
      properties:
        id: { type: string }
        agentId: { type: string }
        sessionId: { type: string }
        name: { type: string }
        promptTemplate: { type: string }
        signed: { type: boolean }
        signatureHeader: { type: string }
        enabled: { type: boolean }
        createdBy: { $ref: "#/components/schemas/User" }
        lastDeliveryAt: { type: string, format: date-time }
        lastError: { type: string }
        createdAt: { type: string, format: date-time }

    CreatedWebhook:
      allOf:
        - $ref: "#/components/schemas/Webhook"
        - type: object
          required: [url]
          properties:
            url: { type: string, description: The secret delivery URL. Shown once. }
