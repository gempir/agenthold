name: release

# Pushing a semver tag v* (v0.1.0, v0.1.1, v0.2.0-rc.1, ...) publishes a GitHub release with the
# agenthold binary for linux/amd64 and linux/arm64 (static, embedding Firecracker and the jailer;
# it is also the guests' sandboxd), their runtime manifests and SHA256SUMS. Semver tags with a
# prerelease suffix (containing '-') are marked as GitHub pre-releases. Guest kernels, base images
# and harness layers are never published here: hosts of each architecture build them and serve them
# under /dl/assets/ (see the deployment docs). Main commits are not published as GitHub releases;
# CI uploads their binaries as workflow artifacts (ci.yml) and the demo builders build main locally.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing semver tag to release (for example v0.1.0)
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}

jobs:
  meta:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.m.outputs.sha }}
      version: ${{ steps.m.outputs.version }}
      prerelease: ${{ steps.m.outputs.prerelease }}
    steps:
      - id: m
        env:
          INPUT_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          semver_re='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            version="${GITHUB_REF_NAME}"
            sha="$GITHUB_SHA"
          else
            version="$INPUT_TAG"
            [[ "$version" =~ $semver_re ]] || { echo "tag '$version' is not a semver release tag (expected vMAJOR.MINOR.PATCH[-PRERELEASE], e.g. v0.1.0)" >&2; exit 1; }
            gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$version" >/dev/null
            sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$version" --jq .sha)"
          fi
          [[ "$version" =~ $semver_re ]] || { echo "tag '$version' is not a semver release tag (expected vMAJOR.MINOR.PATCH[-PRERELEASE], e.g. v0.1.0)" >&2; exit 1; }
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "unexpected commit sha: $sha" >&2; exit 1; }
          pre=false
          [[ "$version" == *-* ]] && pre=true
          { echo "sha=$sha"; echo "version=$version"; echo "prerelease=$pre"; } >> "$GITHUB_OUTPUT"

  build:
    needs: meta
    name: Release binary (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: web/package.json
      - run: make web
      - run: VERSION=${{ needs.meta.outputs.version }} scripts/release/build.sh --out out
      - name: Smoke test
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          v="$(out/agenthold-linux-$ARCH --version)"
          [[ "$v" == "agenthold $VERSION ("* ]] || { echo "unexpected version: $v" >&2; exit 1; }
          cp "out/agenthold-linux-$ARCH" /tmp/sandboxd
          sv="$(/tmp/sandboxd --version)"
          [[ "$sv" == "sandboxd $VERSION ("* ]] || { echo "unexpected sandboxd version: $sv" >&2; exit 1; }
          file "out/agenthold-linux-$ARCH" | grep -q 'statically linked'
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.arch }}
          path: out/
          if-no-files-found: error

  publish:
    needs: [meta, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.meta.outputs.version }}
          SHA: ${{ needs.meta.outputs.sha }}
          PRE: ${{ needs.meta.outputs.prerelease }}
        run: |
          set -euo pipefail
          mkdir files
          for a in amd64 arm64; do
            (cd "dist/release-$a" && sha256sum --check --quiet SHA256SUMS)
            cp "dist/release-$a/agenthold-linux-$a" "dist/release-$a/runtime-linux-$a.manifest.json" files/
          done
          (cd files && sha256sum agenthold-linux-amd64 agenthold-linux-arm64 runtime-linux-amd64.manifest.json runtime-linux-arm64.manifest.json > SHA256SUMS)
          flags=(--repo "$GITHUB_REPOSITORY" --verify-tag --title "$VERSION" --generate-notes
            --notes "Release binaries of $VERSION ($SHA) for linux/amd64 and linux/arm64. Guest kernels, base images and harness layers are served by the hosts that build them; see https://agenthold.dev/install/.")
          [[ "$PRE" == true ]] && flags+=(--prerelease --latest=false)
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$VERSION" files/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$VERSION" "${flags[@]}" files/*
          fi
