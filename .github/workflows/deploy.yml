name: demo release

# Automatic publication is deliberately disabled until the bundled build and
# the first demo installation have been validated. Enable workflow_run only
# after that review; manual runs are gated identically.
on:
  workflow_dispatch:
  # workflow_run:
  #   workflows: [ci]
  #   types: [completed]

permissions:
  contents: read

concurrency:
  group: demo-main-publication
  cancel-in-progress: false

jobs:
  gate:
    if: >-
      github.repository == 'gempir/agenthold' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          EVENT_SHA: ${{ github.event.workflow_run.head_sha }}
          MANUAL_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = workflow_run ]; then sha="$EVENT_SHA"; else sha="$MANUAL_SHA"; fi
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          head=$(gh api "repos/$REPO/git/ref/heads/main" --jq '.object.sha')
          [ "$sha" = "$head" ] || { echo 'main moved; refusing publication' >&2; exit 1; }
          gh run list --repo "$REPO" --workflow ci.yml --branch main --commit "$sha" --event push --limit 1 \
            --json status,conclusion,headSha | jq -e --arg sha "$sha" \
            'length == 1 and .[0].status == "completed" and .[0].conclusion == "success" and .[0].headSha == $sha' >/dev/null
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  build:
    needs: gate
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/cache@v5
        id: kernel-cache
        with:
          path: |
            ~/.cache/agenthold-kernel
            /var/tmp/agenthold-kernel-arm64-*
            build/guest/arm64/vmlinux*
            build/guest/arm64/kernel.manifest.json
          key: guest-kernel-arm64-${{ hashFiles('scripts/guest/build-kernel.sh', 'scripts/guest/kernel/**') }}
      - run: sudo apt-get update
      - run: make web
      - name: Build guest kernel
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        run: make guest-kernel
      - name: Build bundled binary and matching base
        env:
          VERSION: sha-${{ needs.gate.outputs.sha }}
        run: scripts/release/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: demo-release-${{ needs.gate.outputs.sha }}
          path: build/release/arm64/
          if-no-files-found: error

  publish:
    needs: [gate, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: demo-release-${{ needs.gate.outputs.sha }}
          path: release
      - name: Verify and publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ needs.gate.outputs.sha }}
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          (cd release && sha256sum --check SHA256SUMS)
          jq -e --arg version "sha-$SHA" --arg base "https://github.com/$REPO/releases/download/sha-$SHA/base-arm64.ext4.zst" \
            '.format == 1 and .arch == "arm64" and .version == $version and .base.url == $base' release/runtime-linux-arm64.manifest.json >/dev/null
          tag="sha-$SHA"
          if gh release view "$tag" --repo "$REPO" >/dev/null 2>&1; then
            mkdir prior
            gh release download "$tag" --repo "$REPO" --dir prior --pattern SHA256SUMS \
              --pattern agenthold-linux-arm64 --pattern base-arm64.ext4.zst \
              --pattern base-arm64.manifest.json --pattern runtime-linux-arm64.manifest.json
            (cd prior && sha256sum --check SHA256SUMS)
            cmp prior/SHA256SUMS release/SHA256SUMS || { echo 'existing immutable release differs' >&2; exit 1; }
          else
            gh release create "$tag" release/agenthold-linux-arm64 release/base-arm64.ext4.zst \
              release/base-arm64.manifest.json release/runtime-linux-arm64.manifest.json release/SHA256SUMS \
              --repo "$REPO" --target "$SHA" --prerelease --latest=false --title "Demo $SHA" --notes 'Immutable demo build; artifacts contain no deployment credentials.'
          fi
          gh api "repos/$REPO/git/ref/tags/$tag" | jq -e --arg sha "$SHA" \
            '.object.type == "commit" and .object.sha == $sha' >/dev/null || { echo 'release tag does not point at its commit' >&2; exit 1; }
      - name: Publish current main channel
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ needs.gate.outputs.sha }}
        run: |
          set -euo pipefail
          base="https://github.com/$REPO/releases/download/sha-$SHA"
          binary=$(sha256sum release/agenthold-linux-arm64 | cut -d' ' -f1)
          manifest=$(sha256sum release/runtime-linux-arm64.manifest.json | cut -d' ' -f1)
          jq -n --arg commit "$SHA" --arg base "$base" --arg binary "$binary" --arg manifest "$manifest" \
            '{format:1,arch:"arm64",commit:$commit,binary:{url:($base+"/agenthold-linux-arm64"),sha256:$binary},runtime_manifest:{url:($base+"/runtime-linux-arm64.manifest.json"),sha256:$manifest}}' > channel.json
          head=$(gh api "repos/$REPO/git/ref/heads/main" --jq '.object.sha')
          [ "$SHA" = "$head" ] || { echo 'main moved during build; refusing channel update' >&2; exit 1; }
          if gh release view demo-main --repo "$REPO" >/dev/null 2>&1; then
            gh release upload demo-main channel.json --repo "$REPO" --clobber
          else
            gh release create demo-main channel.json --repo "$REPO" --target "$SHA" --prerelease --latest=false --title 'Demo main channel' --notes 'Mutable pointer to the current tested main build.'
          fi
