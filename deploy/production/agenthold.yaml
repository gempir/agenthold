# agenthold server configuration. ${VAR} and ${VAR:-default} are read from
# the environment (.env). Reference: docs/auth.md, docs/sandboxes.md,
# docs/egress.md.
data_dir: /data

auth:
  providers:
    # Sign in with GitHub (docs/auth-github.md). Callback URL:
    # https://<your domain>/api/v1/auth/callback/github
    - id: github
      type: github
      name: GitHub
      client_id: ${GITHUB_CLIENT_ID}
      client_secret: ${GITHUB_CLIENT_SECRET}

    # Or any OpenID Connect provider (docs/auth-keycloak.md). Callback URL:
    # https://<your domain>/api/v1/auth/callback/oidc
    # - id: oidc
    #   type: oidc
    #   name: Company SSO
    #   issuer: ${OIDC_ISSUER}
    #   client_id: ${OIDC_CLIENT_ID}
    #   client_secret: ${OIDC_CLIENT_SECRET}

sandbox:
  default_image: ${AGENTHOLD_BASE_IMAGE:-ghcr.io/gempir/agenthold-base:latest}
  default_cpus: 2
  default_memory_mb: 4096
  docker:
    # Address range for agent networks. Pick one that does not overlap your
    # LAN or VPN.
    network_pool: ${AGENTHOLD_NETWORK_POOL:-10.213.0.0/16}
    # Optional hardened runtime (docs/hardening.md): runsc (gVisor) or sysbox-runc.
    runtime: ${AGENTHOLD_RUNTIME:-}
